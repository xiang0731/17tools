<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17Tools</title>
    <script>
        (function ensureBasePath() {
            const { pathname } = window.location;
            const lastSegment = pathname.split('/').pop() || '';
            const basePath = pathname.endsWith('/')
                ? pathname
                : lastSegment.includes('.')
                    ? pathname.replace(/[^/]*$/, '')
                    : `${pathname}/`;

            const base = document.createElement('base');
            base.href = basePath || '/';
            document.head.appendChild(base);
        })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        (function applyThemeEarly() {
            try {
                var pref = localStorage.getItem('17tools-theme');
                if (pref == null) {
                    pref = localStorage.getItem('theme');
                    if (pref != null) {
                        localStorage.setItem('17tools-theme', pref);
                    }
                }
                var theme = (pref === 'light' || pref === 'dark')
                    ? pref
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* 存储不可用时由后续 ThemeManager 降级 */ }
        })();
    </script>
    <link rel="stylesheet" href="css/theme.css">
    <link href="vendor/fontawesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 280px;
            --top-bar-height: 60px;
            --footer-height: 40px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background-primary);
            color: var(--text-primary);
            transition: background-color var(--transition-base), color var(--transition-base);
            overflow-x: hidden;
            line-height: 1.6;
        }

        .app-container {
            display: flex;
            height: 100vh;
            height: 100dvh;
            min-width: 0;
            overflow: hidden;
        }

        /* 顶部工具栏 */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--top-bar-height);
            background-color: var(--background-primary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            transition: all var(--transition-base);
            box-shadow: var(--shadow-light);
            backdrop-filter: blur(10px);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            min-width: 0;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .logo i {
            font-size: 28px;
        }

        .toggle-sidebar {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
            min-width: 44px;
            min-height: 44px;
        }

        .toggle-sidebar:hover {
            background-color: var(--background-secondary);
            color: var(--text-primary);
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .theme-picker {
            position: relative;
            flex: 0 0 auto;
        }

        .theme-toggle {
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            min-height: 44px;
            font-family: inherit;
        }

        .theme-toggle:hover {
            background-color: var(--primary-color);
            color: var(--text-inverse);
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .theme-menu {
            position: absolute;
            top: calc(100% + var(--spacing-xs));
            right: 0;
            min-width: 160px;
            padding: var(--spacing-xs);
            background: var(--background-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            z-index: 1100;
        }

        .theme-menu[hidden] {
            display: none;
        }

        .theme-menu-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            width: 100%;
            min-height: 44px;
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
        }

        .theme-menu-item:hover,
        .theme-menu-item:focus-visible {
            background: var(--background-hover);
            outline: none;
        }

        .theme-menu-item[aria-checked="true"] {
            color: var(--primary-color);
        }

        .view-toggle {
            background: var(--accent-color);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            font-weight: 500;
            min-height: 44px;
            font-family: inherit;
        }

        .view-toggle:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        /* 侧边栏 */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--background-secondary);
            border-right: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding-top: var(--top-bar-height);
            height: 100vh;
            height: 100dvh;
            overflow-y: auto;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
        }

        .sidebar.collapsed {
            width: 0;
            padding: 0;
            overflow: hidden;
        }

        .sidebar-content {
            padding: 0 0 20px;
        }

        #tool-navigation-sections {
            padding-top: 20px;
        }

        .sidebar-search {
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 12px 14px 10px;
            background-color: var(--background-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .search-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-field>.fa-search {
            position: absolute;
            left: 12px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .tool-search-input {
            width: 100%;
            min-width: 0;
            height: 40px;
            padding: 8px 40px 8px 36px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--background-primary);
            color: var(--text-primary);
            font: inherit;
            font-size: 14px;
        }

        .tool-search-input::placeholder {
            color: var(--text-secondary);
        }

        .tool-search-input::-webkit-search-cancel-button {
            appearance: none;
        }

        .search-clear {
            position: absolute;
            right: 4px;
            display: inline-flex;
            width: 32px;
            height: 32px;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .search-clear:hover {
            background-color: var(--background-tertiary);
            color: var(--text-primary);
        }

        .search-status {
            margin: 10px 6px 2px;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.5;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0 20px 8px;
            margin-bottom: 8px;
        }

        .nav-item {
            display: flex;
            width: 100%;
            align-items: center;
            padding: 12px 20px;
            border: 0;
            border-left: 3px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.6;
            text-align: left;
        }

        .nav-item:hover {
            background-color: var(--background-tertiary);
            color: var(--text-primary);
            border-left-color: var(--primary-color);
        }

        .nav-item.active {
            background-color: var(--primary-soft);
            color: var(--primary-color);
            border-left-color: var(--primary-color);
        }

        .nav-item:focus-visible,
        .toggle-sidebar:focus-visible,
        .theme-toggle:focus-visible,
        .view-toggle:focus-visible,
        .search-clear:focus-visible,
        .tool-search-input:focus-visible,
        .footer a:focus-visible,
        .password-btn:focus-visible,
        .password-input:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 2px;
        }

        [hidden] {
            display: none !important;
        }

        .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding-top: var(--top-bar-height);
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100vh;
            height: 100dvh;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--background-primary);
            overflow: hidden;
        }

        .main-content.expanded {
            margin-left: 0;
        }

        .content-wrapper {
            position: relative;
            flex: 1;
            padding: 16px;
            display: flex;
            min-height: 0;
        }

        .content-frame {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            background-color: var(--background-primary);
            box-shadow: var(--shadow-light);
            overflow: hidden;
            flex: 1;
        }

        /* 底部状态栏 */
        .footer {
            flex: 0 0 var(--footer-height);
            min-width: 0;
            min-height: var(--footer-height);
            background-color: var(--background-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-md);
            font-size: 12px;
            color: var(--text-secondary);
            z-index: 50;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--primary-color);
        }

        .footer a {
            display: inline-flex;
            min-height: 32px;
            align-items: center;
        }

        .footer-separator {
            width: 1px;
            height: 12px;
            background-color: var(--border-color);
        }

        .footer-stat-separator {
            display: inline-block;
            margin-left: 16px;
            vertical-align: middle;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .sidebar {
                width: min(88vw, 360px);
                transform: translateX(-100%);
                backdrop-filter: blur(10px);
                background-color: rgba(248, 250, 252, 0.95);
            }

            [data-theme="dark"] .sidebar {
                background-color: rgba(31, 41, 55, 0.95);
            }

            .sidebar.mobile-visible {
                transform: translateX(0);
            }

            .preferred-desktop-view .sidebar {
                width: min(var(--sidebar-width), 82vw);
            }

            .main-content {
                margin-left: 0;
            }

            .footer {
                padding: 4px 10px;
                flex-wrap: wrap;
                height: auto;
                min-height: var(--footer-height);
                justify-content: center;
                text-align: center;
                gap: 2px 14px;
            }

            .footer-separator {
                display: none;
            }

            .top-bar {
                padding: 0 16px;
            }

            .logo {
                font-size: 20px;
            }

            .content-wrapper {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .top-bar {
                padding: 0 8px;
            }

            .top-bar-left,
            .top-bar-right {
                gap: 6px;
            }

            .logo {
                font-size: 19px;
            }

            .logo i {
                display: none;
            }

            .theme-toggle,
            .view-toggle {
                padding: 8px;
            }

            .theme-toggle {
                gap: 4px;
            }

            .theme-menu {
                right: 0;
                left: auto;
            }

            .view-toggle {
                font-size: 12px;
            }

            .nav-item {
                padding: 16px 20px;
                font-size: 16px;
            }

            .preferred-desktop-view .nav-item {
                padding: 12px 20px;
                font-size: 14px;
            }

            .content-wrapper {
                padding: 12px;
            }

            .tool-load-overlay {
                inset: 12px;
            }

            .footer {
                flex: 0 0 auto;
                padding: 4px 8px;
                font-size: 11px;
            }

            .footer #busuanzi_container_site_pv,
            .footer #busuanzi_container_site_uv {
                display: none !important;
            }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--background-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .tool-load-overlay {
            position: absolute;
            inset: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background-color: var(--background-primary);
            z-index: 20;
            pointer-events: auto;
        }

        .tool-load-overlay.is-visible {
            display: flex;
        }

        .tool-load-card {
            width: min(360px, 82%);
            text-align: center;
        }

        .tool-load-label {
            margin: 0 0 14px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .tool-load-track {
            height: 6px;
            border-radius: 999px;
            background-color: var(--background-tertiary);
            overflow: hidden;
        }

        .tool-load-bar {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background-color: var(--primary-color);
            transition: width 0.16s linear;
        }

        .tool-load-pct {
            margin: 10px 0 0;
            font-size: 12px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        /* 动画效果 */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-item {
            animation: slideIn 0.3s ease forwards;
        }

        .nav-item:nth-child(2) {
            animation-delay: 0.1s;
        }

        .nav-item:nth-child(3) {
            animation-delay: 0.2s;
        }

        .nav-item:nth-child(4) {
            animation-delay: 0.3s;
        }

        .nav-item:nth-child(5) {
            animation-delay: 0.4s;
        }

        .nav-item:nth-child(6) {
            animation-delay: 0.5s;
        }

        .nav-item:nth-child(7) {
            animation-delay: 0.6s;
        }

        .nav-item:nth-child(8) {
            animation-delay: 0.7s;
        }

        .nav-item:nth-child(9) {
            animation-delay: 0.8s;
        }

        /* 密码保护样式 */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        .password-modal {
            background-color: var(--background-primary);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow-large);
            width: 400px;
            max-width: 90%;
            text-align: center;
        }

        .password-modal h3 {
            color: var(--text-primary);
            margin-bottom: 16px;
            font-size: 24px;
            font-weight: 600;
        }

        .password-modal p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .password-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--background-secondary);
            color: var(--text-primary);
            margin-bottom: 16px;
            transition: border-color 0.3s ease;
        }

        .password-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .password-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .password-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .password-btn.primary {
            background-color: var(--primary-color);
            color: white;
        }

        .password-btn.primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .password-btn.secondary {
            background-color: var(--background-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .password-btn.secondary:hover {
            background-color: var(--background-tertiary);
        }

        .password-error {
            color: #ef4444;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .password-btn.danger {
            background-color: #ef4444;
            color: white;
        }

        .password-btn.danger:hover {
            background-color: #dc2626;
        }

        /* 研发中项目样式 */
        .dev-item {
            opacity: 0.7;
        }

        .dev-item:hover {
            opacity: 1;
        }

        body.modal-open {
            overflow: hidden;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .nav-item {
                animation: none !important;
            }

            .theme-toggle:hover,
            .view-toggle:hover,
            .password-btn:hover,
            .theme-menu-item:hover {
                transform: none;
            }
        }

        .saved-tools { padding: var(--spacing-sm) var(--spacing-md); border-bottom: 1px solid var(--border-color); }
        .saved-tools summary { cursor: pointer; color: var(--text-secondary); padding-block: var(--spacing-sm); }
        .saved-tools p { font-size: 12px; color: var(--text-secondary); overflow-wrap: anywhere; }
        .saved-tool-button { display: block; width: 100%; text-align: left; font: inherit; color: var(--text-primary); background: var(--background-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: var(--spacing-sm); margin-block: var(--spacing-xs); cursor: pointer; overflow-wrap: anywhere; }
        .saved-tool-button:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
        @media (max-width: 768px) { .saved-tool-button { min-height: 44px; } }
    </style>

    <!-- 认证管理模块 -->
    <script src="js/auth.js"></script>
    <script src="js/safe-storage.js"></script>
    <script src="js/unsaved-guard.js"></script>
    <script src="js/load-progress.js"></script>
    <script src="js/tool-route-core.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- 顶部工具栏 -->
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="toggle-sidebar" id="toggle-btn" type="button" aria-label="收起工具导航"
                    title="收起工具导航" aria-controls="sidebar" aria-expanded="true">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
                <div class="logo">
                    <i class="fas fa-tools" aria-hidden="true"></i>
                    17Tools
                </div>
            </div>
            <div class="top-bar-right">
                <div class="theme-picker" id="theme-picker">
                    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="主题：跟随系统"
                        title="主题：跟随系统" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu">
                        <i class="fas fa-desktop" aria-hidden="true"></i>
                        <span>跟随系统</span>
                    </button>
                    <div class="theme-menu" id="theme-menu" role="menu" hidden>
                        <button type="button" class="theme-menu-item" role="menuitemradio" data-theme-pref="system"
                            aria-checked="true">
                            <i class="fas fa-desktop" aria-hidden="true"></i>
                            跟随系统
                        </button>
                        <button type="button" class="theme-menu-item" role="menuitemradio" data-theme-pref="light"
                            aria-checked="false">
                            <i class="fas fa-sun" aria-hidden="true"></i>
                            浅色
                        </button>
                        <button type="button" class="theme-menu-item" role="menuitemradio" data-theme-pref="dark"
                            aria-checked="false">
                            <i class="fas fa-moon" aria-hidden="true"></i>
                            深色
                        </button>
                    </div>
                </div>
                <button class="view-toggle" id="switch-view" type="button" hidden aria-label="切换到桌面视图"
                    title="切换到桌面视图" aria-pressed="false">
                    切换到桌面视图
                </button>
            </div>
        </header>

        <!-- 侧边栏 -->
        <nav class="sidebar" id="sidebar" aria-label="工具导航">

    <script>
        const appPrefs = (window.SafeStorage && (window.SafeStorage.shared || window.SafeStorage.createShared(window))) || (function () {
            const memory = {};
            try {
                return {
                    getItem: function (key) { return localStorage.getItem(key); },
                    setItem: function (key, value) {
                        localStorage.setItem(key, value);
                        return { persisted: true, verified: true };
                    }
                };
            } catch (error) {
                return {
                    getItem: function (key) {
                        return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null;
                    },
                    setItem: function (key, value) {
                        memory[key] = String(value);
                        return { persisted: false, verified: false };
                    }
                };
            }
        }());

        const THEME_KEYS = {
            theme: '17tools-theme',
            hasVisited: '17tools-has-visited',
            preferDesktop: '17tools-prefer-desktop',
            legacyTheme: 'theme',
            legacyHasVisited: 'hasVisited',
            legacyPreferDesktop: 'preferDesktop'
        };

        function migrateLegacyPrefs(storage) {
            function move(fromKey, toKey) {
                if (storage.getItem(toKey) != null) {
                    return;
                }
                const value = storage.getItem(fromKey);
                if (value != null) {
                    storage.setItem(toKey, value);
                }
            }
            move(THEME_KEYS.legacyTheme, THEME_KEYS.theme);
            move(THEME_KEYS.legacyHasVisited, THEME_KEYS.hasVisited);
            move(THEME_KEYS.legacyPreferDesktop, THEME_KEYS.preferDesktop);
        }

        function isValidTheme(theme) {
            return theme === 'light' || theme === 'dark';
        }

        function isValidPreference(pref) {
            return pref === 'light' || pref === 'dark' || pref === 'system';
        }

        function getSystemTheme() {
            try {
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            } catch (e) {
                return 'light';
            }
        }

        function readThemePreference(storage) {
            migrateLegacyPrefs(storage);
            const pref = storage.getItem(THEME_KEYS.theme);
            return isValidPreference(pref) ? pref : 'system';
        }

        migrateLegacyPrefs(appPrefs);
        if (appPrefs.getItem(THEME_KEYS.hasVisited) == null) {
            appPrefs.setItem(THEME_KEYS.hasVisited, 'true');
        }

        // 主题管理（壳页自己的 ThemeManager，不要再加载 js/theme.js）
        class ThemeManager {
            constructor() {
                this.menuOpen = false;
                this.preference = readThemePreference(appPrefs);
                this.currentTheme = isValidTheme(this.preference) ? this.preference : getSystemTheme();
                this.init();
            }

            init() {
                this.applyTheme(this.currentTheme);
                this.updateThemeButton();
                this.bindThemeControls();
                this.watchSystemTheme();
            }

            bindThemeControls() {
                const button = document.getElementById('theme-toggle');
                const menu = document.getElementById('theme-menu');
                if (!button || !menu) {
                    return;
                }

                button.addEventListener('click', (event) => {
                    event.stopPropagation();
                    this.toggleMenu();
                });
                button.addEventListener('keydown', (event) => {
                    if (event.key === 'ArrowDown') {
                        event.preventDefault();
                        this.openMenu();
                    }
                });
                menu.querySelectorAll('[data-theme-pref]').forEach((item) => {
                    item.addEventListener('click', (event) => {
                        event.stopPropagation();
                        this.setPreference(item.getAttribute('data-theme-pref'));
                        this.closeMenu();
                    });
                });
                menu.addEventListener('keydown', (event) => this.handleMenuKeydown(event));
                document.addEventListener('click', () => this.closeMenu());
                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape') {
                        this.closeMenu();
                    }
                });
            }

            menuItems() {
                return Array.from(document.querySelectorAll('#theme-menu [data-theme-pref]'));
            }

            toggleMenu() {
                if (this.menuOpen) {
                    this.closeMenu();
                } else {
                    this.openMenu();
                }
            }

            openMenu() {
                const button = document.getElementById('theme-toggle');
                const menu = document.getElementById('theme-menu');
                if (!button || !menu) {
                    return;
                }
                menu.hidden = false;
                button.setAttribute('aria-expanded', 'true');
                this.menuOpen = true;
                const selected = menu.querySelector('[aria-checked="true"]') || this.menuItems()[0];
                if (selected) {
                    selected.focus();
                }
            }

            closeMenu() {
                const button = document.getElementById('theme-toggle');
                const menu = document.getElementById('theme-menu');
                if (!button || !menu || !this.menuOpen) {
                    return;
                }
                menu.hidden = true;
                button.setAttribute('aria-expanded', 'false');
                this.menuOpen = false;
                if (menu.contains(document.activeElement)) {
                    button.focus({ preventScroll: true });
                }
            }

            handleMenuKeydown(event) {
                const items = this.menuItems();
                if (!items.length) {
                    return;
                }
                const currentIndex = items.indexOf(document.activeElement);
                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    items[(currentIndex + 1 + items.length) % items.length].focus();
                } else if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    items[(currentIndex - 1 + items.length) % items.length].focus();
                } else if (event.key === 'Home') {
                    event.preventDefault();
                    items[0].focus();
                } else if (event.key === 'End') {
                    event.preventDefault();
                    items[items.length - 1].focus();
                } else if (event.key === 'Escape') {
                    event.preventDefault();
                    this.closeMenu();
                }
            }

            setPreference(pref) {
                if (!isValidPreference(pref)) {
                    pref = 'system';
                }
                this.preference = pref;
                appPrefs.setItem(THEME_KEYS.theme, pref);
                this.currentTheme = isValidTheme(pref) ? pref : getSystemTheme();
                this.applyTheme(this.currentTheme);
                this.updateThemeButton();
                this.syncThemeToIframe();
            }

            watchSystemTheme() {
                if (!window.matchMedia) {
                    return;
                }
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const onChange = (event) => {
                    if (this.preference !== 'system') {
                        return;
                    }
                    this.currentTheme = event.matches ? 'dark' : 'light';
                    this.applyTheme(this.currentTheme);
                    this.syncThemeToIframe();
                };
                if (typeof mediaQuery.addEventListener === 'function') {
                    mediaQuery.addEventListener('change', onChange);
                } else if (typeof mediaQuery.addListener === 'function') {
                    mediaQuery.addListener(onChange);
                }
            }

            syncThemeToIframe() {
                const iframe = document.getElementById('content-frame');
                if (!iframe) return;

                const getIframeTargetOrigin = () => {
                    try {
                        const frameUrl = new URL(iframe.src || iframe.getAttribute('src'), window.location.href);
                        if (frameUrl.origin === 'null' || window.location.origin === 'null') {
                            return '*';
                        }
                        return frameUrl.origin;
                    } catch (e) {
                        return window.location.origin === 'null' ? '*' : window.location.origin;
                    }
                };

                // 首选：postMessage，无跨域限制
                try {
                    if (iframe.contentWindow) {
                        iframe.contentWindow.postMessage(
                            { type: '17tools-theme', theme: this.currentTheme }, getIframeTargetOrigin()
                        );
                    }
                } catch (e) { }

                // 兜底：直接设置 data-theme（同源时生效）
                try {
                    const frameDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (frameDoc) {
                        frameDoc.documentElement.setAttribute('data-theme', this.currentTheme);
                    }
                } catch (e) { }
            }

            applyTheme(theme) {
                if (!isValidTheme(theme)) {
                    theme = getSystemTheme();
                }
                this.currentTheme = theme;
                document.documentElement.setAttribute('data-theme', theme);
            }

            updateThemeButton() {
                const button = document.getElementById('theme-toggle');
                const icon = button.querySelector('i');
                const text = button.querySelector('span');
                const labels = {
                    system: { icon: 'fas fa-desktop', text: '跟随系统', action: '主题：跟随系统' },
                    light: { icon: 'fas fa-sun', text: '浅色', action: '主题：浅色' },
                    dark: { icon: 'fas fa-moon', text: '深色', action: '主题：深色' }
                };
                const current = labels[this.preference] || labels.system;
                icon.className = current.icon;
                text.textContent = current.text;
                icon.setAttribute('aria-hidden', 'true');
                button.setAttribute('aria-label', current.action);
                button.setAttribute('title', current.action);
                this.menuItems().forEach((item) => {
                    const pref = item.getAttribute('data-theme-pref');
                    item.setAttribute('aria-checked', String(pref === this.preference));
                });
            }
        }

        // 权限管理 - 已移至独立文件 js/auth.js

        // 应用管理
        class AppManager {
            constructor() {
                this.mobileUserAgent = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                this.isMobile = this.mobileUserAgent || window.matchMedia('(max-width: 768px)').matches;
                this.userPreferDesktop = appPrefs.getItem(THEME_KEYS.preferDesktop) === 'true';
                this.currentMobileMode = this.isMobile && !this.userPreferDesktop;
                this.leaveDialogOpen = false;
                this.currentFile = (window.ToolRoute && ToolRoute.DEFAULT_FILE) || 'Welcome.html';
                this.sessionStore = this.createSessionStore();
                this.toolPreferences = ToolCatalog.createPreferences(appPrefs);
                this.searchInput = document.getElementById('tool-search');
                this.searchClear = document.getElementById('search-clear');
                this.searchStatus = document.getElementById('search-status');
                this.init();
            }

            init() {
                this.bindEvents();
                this.updateLayout();
                this.updateViewToggleButton();
                this.applyInitialRoute();
                this.renderSavedTools();
            }

            bindEvents() {
                document.getElementById('favorite-toggle').addEventListener('click', () => {
                    const result = this.toolPreferences.toggle(this.currentFile);
                    this.renderSavedTools();
                    document.getElementById('favorite-status').textContent = result.persisted
                        ? (result.favorite ? '已收藏此工具' : '已取消收藏')
                        : '本次会话已更新，浏览器未允许保存偏好';
                });
                // 切换侧边栏
                document.getElementById('toggle-btn').addEventListener('click', () => {
                    this.toggleSidebar();
                });

                // 视图切换
                document.getElementById('switch-view').addEventListener('click', () => {
                    this.toggleView();
                });

                // 导航项点击
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        this.navigateToPage(e.target.closest('.nav-item'));
                    });
                    item.addEventListener('keydown', (event) => {
                        this.handleSearchResultKeydown(event, item);
                    });
                });

                this.searchInput.addEventListener('input', () => this.filterTools());
                this.searchInput.addEventListener('keydown', (event) => this.handleSearchInputKeydown(event));
                this.searchClear.addEventListener('click', () => this.clearSearch(true));
                document.addEventListener('keydown', (event) => {
                    const target = event.target;
                    const isTyping = target && (target.matches('input, textarea, select') || target.isContentEditable);
                    if (event.key === '/' && !isTyping && !event.ctrlKey && !event.metaKey && !event.altKey) {
                        event.preventDefault();
                        if (this.currentMobileMode) {
                            document.getElementById('sidebar').classList.add('mobile-visible');
                            this.syncSidebarControl();
                        }
                        this.searchInput.focus();
                    }
                });

                // 窗口大小变化
                window.addEventListener('resize', () => {
                    this.handleResize();
                });

                window.addEventListener('popstate', (event) => {
                    this.handlePopState(event);
                });
                window.addEventListener('message', (event) => {
                    this.handleFrameMessage(event);
                });
            }

            toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const mainContent = document.getElementById('main-content');

                if (this.isMobile) {
                    sidebar.classList.toggle('mobile-visible');
                } else {
                    const isCollapsed = sidebar.classList.contains('collapsed');
                    sidebar.classList.toggle('collapsed');
                    mainContent.classList.toggle('expanded', !isCollapsed);
                }
                this.syncSidebarControl();
            }

            toggleView() {
                this.currentMobileMode = !this.currentMobileMode;
                appPrefs.setItem(THEME_KEYS.preferDesktop, (!this.currentMobileMode).toString());
                this.updateLayout();
                this.updateViewToggleButton();
            }

            updateLayout() {
                const sidebar = document.getElementById('sidebar');
                const mainContent = document.getElementById('main-content');
                document.documentElement.classList.toggle(
                    'preferred-desktop-view',
                    this.isMobile && !this.currentMobileMode
                );

                if (this.isMobile) {
                    sidebar.classList.remove('collapsed');
                    sidebar.classList.remove('mobile-visible');
                    mainContent.classList.remove('expanded');
                } else {
                    sidebar.classList.remove('mobile-visible');
                }
                this.syncSidebarControl();
            }

            updateViewToggleButton() {
                const button = document.getElementById('switch-view');
                if (this.isMobile) {
                    const actionLabel = this.currentMobileMode ? '切换到桌面视图' : '切换到移动视图';
                    button.hidden = false;
                    button.textContent = actionLabel;
                    button.setAttribute('aria-label', actionLabel);
                    button.setAttribute('title', actionLabel);
                    button.setAttribute('aria-pressed', String(!this.currentMobileMode));
                } else {
                    button.hidden = true;
                }
            }

            syncSidebarControl() {
                const sidebar = document.getElementById('sidebar');
                const button = document.getElementById('toggle-btn');
                const isOpen = this.isMobile
                    ? sidebar.classList.contains('mobile-visible')
                    : !sidebar.classList.contains('collapsed');
                const actionLabel = this.isMobile
                    ? (isOpen ? '关闭工具导航' : '打开工具导航')
                    : (isOpen ? '收起工具导航' : '展开工具导航');
                button.setAttribute('aria-expanded', String(isOpen));
                button.setAttribute('aria-label', actionLabel);
                button.setAttribute('title', actionLabel);
                if (isOpen) {
                    sidebar.removeAttribute('inert');
                    sidebar.removeAttribute('aria-hidden');
                } else {
                    sidebar.setAttribute('inert', '');
                    sidebar.setAttribute('aria-hidden', 'true');
                }
            }

            renderSavedTools() {
                const current = ToolCatalog.get(this.currentFile);
                const button = document.getElementById('favorite-toggle');
                const favorite = this.toolPreferences.favorites().includes(this.currentFile);
                button.disabled = !current;
                button.textContent = current ? (favorite ? '取消收藏：' : '收藏：') + current.name : '打开工具后可收藏';
                button.setAttribute('aria-pressed', String(favorite));
                const render = (id, files, empty) => {
                    const container = document.getElementById(id);
                    container.replaceChildren();
                    if (!files.length) { const note = document.createElement('p'); note.textContent = empty; container.appendChild(note); }
                    files.forEach(file => {
                        const item = ToolCatalog.get(file);
                        const shortcut = document.createElement('button');
                        shortcut.type = 'button';
                        shortcut.className = 'saved-tool-button';
                        shortcut.setAttribute('data-tool', file);
                        shortcut.textContent = item.name;
                        shortcut.addEventListener('click', () => {
                            const target = this.findNavItem(file);
                            if (target) this.navigateToPage(target, { trigger: shortcut });
                        });
                        container.appendChild(shortcut);
                    });
                };
                render('favorite-tools', this.toolPreferences.favorites(), '在工具内点击收藏，常用工具会显示在这里');
                render('recent-tools', this.toolPreferences.recent(), '打开一个工具后，最近使用会显示在这里');
            }

            getSearchableItems() {
                return Array.from(document.querySelectorAll('.nav-item[data-searchable="true"]'));
            }

            getVisibleSearchResults() {
                return this.getSearchableItems().filter(item => !item.hidden);
            }

            filterTools() {
                const query = this.searchInput.value.trim().toLocaleLowerCase('zh-CN');
                const hasQuery = query.length > 0;
                const searchableItems = this.getSearchableItems();

                document.querySelectorAll('.nav-item').forEach(item => {
                    if (item.getAttribute('data-searchable') !== 'true') {
                        item.hidden = hasQuery;
                        return;
                    }
                    const label = item.textContent.trim().toLocaleLowerCase('zh-CN');
                    item.hidden = hasQuery && !(label.includes(query) || ToolCatalog.matches(item.getAttribute('data-file'), query));
                });

                document.querySelectorAll('.nav-section').forEach(section => {
                    section.hidden = hasQuery && !section.querySelector('.nav-item[data-searchable="true"]:not([hidden])');
                });

                const resultCount = this.getVisibleSearchResults().length;
                this.searchClear.hidden = !hasQuery;
                this.searchStatus.hidden = !hasQuery;
                this.searchStatus.textContent = hasQuery
                    ? (resultCount > 0 ? `找到 ${resultCount} 个公开工具` : '没有找到匹配的公开工具')
                    : '';
            }

            clearSearch(restoreFocus) {
                this.searchInput.value = '';
                this.filterTools();
                if (restoreFocus) {
                    this.searchInput.focus();
                }
            }

            handleSearchInputKeydown(event) {
                const results = this.getVisibleSearchResults();
                if (event.key === 'Escape') {
                    event.preventDefault();
                    this.clearSearch(true);
                    return;
                }
                if (!results.length) {
                    return;
                }
                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    results[0].focus();
                } else if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    results[results.length - 1].focus();
                } else if (event.key === 'Enter' && this.searchInput.value.trim()) {
                    event.preventDefault();
                    results[0].click();
                }
            }

            handleSearchResultKeydown(event, item) {
                if (!this.searchInput.value.trim()) {
                    return;
                }
                if (event.key === 'Escape') {
                    event.preventDefault();
                    this.clearSearch(true);
                    return;
                }
                if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') {
                    return;
                }
                const results = this.getVisibleSearchResults();
                const currentIndex = results.indexOf(item);
                if (currentIndex === -1) {
                    return;
                }
                event.preventDefault();
                const offset = event.key === 'ArrowDown' ? 1 : -1;
                results[(currentIndex + offset + results.length) % results.length].focus();
            }

            createSessionStore() {
                try {
                    const backend = window.sessionStorage;
                    backend.getItem((window.ToolRoute && ToolRoute.STORAGE_KEY) || '17tools-last-tool');
                    return backend;
                } catch (e) {
                    const memory = {};
                    return {
                        getItem: function (key) {
                            return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null;
                        },
                        setItem: function (key, value) {
                            memory[key] = String(value);
                        }
                    };
                }
            }

            getAllowlist() {
                const files = Array.from(document.querySelectorAll('.nav-item[data-file]'))
                    .map((item) => item.getAttribute('data-file'));
                return window.ToolRoute ? ToolRoute.collectAllowlist(files) : files;
            }

            getProtectedFiles() {
                const files = Array.from(document.querySelectorAll('.nav-item[data-protected="true"]'))
                    .map((item) => item.getAttribute('data-file'));
                return window.ToolRoute ? ToolRoute.collectAllowlist(files) : files;
            }

            findNavItem(file) {
                const fallback = (window.ToolRoute && ToolRoute.DEFAULT_FILE) || 'Welcome.html';
                const name = window.ToolRoute ? (ToolRoute.normalizeFileName(file) || fallback) : file;
                return document.querySelector('.nav-item[data-file="' + name + '"]')
                    || document.querySelector('.nav-item[data-file="' + fallback + '"]');
            }

            syncHistory(fileName, mode) {
                if (!window.ToolRoute || !window.history) {
                    return;
                }
                const href = ToolRoute.buildHref(window.location, fileName);
                const state = { file: fileName };
                if (mode === 'replace' && typeof history.replaceState === 'function') {
                    history.replaceState(state, '', href);
                    return;
                }
                if (typeof history.pushState === 'function') {
                    history.pushState(state, '', href);
                }
            }

            restoreCurrentUrl() {
                this.syncHistory(this.currentFile || ToolRoute.DEFAULT_FILE, 'push');
            }

            assignFrameSrc(iframe, relativeSrc) {
                if (!iframe || !iframe.parentNode) {
                    return;
                }
                const next = iframe.cloneNode(false);
                next.removeAttribute('src');
                next.src = relativeSrc;
                iframe.replaceWith(next);
            }

            decorateFrame(iframe, fileName, toolLabel) {
                if (!iframe) {
                    return;
                }
                iframe.setAttribute('title', `17Tools - ${toolLabel}`);
                iframe.setAttribute('aria-label', `${toolLabel}内容`);
                iframe.setAttribute('data-tool', fileName);
            }

            applyInitialRoute() {
                const allowlist = this.getAllowlist();
                const file = window.ToolRoute
                    ? ToolRoute.resolveEntry({
                        search: window.location.search,
                        hash: window.location.hash,
                        lastTool: ToolRoute.readLastTool(this.sessionStore),
                        allowlist: allowlist
                    })
                    : 'Welcome.html';
                const navItem = this.findNavItem(file);
                const needsAuth = window.ToolRoute
                    ? ToolRoute.needsAuth(file, this.getProtectedFiles(), !!(passwordManager && passwordManager.isAuthenticated))
                    : false;
                if (needsAuth) {
                    this.syncHistory(file, 'replace');
                    passwordManager.checkAccess(() => {
                        passwordManager.updateProtectedItemNames();
                        this.performNavigation(navItem, { history: 'replace' });
                    });
                    return;
                }
                this.performNavigation(navItem, { history: 'replace' });
            }

            handlePopState(event) {
                const allowlist = this.getAllowlist();
                const fromState = event && event.state && event.state.file;
                const file = window.ToolRoute
                    ? (fromState
                        ? ToolRoute.resolveFile(fromState, allowlist)
                        : ToolRoute.resolveEntry({
                            search: window.location.search,
                            hash: window.location.hash,
                            allowlist: allowlist
                        }))
                    : 'Welcome.html';
                if (this.leaveDialogOpen) {
                    this.restoreCurrentUrl();
                    return;
                }
                this.navigateToPage(this.findNavItem(file), { fromHistory: true });
            }

            handleFrameMessage(event) {
                const iframe = document.getElementById('content-frame');
                const file = window.ToolRoute
                    ? ToolRoute.readNavigateFile(event, iframe, this.getAllowlist())
                    : '';
                if (!file) {
                    return;
                }
                this.navigateToPage(this.findNavItem(file));
            }

            isCurrentPage(navItem) {
                const fileName = navItem && navItem.getAttribute('data-file');
                if (this.currentFile && fileName && this.currentFile === fileName) {
                    return true;
                }
                const iframe = document.getElementById('content-frame');
                const currentSrc = iframe ? (iframe.getAttribute('src') || '') : '';
                return UnsavedGuard.isSameToolPage(currentSrc, fileName);
            }

            hasUnsavedContent() {
                try {
                    const iframe = document.getElementById('content-frame');
                    const currentSrc = this.currentFile || (iframe ? (iframe.src || iframe.getAttribute('src') || '') : '');
                    if (UnsavedGuard.isExcludedPage(currentSrc)) {
                        return false;
                    }
                    const frameWindow = iframe && iframe.contentWindow;
                    const guard = frameWindow && frameWindow.__17toolsUnsaved;
                    return !!(guard && guard.isDirty(frameWindow.document));
                } catch (e) {
                    return false;
                }
            }

            checkUnsaved(callback) {
                const iframe = document.getElementById('content-frame');
                if (!iframe || typeof UnsavedGuard === 'undefined' || !UnsavedGuard.requestDirty) {
                    callback(false);
                    return;
                }
                if (UnsavedGuard.isExcludedPage(this.currentFile || '')) {
                    callback(false);
                    return;
                }
                UnsavedGuard.requestDirty(iframe, callback);
            }

            confirmLeave(onLeave, trigger, onStay) {
                if (this.leaveDialogOpen) {
                    return;
                }
                this.leaveDialogOpen = true;
                const appContainer = document.querySelector('.app-container');
                const previousAriaHidden = appContainer.getAttribute('aria-hidden');

                const overlay = document.createElement('div');
                overlay.className = 'password-overlay';
                overlay.id = 'unsaved-leave-overlay';
                overlay.setAttribute('role', 'dialog');
                overlay.setAttribute('aria-modal', 'true');
                overlay.setAttribute('aria-labelledby', 'unsaved-leave-title');
                overlay.setAttribute('aria-describedby', 'unsaved-leave-description');

                const modal = document.createElement('div');
                modal.className = 'password-modal';

                const title = document.createElement('h3');
                title.id = 'unsaved-leave-title';
                title.textContent = '确定离开？';

                const message = document.createElement('p');
                message.id = 'unsaved-leave-description';
                message.textContent = '已输入的内容将不会保留。';

                const buttons = document.createElement('div');
                buttons.className = 'password-buttons';

                const stayBtn = document.createElement('button');
                stayBtn.type = 'button';
                stayBtn.className = 'password-btn primary';
                stayBtn.textContent = '留下';

                const leaveBtn = document.createElement('button');
                leaveBtn.type = 'button';
                leaveBtn.className = 'password-btn danger';
                leaveBtn.textContent = '离开';

                buttons.appendChild(stayBtn);
                buttons.appendChild(leaveBtn);
                modal.appendChild(title);
                modal.appendChild(message);
                modal.appendChild(buttons);
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
                appContainer.setAttribute('inert', '');
                appContainer.setAttribute('aria-hidden', 'true');
                document.body.classList.add('modal-open');
                stayBtn.focus();

                const close = (shouldLeave) => {
                    if (!this.leaveDialogOpen) {
                        return;
                    }
                    this.leaveDialogOpen = false;
                    document.removeEventListener('keydown', onKeyDown);
                    overlay.remove();
                    appContainer.removeAttribute('inert');
                    if (previousAriaHidden === null) {
                        appContainer.removeAttribute('aria-hidden');
                    } else {
                        appContainer.setAttribute('aria-hidden', previousAriaHidden);
                    }
                    document.body.classList.remove('modal-open');
                    if (trigger && typeof trigger.focus === 'function') {
                        trigger.focus({ preventScroll: true });
                    }
                    if (shouldLeave) {
                        onLeave();
                    } else if (typeof onStay === 'function') {
                        onStay();
                    }
                };

                const onKeyDown = (event) => {
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        close(false);
                        return;
                    }
                    if (event.key === 'Tab') {
                        const focusable = [stayBtn, leaveBtn];
                        const currentIndex = focusable.indexOf(document.activeElement);
                        event.preventDefault();
                        if (currentIndex === -1) {
                            focusable[0].focus();
                            return;
                        }
                        const offset = event.shiftKey ? -1 : 1;
                        focusable[(currentIndex + offset + focusable.length) % focusable.length].focus();
                    }
                };

                stayBtn.addEventListener('click', () => close(false));
                leaveBtn.addEventListener('click', () => close(true));
                overlay.addEventListener('click', (event) => {
                    if (event.target === overlay) {
                        close(false);
                    }
                });
                document.addEventListener('keydown', onKeyDown);
            }

            navigateToPage(navItem, options) {
                if (!navItem) {
                    return;
                }
                const opts = options || {};
                this.clearSearch(false);
                if (this.isCurrentPage(navItem) && !opts.fromHistory) {
                    return;
                }

                const proceed = () => {
                    const isProtected = navItem.getAttribute('data-protected') === 'true';
                    const historyMode = opts.fromHistory ? 'none' : (opts.history || 'push');

                    if (isProtected) {
                        passwordManager.checkAccess(() => {
                            passwordManager.updateProtectedItemNames();
                            this.performNavigation(navItem, { history: historyMode });
                        });
                    } else {
                        this.performNavigation(navItem, { history: historyMode });
                    }
                };

                this.checkUnsaved((dirty) => {
                    if (dirty) {
                        this.confirmLeave(proceed, opts.trigger || navItem, () => {
                            if (opts.fromHistory) {
                                this.restoreCurrentUrl();
                            }
                        });
                        return;
                    }
                    proceed();
                });
            }

            performNavigation(navItem, options) {
                if (!navItem) {
                    return;
                }
                const opts = options || {};
                const skipLoad = this.isCurrentPage(navItem);

                // 移除所有活动状态
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('active');
                    item.removeAttribute('aria-current');
                });

                // 添加活动状态到当前项
                navItem.classList.add('active');
                navItem.setAttribute('aria-current', 'page');

                const fileName = navItem.getAttribute('data-file');
                const labelNode = navItem.querySelector('span');
                const toolLabel = labelNode ? labelNode.textContent.trim() : '';
                const iframe = document.getElementById('content-frame');

                if (!skipLoad) {
                    const loadPage = () => {
                        startToolLoad(fileName, toolLabel);
                        this.assignFrameSrc(document.getElementById('content-frame'), 'items/' + fileName);
                        this.decorateFrame(document.getElementById('content-frame'), fileName, toolLabel);
                    };
                    if (typeof UnsavedGuard !== 'undefined' && UnsavedGuard.allowUnload) {
                        UnsavedGuard.allowUnload(iframe, loadPage);
                    } else {
                        loadPage();
                    }
                } else {
                    this.decorateFrame(iframe, fileName, toolLabel);
                }

                this.currentFile = fileName;
                this.toolPreferences.record(fileName);
                this.renderSavedTools();
                if (window.ToolRoute) {
                    ToolRoute.writeLastTool(this.sessionStore, fileName, this.getAllowlist());
                }
                if (opts.history !== 'none') {
                    this.syncHistory(fileName, opts.history === 'replace' ? 'replace' : 'push');
                }

                // 在移动模式下，点击后收起侧边栏
                if (this.isMobile) {
                    document.getElementById('sidebar').classList.remove('mobile-visible');
                    this.syncSidebarControl();
                }
            }

            handleResize() {
                const newIsMobile = this.mobileUserAgent || window.matchMedia('(max-width: 768px)').matches;
                if (newIsMobile !== this.isMobile) {
                    this.isMobile = newIsMobile;
                    if (appPrefs.getItem(THEME_KEYS.preferDesktop) === null) {
                        this.currentMobileMode = this.isMobile;
                    }
                    this.updateLayout();
                    this.updateViewToggleButton();
                }
            }
        }

        const loadProgress = typeof LoadProgress !== 'undefined' ? LoadProgress.createController() : null;
        let loadProgressRaf = 0;
        let loadProgressHideTimer = 0;

        function renderLoadProgress(state) {
            const overlay = document.getElementById('tool-load-overlay');
            const bar = document.getElementById('tool-load-bar');
            const labelEl = document.getElementById('tool-load-label');
            const pctEl = document.getElementById('tool-load-pct');
            if (!overlay || !bar || !labelEl || !pctEl || !state) {
                return;
            }

            overlay.classList.toggle('is-visible', state.visible);
            if (state.visible) {
                overlay.removeAttribute('hidden');
                overlay.setAttribute('aria-hidden', 'false');
            } else {
                overlay.setAttribute('hidden', '');
                overlay.setAttribute('aria-hidden', 'true');
            }

            labelEl.textContent = state.label;
            pctEl.textContent = state.percent + '%';
            bar.style.width = (state.progress * 100) + '%';
            bar.setAttribute('aria-valuenow', String(state.percent));
        }

        function tickLoadProgress() {
            if (!loadProgress) {
                return;
            }
            const state = loadProgress.getState(Date.now());
            renderLoadProgress(state);
            if (state.active || (state.visible && state.progress < 1)) {
                loadProgressRaf = window.requestAnimationFrame(tickLoadProgress);
            } else {
                loadProgressRaf = 0;
            }
        }

        function startToolLoad(fileName, label) {
            if (!loadProgress) {
                return;
            }
            window.clearTimeout(loadProgressHideTimer);
            loadProgress.start({ fileName: fileName, label: label }, Date.now());
            renderLoadProgress(loadProgress.getState(Date.now()));
            if (!loadProgressRaf) {
                loadProgressRaf = window.requestAnimationFrame(tickLoadProgress);
            }
        }

        function finishToolLoad() {
            if (!loadProgress) {
                return;
            }
            const state = loadProgress.complete(Date.now());
            renderLoadProgress(state);
            if (state.visible) {
                window.clearTimeout(loadProgressHideTimer);
                loadProgressHideTimer = window.setTimeout(() => {
                    renderLoadProgress(loadProgress.hide(Date.now()));
                }, 220);
            }
            if (!loadProgressRaf) {
                loadProgressRaf = window.requestAnimationFrame(tickLoadProgress);
            }
        }

        // 初始化应用
        const themeManager = new ThemeManager();
        window.themeManager = themeManager;
        const passwordManager = new PasswordManager();
        const appManager = new AppManager();

        // 页面加载完成后的处理
        document.addEventListener('DOMContentLoaded', () => {
            // 更新受保护项目的显示名称
            passwordManager.updateProtectedItemNames();

            // 短暂延迟后触发resize事件确保布局正确
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 100);
        });

        function onContentFrameLoad(iframe) {
            finishToolLoad();
            themeManager.syncThemeToIframe();
            try {
                UnsavedGuard.install(iframe.contentWindow);

                setTimeout(() => {
                    themeManager.syncThemeToIframe();
                    const guard = iframe.contentWindow && iframe.contentWindow.__17toolsUnsaved;
                    if (guard && !guard.isDirty(iframe.contentWindow.document)) {
                        guard.captureBaseline(iframe.contentWindow.document);
                    }
                }, 100);
            } catch (e) {
                console.log('无法访问iframe内容，可能是跨域限制');
            }
        }

        document.addEventListener('load', (event) => {
            if (event.target && event.target.id === 'content-frame') {
                onContentFrameLoad(event.target);
            }
        }, true);

        window.addEventListener('beforeunload', (event) => {
            UnsavedGuard.applyBeforeUnload(event, appManager.hasUnsavedContent());
        });

    </script>
</body>
