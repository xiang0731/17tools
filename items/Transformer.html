<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <script>
        (function applyThemeEarly() {
            try {
                var pref = localStorage.getItem('17tools-theme');
                if (pref == null) {
                    pref = localStorage.getItem('theme');
                    if (pref != null) {
                        localStorage.setItem('17tools-theme', pref);
                    }
                }
                var theme = (pref === 'light' || pref === 'dark')
                    ? pref
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* 存储不可用时由 theme.js 降级 */ }
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本转换工具</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link href="../vendor/fontawesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            padding: var(--spacing-lg);
            background-color: var(--background-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 标题样式 */
        h1 {
            text-align: center;
            color: var(--text-primary);
            margin: 0 0 var(--spacing-lg) 0;
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .tool-panel {
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
        }

        h1::before {
            content: "\f0ae";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: var(--primary-color);
        }

        /* 功能按钮区域 - 优化布局 */
        .function-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
        }

        .function-button {
            padding: var(--spacing-md) var(--spacing-sm);
            background-color: var(--background-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .function-button:hover {
            background-color: var(--background-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .function-button.active {
            background-color: var(--primary-color);
            color: var(--text-inverse);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }

        /* 文本区域样式 */
        textarea {
            width: 100%;
            padding: var(--spacing-lg);
            margin: var(--spacing-md) 0;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            min-height: 200px;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            background-color: var(--background-primary);
            color: var(--text-primary);
            font-family: var(--font-mono);
            transition: all var(--transition-fast);
        }

        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        textarea:disabled {
            background-color: var(--background-secondary);
            cursor: not-allowed;
            color: var(--text-tertiary);
        }

        textarea::placeholder {
            color: var(--text-tertiary);
        }

        #output {
            background-color: var(--background-tertiary);
        }

        /* 辅助输入框样式 */
        #auxiliaryInput {
            min-height: 80px;
            background-color: var(--background-secondary);
            display: none;
            /* 默认隐藏 */
        }

        /* 文本框包装器 - 用于定位行数标签 */
        .textarea-wrapper {
            position: relative;
            margin: var(--spacing-md) 0;
        }

        .textarea-wrapper textarea {
            margin: 0;
        }

        /* 行数标签样式 */
        .line-count {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background-color: var(--background-tertiary);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font-mono);
            pointer-events: none;
            opacity: 0.85;
            border: 1px solid var(--border-color);
            z-index: 1;
        }

        /* 操作按钮区域 */
        .action-buttons {
            display: flex;
            gap: var(--spacing-md);
            justify-content: center;
            margin: var(--spacing-lg) 0;
            flex-wrap: wrap;
        }

        .action-button {
            padding: var(--spacing-md) var(--spacing-xl);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            min-width: 120px;
            justify-content: center;
        }

        .btn-clear {
            background-color: var(--error-color);
            color: var(--text-inverse);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--text-inverse);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-copy {
            background-color: var(--success-color);
            color: var(--text-inverse);
        }

        .btn-copy:hover {
            background-color: var(--accent-hover);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Toast 提示样式 */
        .toast {
            position: fixed;
            bottom: var(--spacing-lg);
            left: 50%;
            transform: translateX(-50%);
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--radius-sm);
            color: var(--text-inverse);
            z-index: 1000;
            box-shadow: var(--shadow-md);
            transition: opacity var(--transition-fast);
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
        }

        .toast-error {
            background-color: var(--error-color);
        }

        .toast-success {
            background-color: var(--success-color);
        }

        .toast-info {
            background-color: var(--primary-color);
        }

        @keyframes slideIn {
            from {
                transform: translate(-50%, 100%);
                opacity: 0;
            }

            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        /* 响应式设计 - 简化 */
        @media (max-width: 768px) {
            body {
                padding: var(--spacing-md);
            }

            .function-buttons {
                grid-template-columns: repeat(2, 1fr);
                gap: var(--spacing-xs);
            }

            .function-button {
                padding: var(--spacing-sm);
                font-size: 13px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .function-buttons {
                grid-template-columns: repeat(1, 1fr);
            }

            .function-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>文本转换工具</h1>

        <div class="tool-panel">
        <div class="function-buttons">
            <button type="button" class="function-button" data-function="A" aria-pressed="false">A-添加单引号和逗号</button>
            <button type="button" class="function-button" data-function="B" aria-pressed="false">B-添加双引号和逗号</button>
            <button type="button" class="function-button" data-function="C" aria-pressed="false">C-句首字母大写</button>
            <button type="button" class="function-button" data-function="D" aria-pressed="false">D-单词首字母大写</button>
            <button type="button" class="function-button" data-function="E" aria-pressed="false">E-添加__c</button>
            <button type="button" class="function-button" data-function="F" aria-pressed="false">F-去除空格</button>
            <button type="button" class="function-button" data-function="G" aria-pressed="false">G-转换小写</button>
            <button type="button" class="function-button" data-function="H" aria-pressed="false">H-转换大写</button>
            <button type="button" class="function-button" data-function="I" aria-pressed="false">I-提取首个单词</button>
            <button type="button" class="function-button" data-function="J" aria-pressed="false">J-添加前缀</button>
            <button type="button" class="function-button" data-function="K" aria-pressed="false">K-添加后缀</button>
            <button type="button" class="function-button" data-function="L" aria-pressed="false">L-提取特定前值</button>
            <button type="button" class="function-button" data-function="M" aria-pressed="false">M-提取特定后值</button>
            <button type="button" class="function-button" data-function="N" aria-pressed="false">N-添加顺序前缀</button>
            <button type="button" class="function-button" data-function="O" aria-pressed="false">O-添加倒序前缀</button>
            <button type="button" class="function-button" data-function="P" aria-pressed="false">P-空格换行</button>
            <button type="button" class="function-button" data-function="Q" aria-pressed="false">Q-合并为一行</button>
            <button type="button" class="function-button" data-function="R" aria-pressed="false">R-Base64编码</button>
            <button type="button" class="function-button" data-function="S" aria-pressed="false">S-Base64解码</button>
            <button type="button" class="function-button" data-function="T" aria-pressed="false">T-顺序排序</button>
            <button type="button" class="function-button" data-function="U" aria-pressed="false">U-倒序排序</button>
            <button type="button" class="function-button" data-function="V" aria-pressed="false">V-逐行转JSON数组</button>
            <button type="button" class="function-button" data-function="W" aria-pressed="false">W-保留顺序去重</button>
        </div>

        <div class="textarea-wrapper">
            <textarea id="input" aria-label="待转换原文" placeholder="请在此输入需要转换的文本..."></textarea>
            <span class="line-count" id="inputLineCount">0 行</span>
        </div>

        <!-- 添加辅助输入框 -->
        <textarea id="auxiliaryInput" aria-label="附加内容" placeholder="请输入要添加的内容..."></textarea>
        <div id="dedupeOptions" hidden>
            <label><input type="checkbox" id="dedupeTrim">比较时忽略首尾空格</label>
            <label><input type="checkbox" id="dedupeIgnoreCase">比较时忽略大小写</label>
            <p>保留首次出现的原文；不修改输出行的空格和大小写。</p>
        </div>
        <p>逐行处理识别各种换行，保留空行。最多100万字符、5万行、400万结果字符。加引号不等于生成JSON或安全SQL。</p>

        <div class="action-buttons">
            <button type="button" class="action-button btn-primary" id="submitBtn">
                <i class="fas fa-magic"></i>
                转换
            </button>
            <button type="button" class="action-button btn-copy" id="copyBtn">
                <i class="fas fa-copy"></i>
                复制结果
            </button>
            <button type="button" class="action-button btn-clear" id="clearBtn">
                <i class="fas fa-eraser"></i>
                清除
            </button>
            <button type="button" class="action-button" id="downloadBtn">下载结果</button>
        </div>

        <div class="textarea-wrapper">
            <textarea id="output" aria-label="转换结果" readonly placeholder="转换后的结果将显示在这里..."></textarea>
            <span class="line-count" id="outputLineCount">0 行</span>
        </div>
        </div>
    </div>

    <script src="../js/text-budget-core.js"></script>
    <script src="../js/clipboard.js"></script>
    <script src="../js/transformer-core.js"></script>
    <script>
        const core = window.TransformerCore;
        const TRANSFORMERS = core.TRANSFORMERS;
        let selectedFunction = '';
        let resultFunction = '';

        function showToast(message, type) {
            const toast = document.createElement('div');
            const kind = type === 'error' || type === 'success' ? type : 'info';
            toast.className = 'toast toast-' + kind;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(function () {
                toast.style.opacity = '0';
                setTimeout(function () {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

        function setFunctionPressed(selectedButton) {
            document.querySelectorAll('.function-button').forEach(function (btn) {
                const pressed = btn === selectedButton;
                btn.classList.toggle('active', pressed);
                btn.setAttribute('aria-pressed', pressed ? 'true' : 'false');
            });
        }

        // 更新 UI 状态
        function updateUIState() {
            document.getElementById('dedupeOptions').hidden = selectedFunction !== 'W';
            const inputArea = document.getElementById('input');
            const outputArea = document.getElementById('output');
            const auxiliaryArea = document.getElementById('auxiliaryInput');

            if (!selectedFunction || !TRANSFORMERS[selectedFunction]) {
                auxiliaryArea.disabled = true;
                auxiliaryArea.placeholder = "请先选择上方的一个功能...";
                auxiliaryArea.style.opacity = '0.5';
                return;
            }

            const config = TRANSFORMERS[selectedFunction];
            const example = config.example;

            inputArea.placeholder = `请在此输入需要处理的文本...\n\n示例输入：\n${example.input}`;
            outputArea.placeholder = `转换结果将显示在这里...\n\n示例输出：\n${example.output}`;

            if (config.needsAuxiliary) {
                auxiliaryArea.disabled = false;
                auxiliaryArea.style.opacity = '1';
                auxiliaryArea.style.display = 'block';
                auxiliaryArea.placeholder = `${config.auxiliaryPlaceholder}\n\n示例：${example.auxiliary}`;
            } else {
                auxiliaryArea.disabled = true;
                auxiliaryArea.style.opacity = '0.5';
                auxiliaryArea.style.display = 'none';
                auxiliaryArea.value = '';
            }
        }

        document.querySelectorAll('.function-button').forEach(function (button) {
            button.addEventListener('click', function () {
                setFunctionPressed(this);
                selectedFunction = this.dataset.function;
                updateUIState();
            });
        });

        // 清除按钮
        document.getElementById('clearBtn').addEventListener('click', function () {
            document.getElementById('input').value = '';
            document.getElementById('auxiliaryInput').value = '';
            document.getElementById('output').value = '';
            updateLineCount('input', 'inputLineCount');
            updateLineCount('output', 'outputLineCount');
            showToast('已清除所有内容');
        });

        // 复制按钮
        document.getElementById('copyBtn').addEventListener('click', async function () {
            const output = document.getElementById('output');
            if (!output.value) {
                showToast('没有可复制的内容', 'error');
                return;
            }
            const result = await ToolsClipboard.copyText(output.value, { element: output });
            showToast(result.message, result.ok ? 'success' : 'error');
        });

        // 提交转换按钮
        document.getElementById('submitBtn').addEventListener('click', function () {
            if (!selectedFunction) {
                showToast('请先选择一个转换功能！', 'error');
                return;
            }

            const input = document.getElementById('input').value;
            if (!input) {
                showToast('请输入需要转换的文本', 'error');
                return;
            }

            const suffix = document.getElementById('auxiliaryInput').value || '';

            try {
                const result = core.transform(selectedFunction, input, suffix, {
                    trim: document.getElementById('dedupeTrim').checked,
                    ignoreCase: document.getElementById('dedupeIgnoreCase').checked
                });
                document.getElementById('output').value = result;
                resultFunction = selectedFunction;
                updateLineCount('output', 'outputLineCount');
                showToast('转换成功', 'success');
            } catch (error) {
                console.error(error);
                showToast(error.message || '转换过程中发生错误', 'error');
            }
        });

        // 更新行数
        function updateLineCount(textareaId, counterId) {
            const textarea = document.getElementById(textareaId);
            const counter = document.getElementById(counterId);
            const text = textarea.value;
            let lineCount = 0;
            if (text.length > 0) {
                if (text.length > 1000000) { counter.textContent = '超过100万字符，请缩小文本'; return; }
                lineCount = 1;
                for (let i = 0; i < text.length; i++) if (text[i] === '\n') lineCount++;
            }
            counter.textContent = lineCount + ' 行';
        }

        document.getElementById('input').addEventListener('input', () => updateLineCount('input', 'inputLineCount'));
        document.getElementById('downloadBtn').addEventListener('click', function () {
            const value = document.getElementById('output').value;
            if (!value) { showToast('没有可下载的内容', 'error'); return; }
            const isJson = resultFunction === 'V';
            const url = URL.createObjectURL(new Blob([value], { type: isJson ? 'application/json;charset=utf-8' : 'text/plain;charset=utf-8' }));
            const link = document.createElement('a');
            link.href = url;
            link.download = isJson ? 'transformed.json' : 'transformed.txt';
            link.click();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        });

        // 初始化
        updateUIState();
        updateLineCount('input', 'inputLineCount');
        updateLineCount('output', 'outputLineCount');
    </script>
    <script src="../js/unsaved-guard.js"></script>
    <script src="../js/theme.js"></script>
</body>

</html>
