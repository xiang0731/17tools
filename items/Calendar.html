<!DOCTYPE html>
<html lang="zh" data-unsaved-guard="off">

<head>
    <meta charset="UTF-8">
    <script>
        (function applyThemeEarly() {
            try {
                var pref = localStorage.getItem('17tools-theme');
                if (pref == null) {
                    pref = localStorage.getItem('theme');
                    if (pref != null) {
                        localStorage.setItem('17tools-theme', pref);
                    }
                }
                var theme = (pref === 'light' || pref === 'dark')
                    ? pref
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* 存储不可用时由 theme.js 降级 */ }
        })();
    </script>

    <title>万年历</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/workday.css">
    <link href="../vendor/fontawesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        button.calendar-cell { width: 100%; min-width: 0; min-height: 64px; border: 0; border-right: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); background: var(--background-primary); font: inherit; color: inherit; text-align: center; }
        .calendar-cell:focus-visible { outline: 3px solid var(--primary-color); outline-offset: -3px; }
        button.today-btn { width: auto; min-width: 80px; }
        .workday-badge { font-size: 11px; line-height: 1.4; margin-top: 2px; color: var(--primary-color); }

        :root {
            --primary-gradient: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            --surface-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --inner-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        body {
            min-height: 100vh;
            padding: var(--spacing-md);
            background-color: var(--background-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            line-height: 1.4;
            display: flex;
            justify-content: center;
            align-items: stretch;
            overflow-x: auto;
            overflow-y: auto;
            margin: 0;
            box-sizing: border-box;
        }

        .page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: auto;
            min-height: 0;
        }

        .calendar-container {
            width: 100%;
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: var(--spacing-lg);
            box-shadow: var(--surface-shadow);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            flex: none;
            min-height: 0;
            overflow: hidden;
        }

        /* 标题样式 */
        h1 {
            text-align: center;
            color: var(--text-primary);
            margin: 0 0 var(--spacing-md) 0;
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }

        h1 i {
            color: var(--primary-color);
            background: -webkit-linear-gradient(45deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 控制面板样式 */
        .control-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-md);
            background: var(--background-primary);
            border-radius: var(--radius-md);
            flex-wrap: wrap;
            gap: var(--spacing-md);
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
            min-width: 0;
        }

        .date-controls {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            flex-wrap: wrap;
            min-width: 0;
            flex: 1 1 auto;
        }

        .control-btn {
            width: 44px;
            height: 44px;
            padding: 0;
            background: var(--background-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .control-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(var(--primary-rgb), 0.2);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .quick-actions {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            margin-left: auto;
        }

        .today-btn {
            width: auto;
            padding: 0 var(--spacing-md);
            background: var(--primary-color);
            color: white;
            border: none;
            font-weight: 600;
            gap: 6px;
        }

        .today-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.3);
        }

        /* 日历网格样式 */
        .calendar-grid {
            background: var(--background-primary);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            background: var(--background-tertiary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .calendar-header-cell {
            padding: var(--spacing-sm);
            text-align: center;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 0;
        }

        .calendar-header-cell.weekend {
            color: var(--error-color);
        }

        .calendar-body {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            grid-template-rows: repeat(6, minmax(0, 1fr));
            flex: 1;
            min-height: 0;
        }

        .calendar-cell {
            border-right: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .calendar-cell:nth-child(7n) {
            border-right: none;
        }

        .calendar-cell:hover {
            background: var(--background-hover);
            z-index: 1;
        }

        .calendar-cell.other-month {
            opacity: 0.4;
            background: var(--background-secondary);
        }

        .calendar-cell.today {
            background: rgba(var(--primary-rgb), 0.05);
        }

        .calendar-cell.today .date-number {
            color: var(--primary-color);
            font-weight: 800;
        }

        .calendar-cell.selected {
            color: white !important;
            z-index: 1;
        }

        .calendar-cell.selected::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            background: var(--primary-color);
            border-radius: 10px;
            z-index: -1;
            box-shadow: 0 4px 10px rgba(var(--primary-rgb), 0.3);
            animation: selectedPop 0.2s ease-out;
        }

        @keyframes selectedPop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .calendar-cell.selected .date-number,
        .calendar-cell.selected .lunar-date,
        .calendar-cell.selected .holiday-name,
        .calendar-cell.selected .solar-term {
            color: white !important;
        }

        .calendar-cell.weekend .date-number {
            color: var(--error-color);
        }

        .calendar-cell.holiday {
            background: linear-gradient(to bottom right, rgba(239, 68, 68, 0.03), transparent);
        }

        .date-number {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 1px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .calendar-cell.today .date-number {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 2px 4px rgba(var(--primary-rgb), 0.3);
        }

        .calendar-cell.selected .date-number {
            background: white;
            color: var(--primary-color) !important;
        }

        .lunar-date {
            font-size: 11px;
            color: var(--text-tertiary);
            text-align: center;
            margin-top: 1px;
            white-space: nowrap;
        }

        .holiday-name {
            font-size: 10px;
            color: var(--error-color);
            font-weight: 600;
            text-align: center;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* 信息面板样式 */
        .info-panel {
            margin-top: var(--spacing-md);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-md);
            flex-shrink: 0;
        }

        .info-card {
            background: var(--background-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm) var(--spacing-md);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 150px;
            height: auto;
            /* 固定高度 */
        }

        .info-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--surface-shadow);
            border-color: var(--primary-light);
        }

        .info-card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }

        .info-card-title i {
            color: var(--primary-color);
            font-size: 12px;
        }

        .info-card-content {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 12px;
            flex: 1;
            overflow: visible;
            /* 工作日来源与缺年说明完整显示。 */
        }

        #monthHolidays {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(5, 1fr);
            grid-auto-flow: column;
            /* 纵向排列，填满一列再填下一列 */
            gap: 0 10px;
        }

        #monthHolidays div {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-highlight {
            color: var(--primary-color);
            font-weight: 700;
            background: rgba(var(--primary-rgb), 0.1);
            padding: 1px 4px;
            border-radius: 4px;
        }

        .info-date {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 14px;
        }

        /* 今日标签样式 */
        .today-badge {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            margin-top: 6px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 6px 12px rgba(var(--accent-rgb), 0.2);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }
        }

        /* 年月日选择器样式 */
        .date-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--background-tertiary);
            padding: 4px 8px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            min-width: 0;
        }

        .date-input {
            min-height: 44px;
            box-sizing: border-box;
            padding: 4px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            width: 50px;
            transition: all 0.2s;
        }

        #yearInput {
            width: 60px;
        }

        .date-input:hover {
            background: var(--background-primary);
            border-color: var(--border-light);
        }

        .date-input:focus {
            outline: none;
            background: var(--background-primary);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.1);
        }

        .date-selector span {
            font-size: 12px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: var(--spacing-xs);
            }

            .calendar-container {
                padding: var(--spacing-sm);
                border-radius: 12px;
            }

            .control-panel {
                padding: var(--spacing-sm);
                gap: var(--spacing-xs);
                flex-wrap: wrap;
            }

            .date-controls {
                gap: 2px;
                flex-wrap: wrap;
            }

            .quick-actions {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }

            .control-btn {
                width: 44px;
                height: 44px;
                border-radius: 8px;
            }

            .date-selector {
                padding: 2px 4px;
            }

            .date-input {
                width: 40px;
                font-size: 12px;
            }

            #yearInput {
                width: 50px;
            }

            .info-panel {
                grid-template-columns: 1fr;
                gap: var(--spacing-xs);
            }

            .info-card {
                padding: var(--spacing-xs) var(--spacing-sm);
            }

            h1 {
                font-size: 18px;
                margin-bottom: var(--spacing-xs);
            }
        }

        /* 节气标记 */
        .solar-term {
            font-size: 10px;
            color: var(--accent-color);
            font-weight: 700;
            text-align: center;
            margin-top: 1px;
        }
    </style>
</head>

<body>
    <div class="page">
        <h1>
            <i class="fas fa-calendar-alt"></i>
            万年历
        </h1>
        <div class="calendar-container">

        <div class="control-panel">
            <div class="date-controls">
                <button class="control-btn" id="prevYear" aria-label="上一月" title="上一月">
                    <i class="fas fa-angle-double-left"></i>
                </button>
                <button class="control-btn" id="prevMonth" aria-label="前一天" title="前一天">
                    <i class="fas fa-angle-left"></i>
                </button>

                <div class="date-selector">
                    <input type="number" class="date-input" id="yearInput" aria-label="公历年份" min="1900" max="2100">
                    <span>年</span>
                    <input type="number" class="date-input" id="monthInput" aria-label="公历月份" min="1" max="12">
                    <span>月</span>
                    <input type="number" class="date-input" id="dayInput" aria-label="公历日期" min="1" max="31">
                    <span>日</span>
                </div>

                <button class="control-btn" id="nextMonth" aria-label="后一天" title="后一天">
                    <i class="fas fa-angle-right"></i>
                </button>
                <button class="control-btn" id="nextYear" aria-label="下一月" title="下一月">
                    <i class="fas fa-angle-double-right"></i>
                </button>
            </div>

            <div class="quick-actions">
                <button class="control-btn today-btn" id="todayBtn">
                    <i class="fas fa-home"></i>
                    今天
                </button>
            </div>
        </div>

        <div class="calendar-grid">
            <div class="calendar-header">
                <div class="calendar-header-cell weekend">日</div>
                <div class="calendar-header-cell">一</div>
                <div class="calendar-header-cell">二</div>
                <div class="calendar-header-cell">三</div>
                <div class="calendar-header-cell">四</div>
                <div class="calendar-header-cell">五</div>
                <div class="calendar-header-cell weekend">六</div>
            </div>
            <div class="calendar-body" id="calendarBody" role="group" aria-label="公历日期，方向键按日或周移动">
                <!-- 日历单元格将通过JavaScript生成 -->
            </div>
        </div>

        <div class="info-panel">
            <div class="info-card">
                <div class="info-card-title">
                    <i class="fas fa-info-circle"></i>
                    选中日期信息
                </div>
                <div class="info-card-content" id="selectedDateInfo">
                    点击日期查看详细信息
                </div>
            </div>

            <div class="info-card">
                <div class="info-card-title">
                    <i class="fas fa-calendar-day"></i>
                    今日信息
                </div>
                <div class="info-card-content" id="todayInfo">
                    <!-- 今日信息将通过JavaScript生成 -->
                </div>
            </div>

            <div class="info-card">
                <div class="info-card-title">
                    <i class="fas fa-star"></i>
                    本月节日
                </div>
                <div class="info-card-content" id="monthHolidays">
                    <!-- 本月节日将通过JavaScript生成 -->
                </div>
            </div>
        </div>
        </div>
        <section data-workday-panel aria-label="工作日计算"></section>
    </div>

    <script src="../js/theme.js"></script>
    <script src="../js/china-holidays.js"></script>
    <script src="../js/workday-core.js"></script>
    <script src="../js/workday-page.js"></script>
    <script src="../js/lunar-core.js"></script>
    <script>
        const MILLISECONDS_PER_DAY = 86400000;

        function getCalendarDayNumber(date) {
            return Math.floor(Date.UTC(
                date.getFullYear(),
                date.getMonth(),
                date.getDate()
            ) / MILLISECONDS_PER_DAY);
        }

        // 万年历类
        class Calendar {
            // 农历节日配置
            static LUNAR_HOLIDAYS = {
                '1-1': '春节', '1-15': '元宵节', '2-2': '龙抬头', '5-5': '端午节',
                '7-7': '七夕节', '8-15': '中秋节', '9-9': '重阳节', '12-8': '腊八节',
                '12-23': '小年'
            };

            static HOLIDAYS = {
                '1-1': '元旦', '2-14': '情人节', '3-8': '妇女节', '3-12': '植树节',
                '3-15': '消费者权益日', '4-1': '愚人节', '4-22': '世界地球日',
                '5-1': '劳动节', '5-4': '青年节', '5-12': '护士节',
                '6-1': '儿童节', '6-5': '世界环境日', '7-1': '建党节', '8-1': '建军节',
                '9-10': '教师节', '10-1': '国庆节', '10-31': '万圣节', '11-11': '光棍节',
                '12-24': '平安夜', '12-25': '圣诞节'
            };

            constructor() {
                this.currentDate = new Date();
                this.workdayRules = {};

                this.selectedDate = new Date();
                this.viewYear = this.currentDate.getFullYear();
                this.viewMonth = this.currentDate.getMonth();

                // 缓存 DOM 引用
                this.dom = {
                    calendarBody: document.getElementById('calendarBody'),
                    yearInput: document.getElementById('yearInput'),
                    monthInput: document.getElementById('monthInput'),
                    dayInput: document.getElementById('dayInput'),
                    selectedDateInfo: document.getElementById('selectedDateInfo'),
                    todayInfo: document.getElementById('todayInfo'),
                    monthHolidays: document.getElementById('monthHolidays')
                };

                this.init();
            }

            init() {
                this.bindEvents();
                this.updateCalendar();
                this.updateTodayInfo();
                this.updateSelectedDateInfo();
                this.initInputValues();
                const workdayPanel = document.querySelector('[data-workday-panel]');
                workdayPanel.addEventListener('workday-rules-change', event => {
                    this.workdayRules = event.detail;
                    this.updateCalendar();
                    this.updateSelectedDateInfo();
                });
            }

            // 绑定事件
            bindEvents() {
                // 控制按钮事件
                document.getElementById('prevYear').addEventListener('click', () => this.changeMonth(-1));
                document.getElementById('nextYear').addEventListener('click', () => this.changeMonth(1));
                document.getElementById('prevMonth').addEventListener('click', () => this.changeDay(-1));
                document.getElementById('nextMonth').addEventListener('click', () => this.changeDay(1));
                document.getElementById('todayBtn').addEventListener('click', () => this.goToToday());

                // 事件委托：处理日历单元格点击
                this.dom.calendarBody.addEventListener('click', (e) => {
                    const cell = e.target.closest('.calendar-cell');
                    if (cell && cell.dataset.date) {
                        const date = new Date(cell.dataset.date);
                        this.handleDateClick(date);
                    }
                });

                // 输入框事件
                this.dom.yearInput.addEventListener('change', (e) => {
                    const year = Number(e.target.value);
                    if (Number.isInteger(year) && year >= 1900 && year <= 2100) {
                        this.viewYear = year;
                        this.updateSelectedDateWithView();
                        this.updateCalendar();
                        this.updateSelectedDateInfo();
                    } else { e.target.value = this.viewYear; }
                });

                this.dom.monthInput.addEventListener('change', (e) => {
                    const month = Number(e.target.value);
                    if (Number.isInteger(month) && month >= 1 && month <= 12) {
                        this.viewMonth = month - 1;
                        this.updateSelectedDateWithView();
                        this.updateCalendar();
                        this.updateSelectedDateInfo();
                    } else { e.target.value = this.viewMonth + 1; }
                });

                this.dom.dayInput.addEventListener('change', (e) => {
                    const day = Number(e.target.value);
                    const daysInMonth = new Date(this.viewYear, this.viewMonth + 1, 0).getDate();

                    if (Number.isInteger(day) && day >= 1 && day <= daysInMonth) {
                        this.selectedDate = new Date(this.viewYear, this.viewMonth, day);
                        this.updateCalendar();
                        this.updateSelectedDateInfo();
                    } else {
                        e.target.value = this.selectedDate.getDate();
                    }
                });

                this.dom.calendarBody.addEventListener('keydown', event => {
                    const cell = event.target.closest('.calendar-cell');
                    if (!cell) return;
                    const date = new Date(cell.dataset.date);
                    let handled = true;
                    switch (event.key) {
                        case 'ArrowLeft': date.setDate(date.getDate() - 1); break;
                        case 'ArrowRight': date.setDate(date.getDate() + 1); break;
                        case 'ArrowUp': date.setDate(date.getDate() - 7); break;
                        case 'ArrowDown': date.setDate(date.getDate() + 7); break;
                        case 'Home': date.setDate(date.getDate() - date.getDay()); break;
                        case 'End': date.setDate(date.getDate() + 6 - date.getDay()); break;
                        case 'PageUp': case 'PageDown': {
                            const direction = event.key === 'PageUp' ? -1 : 1, day = date.getDate();
                            date.setDate(1);
                            if (event.ctrlKey) date.setFullYear(date.getFullYear() + direction); else date.setMonth(date.getMonth() + direction);
                            date.setDate(Math.min(day, new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate())); break;
                        }
                        default: handled = false;
                    }
                    if (!handled) return;
                    event.preventDefault(); event.stopPropagation();
                    if (date.getFullYear() < 1900 || date.getFullYear() > 2100) return;
                    this.handleDateClick(date);
                    this.dom.calendarBody.querySelector('[tabindex="0"]')?.focus();
                });
                // 键盘快捷键（输入框聚焦时不抢方向键）
                document.addEventListener('keydown', (e) => {
                    const target = e.target;
                    const tag = target && target.tagName ? target.tagName : '';
                    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (target && target.isContentEditable)) {
                        return;
                    }
                    switch (e.key) {
                        case 'ArrowLeft':
                            if (e.ctrlKey) this.changeMonth(-1); else this.changeDay(-1);
                            break;
                        case 'ArrowRight':
                            if (e.ctrlKey) this.changeMonth(1); else this.changeDay(1);
                            break;
                        case 'ArrowUp':
                            if (e.ctrlKey) this.changeYear(-1); else this.changeMonth(-1);
                            break;
                        case 'ArrowDown':
                            if (e.ctrlKey) this.changeYear(1); else this.changeMonth(1);
                            break;
                        case 'Home':
                            this.goToToday();
                            break;
                    }
                });
            }

            // 处理日期点击逻辑
            handleDateClick(date) {
                const isCurrentMonth = date.getMonth() === this.viewMonth && date.getFullYear() === this.viewYear;
                if (!isCurrentMonth) {
                    this.viewYear = date.getFullYear();
                    this.viewMonth = date.getMonth();
                }
                this.selectedDate = new Date(date);
                this.updateCalendar();
                this.updateSelectedDateInfo();
                const panel = document.querySelector('[data-workday-panel]');
                if (panel.workdayApi) panel.workdayApi.setStart(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`);
            }

            // 初始化输入框值
            initInputValues() {
                this.dom.yearInput.value = this.viewYear;
                this.dom.monthInput.value = this.viewMonth + 1;
                this.dom.dayInput.value = this.selectedDate.getDate();
            }

            // 改变日期
            changeDay(delta) {
                const newDate = new Date(this.selectedDate);
                newDate.setDate(this.selectedDate.getDate() + delta);
                if (newDate.getFullYear() < 1900 || newDate.getFullYear() > 2100) return;
                this.selectedDate = newDate;
                this.viewYear = this.selectedDate.getFullYear();
                this.viewMonth = this.selectedDate.getMonth();
                this.updateCalendar();
                this.updateSelectedDateInfo();
            }

            // 改变年份
            changeYear(delta) {
                this.viewYear = Math.max(1900, Math.min(2100, this.viewYear + delta));
                this.updateSelectedDateWithView();
                this.updateCalendar();
                this.updateSelectedDateInfo();
            }

            // 改变月份
            changeMonth(delta) {
                const next = new Date(this.viewYear, this.viewMonth + delta, 1);
                if (next.getFullYear() < 1900 || next.getFullYear() > 2100) return;
                this.viewMonth += delta;
                if (this.viewMonth < 0) {
                    this.viewMonth = 11;
                    this.viewYear -= 1;
                } else if (this.viewMonth > 11) {
                    this.viewMonth = 0;
                    this.viewYear += 1;
                }
                this.updateSelectedDateWithView();
                this.updateCalendar();
                this.updateSelectedDateInfo();
            }

            // 根据当前视图年份和月份，更新selectedDate（保持日不变，如果当月没有该日，则取最后一天）
            updateSelectedDateWithView() {
                const oldDay = this.selectedDate.getDate();
                const daysInNewMonth = new Date(this.viewYear, this.viewMonth + 1, 0).getDate();
                const newDay = Math.min(oldDay, daysInNewMonth);
                this.selectedDate = new Date(this.viewYear, this.viewMonth, newDay);
            }

            // 跳转到今天
            goToToday() {
                this.viewYear = this.currentDate.getFullYear();
                this.viewMonth = this.currentDate.getMonth();
                this.selectedDate = new Date(this.currentDate);
                this.updateCalendar();
                this.updateSelectedDateInfo();
            }

            // 更新日历
            updateCalendar() {
                this.updateInputValues();
                this.generateCalendar();
                this.updateMonthHolidays();
            }

            // 更新输入框值
            updateInputValues() {
                this.dom.yearInput.value = this.viewYear;
                this.dom.monthInput.value = this.viewMonth + 1;
                this.dom.dayInput.value = this.selectedDate.getDate();
            }

            // 生成日历
            generateCalendar() {
                const fragment = document.createDocumentFragment();
                const firstDay = new Date(this.viewYear, this.viewMonth, 1);
                const startDate = new Date(firstDay);
                startDate.setDate(startDate.getDate() - firstDay.getDay());

                // 生成42个单元格（6周）
                for (let i = 0; i < 42; i++) {
                    const cellDate = new Date(startDate);
                    cellDate.setDate(startDate.getDate() + i);
                    fragment.appendChild(this.createCalendarCell(cellDate));
                }

                const restoreFocus = this.dom.calendarBody.contains(document.activeElement);
                this.dom.calendarBody.replaceChildren(fragment);
                if (restoreFocus) this.dom.calendarBody.querySelector('[tabindex="0"]')?.focus();
            }

            // 创建日历单元格
            createCalendarCell(date) {
                const cell = document.createElement('button');
                cell.type = 'button';
                cell.className = 'calendar-cell';
                // 使用 dataset 存储日期信息，方便事件委托
                cell.dataset.date = date.toDateString();

                const isCurrentMonth = date.getMonth() === this.viewMonth;
                const isToday = this.isSameDate(date, this.currentDate);
                const isSelected = this.isSameDate(date, this.selectedDate);
                const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                cell.tabIndex = isSelected ? 0 : -1;
                cell.setAttribute('aria-pressed', String(isSelected));
                if (isToday) cell.setAttribute('aria-current', 'date');
                const dateKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                const status = WorkdayCore.status(dateKey, this.workdayRules);
                const namedEvents = [this.getLunarInfo(date), this.getHoliday(date), this.getSolarTerm(date)].filter(Boolean);
                const reason = status ? status.reason + (status.known ? '' : '，该年未载入法定调休') : '';
                cell.setAttribute('aria-label', `${dateKey} 星期${'日一二三四五六'[date.getDay()]} ${namedEvents.join('、')} ${reason}`);
                if (date.getFullYear() < 1900 || date.getFullYear() > 2100) cell.disabled = true;

                if (!isCurrentMonth) cell.classList.add('other-month');
                if (isToday) cell.classList.add('today');
                if (isSelected) cell.classList.add('selected');
                if (isWeekend) cell.classList.add('weekend');

                // 日期数字
                const dateNumber = document.createElement('div');
                dateNumber.className = 'date-number';
                dateNumber.textContent = date.getDate();
                cell.appendChild(dateNumber);

                if (isCurrentMonth) {
                    const lunarInfo = this.getLunarInfo(date);
                    if (lunarInfo) {
                        const lunarDate = document.createElement('div');
                        lunarDate.className = 'lunar-date';
                        lunarDate.textContent = lunarInfo;
                        cell.appendChild(lunarDate);
                    }

                    const h = this.getHoliday(date);
                    const s = this.getSolarTerm(date);
                    const dayEvents = new Set();
                    if (h) dayEvents.add(h);
                    if (s) {
                        let isDuplicate = false;
                        dayEvents.forEach(existing => {
                            if (existing.includes(s) || s.includes(existing)) isDuplicate = true;
                        });
                        if (!isDuplicate) dayEvents.add(s);
                    }

                    dayEvents.forEach(event => {
                        const eventEl = document.createElement('div');
                        // 如果是节气，使用 solar-term 类，否则使用 holiday-name 类
                        if (event === s) {
                            eventEl.className = 'solar-term';
                        } else {
                            cell.classList.add('holiday');
                            eventEl.className = 'holiday-name';
                        }
                        eventEl.textContent = event;
                        cell.appendChild(eventEl);
                    });
                }

                if (status && /法定安排|自定义/.test(status.reason)) {
                    const badge = document.createElement('div'); badge.className = 'workday-badge';
                    badge.textContent = status.work ? '班' : '休';
                    badge.title = status.reason;
                    cell.append(badge);
                }
                return cell;
            }

            // 判断是否为同一天
            isSameDate(date1, date2) {
                return date1.getFullYear() === date2.getFullYear() &&
                    date1.getMonth() === date2.getMonth() &&
                    date1.getDate() === date2.getDate();
            }

            // 获取农历信息（简化版本）
            getLunarInfo(date) {
                const lunar = LunarCore.solarToLunar(date.getFullYear(), date.getMonth() + 1, date.getDate());
                if (!lunar) return null;
                const monthNames = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
                const dayNames = LunarCore.DAY_NAMES;
                const monthLabel = `${lunar.isLeap ? '闰' : ''}${monthNames[lunar.month - 1]}月`;
                return lunar.day === 1 ? monthLabel : dayNames[lunar.day - 1];
            }

            // 获取完整农历信息（用于详细显示）
            getFullLunarInfo(date) {
                const lunar = LunarCore.solarToLunar(date.getFullYear(), date.getMonth() + 1, date.getDate());
                if (!lunar) return null;
                const gzYear = LunarCore.getGanZhi(lunar.year) + '年';
                const cnYear = this.toChineseYear(lunar.year);
                const monthLabel = `${lunar.isLeap ? '闰' : ''}${LunarCore.MONTH_NAMES[lunar.month - 1]}`;
                return `${gzYear} (${cnYear}) ${monthLabel}${LunarCore.DAY_NAMES[lunar.day - 1]}`;
            }

            // 数字年份转中文年份 (繁体/规范写法)
            toChineseYear(year) {
                const chars = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
                return year.toString().split('').map(digit => chars[parseInt(digit)]).join('') + '年';
            }

            // 获取节日信息
            getHoliday(date) {
                const key = `${date.getMonth() + 1}-${date.getDate()}`;

                // 1. 特殊公历节日
                const specialHoliday = this.getSpecialHoliday(date);
                if (specialHoliday) return specialHoliday;

                // 2. 固定公历节日
                if (Calendar.HOLIDAYS[key]) return Calendar.HOLIDAYS[key];

                try {
                    // 3. 农历节日
                    const lunar = LunarCore.solarToLunar(date.getFullYear(), date.getMonth() + 1, date.getDate());
                    if (lunar && !lunar.isLeap) { // 闰月通常不过节
                        const lunarKey = `${lunar.month}-${lunar.day}`;
                        if (Calendar.LUNAR_HOLIDAYS[lunarKey]) return Calendar.LUNAR_HOLIDAYS[lunarKey];

                        // 特殊处理：除夕
                        if (lunar.month === 12) {
                            const monthDays = LunarCore.monthDays(lunar.year, 12);
                            if (lunar.day === monthDays) {
                                return '除夕';
                            }
                        }
                    }
                } catch (e) { }

                return null;
            }

            // 获取特殊节日（如第几个周几）
            getSpecialHoliday(date) {
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const dayOfWeek = date.getDay();
                // 母亲节：5月第二个星期日
                if (month === 5 && dayOfWeek === 0 && day === this.getNthWeekday(date.getFullYear(), 4, 0, 2)) return '母亲节';
                // 父亲节：6月第三个星期日
                if (month === 6 && dayOfWeek === 0 && day === this.getNthWeekday(date.getFullYear(), 5, 0, 3)) return '父亲节';
                return null;
            }

            // 获取某月第N个星期几的日期
            getNthWeekday(year, month, dayOfWeek, nth) {
                const firstDayOfWeek = new Date(year, month, 1).getDay();
                return 1 + (dayOfWeek - firstDayOfWeek + 7) % 7 + (nth - 1) * 7;
            }

            getSolarTerm(date) {
                return LunarCore.getSolarTerm(date.getFullYear(), date.getMonth() + 1, date.getDate());
            }

            // 更新选中日期信息
            updateSelectedDateInfo() {
                const date = this.selectedDate;
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const h = this.getHoliday(date);
                const s = this.getSolarTerm(date);
                const fullLunarInfo = this.getFullLunarInfo(date);

                const dayEvents = new Set();
                if (h) dayEvents.add(h);
                if (s) {
                    let isDuplicate = false;
                    dayEvents.forEach(existing => {
                        if (existing.includes(s) || s.includes(existing)) isDuplicate = true;
                    });
                    if (!isDuplicate) dayEvents.add(s);
                }

                let content = `<div><span class="info-date">${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${weekdays[date.getDay()]}</span></div>`;
                if (fullLunarInfo) content += `<div>农历：<span class="info-highlight">${fullLunarInfo}</span></div>`;

                dayEvents.forEach(event => {
                    const label = event === s ? '节气' : '节日';
                    content += `<div>${label}：<span class="info-highlight">${event}</span></div>`;
                });

                const today = new Date();
                const compareDate = new Date(date);
                const daysDiff = getCalendarDayNumber(compareDate) - getCalendarDayNumber(today);

                if (daysDiff === 0) content += `<div><span class="today-badge">今天</span></div>`;
                else if (daysDiff === 1) content += `<div style="color: var(--primary-color); margin-top: 4px; font-weight: 600;">明天</div>`;
                else if (daysDiff === -1) content += `<div style="color: var(--text-secondary); margin-top: 4px;">昨天</div>`;
                else if (daysDiff > 0) content += `<div style="color: var(--primary-color); margin-top: 4px;">${daysDiff}天后</div>`;
                else content += `<div style="color: var(--text-secondary); margin-top: 4px;">${Math.abs(daysDiff)}天前</div>`;

                this.dom.selectedDateInfo.innerHTML = content;
                const dateKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                const workday = WorkdayCore.status(dateKey, this.workdayRules);
                const status = document.createElement('p');
                status.textContent = workday ? `工作日规则：${workday.reason}${workday.known ? '（已核验该年法定安排）' : '（该年未载入法定调休，仅按周末与自定义例外估算）'}。节日名称不等于放假。` : '工作日规则无效，请检查下方自定义例外。';
                this.dom.selectedDateInfo.append(status);
            }

            // 更新今日信息
            updateTodayInfo() {
                const today = this.currentDate;
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const h = this.getHoliday(today);
                const s = this.getSolarTerm(today);
                const fullLunarInfo = this.getFullLunarInfo(today);

                const dayEvents = new Set();
                if (h) dayEvents.add(h);
                if (s) {
                    let isDuplicate = false;
                    dayEvents.forEach(existing => {
                        if (existing.includes(s) || s.includes(existing)) isDuplicate = true;
                    });
                    if (!isDuplicate) dayEvents.add(s);
                }

                let content = `<div><span class="info-date">${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日 ${weekdays[today.getDay()]}</span></div>`;
                if (fullLunarInfo) content += `<div>农历：<span class="info-highlight">${fullLunarInfo}</span></div>`;

                dayEvents.forEach(event => {
                    const label = event === s ? '今日节气' : '今日节日';
                    content += `<div>${label}：<span class="info-highlight">${event}</span></div>`;
                });

                this.dom.todayInfo.innerHTML = content;
            }

            // 更新本月节日
            updateMonthHolidays() {
                const holidays = [];
                const daysInMonth = new Date(this.viewYear, this.viewMonth + 1, 0).getDate();
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(this.viewYear, this.viewMonth, day);
                    const h = this.getHoliday(date);
                    const s = this.getSolarTerm(date);

                    const dayEvents = new Set();
                    if (h) dayEvents.add(h);

                    if (s) {
                        let isDuplicate = false;
                        dayEvents.forEach(existing => {
                            if (existing.includes(s) || s.includes(existing)) isDuplicate = true;
                        });
                        if (!isDuplicate) dayEvents.add(s);
                    }

                    dayEvents.forEach(event => {
                        holidays.push(`${day}日 - ${event}`);
                    });
                }
                this.dom.monthHolidays.innerHTML = holidays.length > 0
                    ? holidays.map(h => `<div>${h}</div>`).join('')
                    : '<div style="color: var(--text-tertiary);">本月暂无特殊节日</div>';
            }
        }

        // 初始化万年历
        document.addEventListener('DOMContentLoaded', () => {
            window.calendarTool = new Calendar();
        });
    </script>
</body>

</html>
