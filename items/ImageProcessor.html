<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片处理</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <style>
        html, body { margin: 0; min-height: 100vh; background: var(--background-primary); color: var(--text-primary); font-family: var(--font-family); }
        .page { padding: var(--spacing-lg); max-width: 1280px; margin: 0 auto; }
        h1 { margin: 0 0 var(--spacing-lg); text-align: center; display: flex; align-items: center; justify-content: center; gap: var(--spacing-sm); font-size: 28px; }
        h1 i { color: var(--primary-color); }
        .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: var(--spacing-lg); }
        .tab-btn { background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary); padding: 10px 16px; cursor: pointer; font-size: 15px; font-weight: 600; }
        .tab-btn.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: var(--spacing-lg); }
        .preview-pane, .control-pane { background: var(--background-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: var(--spacing-lg); box-shadow: var(--shadow-sm); }
        .dropzone { min-height: 280px; border: 1px dashed var(--border-color); border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--background-primary); cursor: pointer; position: relative; overflow: hidden; padding: var(--spacing-lg); }
        .dropzone:hover { border-color: var(--border-focus); }
        .dropzone.has-image { border-style: solid; }
        #cropDrop.has-image { cursor: default; overflow: hidden; padding: 0; min-height: 480px; }
        .preview-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-sm); margin-bottom: var(--spacing-md); }
        .preview-toolbar .pick-btn { margin-bottom: 0; }
        .batch-toggle { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; font-size: 13px; color: var(--text-secondary); user-select: none; }
        .drop-hint { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--spacing-sm); text-align: center; color: var(--text-secondary); pointer-events: none; }
        .drop-hint i { font-size: 32px; color: var(--primary-color); }
        [hidden] { display: none !important; }
        #wmCanvas:not([hidden]), #cpPreview:not([hidden]), #rdCanvas:not([hidden]) { max-width: 100%; max-height: 420px; display: block; margin: 0 auto; }
        #rdDrop.has-image { cursor: crosshair; padding: var(--spacing-lg); }
        .tool-row button.active, .emoji-grid button.active { background: var(--primary-light); border-color: var(--primary-color); color: var(--primary-color); }
        .emoji-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .emoji-grid button { border: 1px solid var(--border-color); background: var(--background-primary); border-radius: 8px; padding: 8px; cursor: pointer; font-size: 20px; line-height: 1; }
        #cropWrap:not([hidden]) { width: 100%; height: 480px; overflow: hidden; }
        #cropWrap .cropper-container { width: 100% !important; height: 100% !important; }
        #cropImage { display: block; max-width: 100%; }
        .thumbs { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; }
        .thumbs button { border: 2px solid transparent; background: var(--background-primary); color: var(--text-secondary); border-radius: 8px; padding: 4px; cursor: pointer; min-width: 72px; }
        .thumbs button.active { border-color: var(--primary-color); }
        .thumbs img { width: 64px; height: 48px; object-fit: cover; display: block; border-radius: 4px; }
        .thumbs span { display: block; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
        input[type="range"] { width: 100%; }
        input[type="color"] { width: 48px; height: 36px; padding: 2px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--background-primary); }
        .pos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .pos-grid button, .ratio-row button, .tool-row button, .size-presets button { border: 1px solid var(--border-color); background: var(--background-primary); color: var(--text-primary); border-radius: 8px; padding: 8px; cursor: pointer; }
        .pos-grid button.active, .ratio-row button.active { background: var(--primary-light); border-color: var(--primary-color); color: var(--primary-color); }
        .ratio-row, .tool-row, .size-presets { display: flex; flex-wrap: wrap; gap: 6px; }
        .pick-btn { margin-bottom: var(--spacing-md); }
        .export-btn { width: 100%; }
        .export-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .errors { white-space: pre-wrap; color: var(--error-color); font-size: 13px; min-height: 1.4em; margin-top: 8px; }
        .stats { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
        #toastContainer { position: fixed; right: 20px; top: 20px; z-index: 20; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: var(--background-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow-md); }
        .hidden-file { display: none; }
        @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="page">
        <h1><i class="fas fa-image"></i>图片处理</h1>
        <div class="tabs">
            <button class="tab-btn active" data-tab="watermark" type="button">添加水印</button>
            <button class="tab-btn" data-tab="crop" type="button">图片裁切</button>
            <button class="tab-btn" data-tab="compress" type="button">图片压缩</button>
            <button class="tab-btn" data-tab="redact" type="button">图片打码</button>
        </div>

        <section class="tab-panel active" data-panel="watermark">
            <div class="layout">
                <div class="preview-pane">
                    <div class="preview-toolbar">
                        <button class="btn btn-secondary pick-btn" id="wmPick" type="button">选择图片</button>
                        <button class="btn btn-secondary" id="wmClear" type="button">重置</button>
                        <label class="batch-toggle"><input id="wmBatch" type="checkbox"> 批量处理</label>
                    </div>
                    <div class="dropzone" id="wmDrop">
                        <input class="hidden-file" id="wmFile" type="file" accept="image/jpeg,image/png,image/webp">
                        <div class="drop-hint" id="wmHint"><i class="fas fa-cloud-upload-alt"></i><div>点击或拖拽上传一张图片</div></div>
                        <canvas id="wmCanvas" hidden></canvas>
                    </div>
                    <div class="thumbs" id="wmThumbs" hidden></div>
                </div>
                <div class="control-pane">
                    <div class="form-group"><label for="wmText">水印文字</label><input id="wmText" class="form-input" type="text" placeholder="输入水印文字"></div>
                    <div class="form-group"><label for="wmStyle">水印样式</label>
                        <select id="wmStyle" class="form-input form-select">
                            <option value="fill">填充</option>
                            <option value="stroke">描边</option>
                            <option value="shadow">阴影</option>
                            <option value="stamp">印章</option>
                            <option value="banner">底栏</option>
                        </select>
                    </div>
                    <div class="form-group"><label for="wmFontFamily">字体</label>
                        <select id="wmFontFamily" class="form-input form-select">
                            <option value="sans">黑体</option>
                            <option value="serif">宋体</option>
                            <option value="mono">等宽</option>
                        </select>
                    </div>
                    <div class="form-group"><label><input id="wmBold" type="checkbox"> 粗体</label></div>
                    <div class="form-group"><label for="wmFont">字号（短边百分比）</label><input id="wmFont" type="range" min="1" max="20" value="5"></div>
                    <div class="form-group"><label for="wmColor">颜色</label><input id="wmColor" type="color" value="#ffffff"></div>
                    <div class="form-group"><label for="wmOpacity">透明度</label><input id="wmOpacity" type="range" min="0" max="100" value="50"></div>
                    <div class="form-group"><label for="wmRotation">旋转</label><input id="wmRotation" type="range" min="-90" max="90" value="0"></div>
                    <div class="form-group"><label>位置</label><div class="pos-grid" id="wmPosition"></div></div>
                    <div class="form-group"><label><input id="wmTiled" type="checkbox"> 对角线平铺</label></div>
                    <div class="form-group"><label for="wmGap">平铺间距（短边百分比）</label><input id="wmGap" type="range" min="8" max="40" value="18"></div>
                    <button class="btn btn-primary export-btn" id="wmExport" type="button" disabled>导出</button>
                    <div class="errors" id="wmErrors"></div>
                </div>
            </div>
        </section>

        <section class="tab-panel" data-panel="crop">
            <div class="layout">
                <div class="preview-pane">
                    <div class="preview-toolbar">
                        <button class="btn btn-secondary pick-btn" id="cropPick" type="button">选择图片</button>
                        <button class="btn btn-secondary" id="cropClear" type="button">重置</button>
                    </div>
                    <div class="dropzone" id="cropDrop">
                        <input class="hidden-file" id="cropFile" type="file" accept="image/jpeg,image/png,image/webp">
                        <div class="drop-hint" id="cropHint"><i class="fas fa-crop"></i><div>点击或拖拽上传一张图片</div></div>
                        <div id="cropWrap" hidden><img id="cropImage" alt="裁切预览"></div>
                    </div>
                </div>
                <div class="control-pane">
                    <div class="form-group"><label>比例</label><div class="ratio-row" id="cropRatios"></div></div>
                    <div class="tool-row">
                        <button type="button" id="cropRotateCcw">逆时针 90°</button>
                        <button type="button" id="cropRotateCw">顺时针 90°</button>
                        <button type="button" id="cropFlipH">水平翻转</button>
                        <button type="button" id="cropFlipV">垂直翻转</button>
                        <button type="button" id="cropReset">还原裁切</button>
                    </div>
                    <button class="btn btn-primary export-btn" id="cropExport" type="button" disabled>导出</button>
                    <div class="errors" id="cropErrors"></div>
                </div>
            </div>
        </section>

        <section class="tab-panel" data-panel="compress">
            <div class="layout">
                <div class="preview-pane">
                    <div class="preview-toolbar">
                        <button class="btn btn-secondary pick-btn" id="cpPick" type="button">选择图片</button>
                        <button class="btn btn-secondary" id="cpClear" type="button">重置</button>
                        <label class="batch-toggle"><input id="cpBatch" type="checkbox"> 批量处理</label>
                    </div>
                    <div class="dropzone" id="cpDrop">
                        <input class="hidden-file" id="cpFile" type="file" accept="image/jpeg,image/png,image/webp">
                        <div class="drop-hint" id="cpHint"><i class="fas fa-compress"></i><div>点击或拖拽上传一张图片</div></div>
                        <img id="cpPreview" alt="" hidden>
                    </div>
                    <div class="thumbs" id="cpThumbs" hidden></div>
                </div>
                <div class="control-pane">
                    <div class="form-group"><label for="cpQuality">质量</label><input id="cpQuality" type="range" min="1" max="100" value="80"></div>
                    <div class="form-group"><label for="cpSize">目标体积</label>
                        <div style="display:flex;gap:8px;">
                            <input id="cpSize" class="form-input" type="number" min="0.1" step="0.1">
                            <select id="cpUnit" class="form-input form-select"><option value="KB">KB</option><option value="MB">MB</option></select>
                        </div>
                    </div>
                    <div class="size-presets">
                        <button type="button" data-kb="200">200 KB</button>
                        <button type="button" data-kb="500">500 KB</button>
                        <button type="button" data-mb="1">1 MB</button>
                    </div>
                    <div class="form-group"><label for="cpFormat">输出格式</label>
                        <select id="cpFormat" class="form-input form-select">
                            <option value="image/jpeg">JPEG</option>
                            <option value="image/webp">WebP</option>
                        </select>
                    </div>
                    <div class="stats" id="cpStats"></div>
                    <button class="btn btn-primary export-btn" id="cpExport" type="button" disabled>导出</button>
                    <div class="errors" id="cpErrors"></div>
                </div>
            </div>
        </section>
        <section class="tab-panel" data-panel="redact">
            <div class="layout">
                <div class="preview-pane">
                    <div class="preview-toolbar">
                        <button class="btn btn-secondary pick-btn" id="rdPick" type="button">选择图片</button>
                        <button class="btn btn-secondary" id="rdClear" type="button">重置</button>
                    </div>
                    <div class="dropzone" id="rdDrop">
                        <input class="hidden-file" id="rdFile" type="file" accept="image/jpeg,image/png,image/webp">
                        <div class="drop-hint" id="rdHint"><i class="fas fa-eraser"></i><div>点击或拖拽上传一张图片</div></div>
                        <canvas id="rdCanvas" hidden></canvas>
                    </div>
                </div>
                <div class="control-pane">
                    <div class="form-group"><label>工具</label>
                        <div class="tool-row" id="rdTools">
                            <button type="button" id="rdToolRect" data-tool="rect" class="active">矩形</button>
                            <button type="button" id="rdToolBrush" data-tool="brush">画笔</button>
                        </div>
                    </div>
                    <div class="form-group"><label>效果</label>
                        <div class="tool-row" id="rdEffects">
                            <button type="button" data-effect="mosaic" class="active">马赛克</button>
                            <button type="button" data-effect="blur">模糊</button>
                            <button type="button" data-effect="solid">纯色</button>
                            <button type="button" data-effect="emoji">表情</button>
                        </div>
                    </div>
                    <div class="form-group" id="rdMosaicGroup"><label for="rdMosaic">马赛克块大小</label><input id="rdMosaic" type="range" min="8" max="64" value="16"></div>
                    <div class="form-group" id="rdBlurGroup" hidden><label for="rdBlur">模糊强度</label><input id="rdBlur" type="range" min="1" max="20" value="8"></div>
                    <div class="form-group" id="rdColorGroup" hidden><label for="rdColor">颜色</label><input id="rdColor" type="color" value="#000000"></div>
                    <div class="form-group" id="rdEmojiGroup" hidden><label>表情</label><div class="emoji-grid" id="rdEmojis"></div></div>
                    <div class="form-group" id="rdBrushGroup" hidden><label for="rdBrush">画笔直径（短边百分比）</label><input id="rdBrush" type="range" min="1" max="12" value="4"></div>
                    <div class="tool-row">
                        <button type="button" id="rdUndo" disabled>撤销</button>
                        <button type="button" id="rdDelete" disabled>删除选中</button>
                    </div>
                    <button class="btn btn-primary export-btn" id="rdExport" type="button" disabled>导出</button>
                    <div class="errors" id="rdErrors"></div>
                </div>
            </div>
        </section>
    </div>
    <div id="toastContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="../js/image-processor-core.js"></script>
    <script>
        const core = window.ImageProcessorCore;
        const STORAGE_KEY = '17tools-image-processor';
        const POS_LABELS = { tl: '左上', t: '上', tr: '右上', l: '左', c: '中', r: '右', bl: '左下', b: '下', br: '右下' };
        const FONT_STACKS = {
            sans: '"PingFang SC", "Microsoft YaHei", sans-serif',
            serif: '"Songti SC", "SimSun", serif',
            mono: '"SF Mono", Menlo, monospace'
        };
        const REDACT_EMOJIS = ['🫣', '🙈', '😀', '⭐', '🚫', '💦', '💩', '❤️', '🔥', '✅'];
        const DEFAULTS = {
            watermark: {
                text: '', fontPercent: 5, color: '#ffffff', opacity: 50, rotation: 0,
                position: 'br', tiled: false, tileGapPercent: 18,
                style: 'fill', font: 'sans', bold: false
            },
            compress: { outputMime: 'image/jpeg' },
            redact: {
                mosaicSize: 16, blurStrength: 8, solidColor: '#000000',
                emoji: '🫣', brushPercent: 4, effect: 'mosaic'
            }
        };

        const state = {
            watermark: { items: [], selectedId: null },
            crop: { items: [], selectedId: null, cropper: null, cropImageUrl: null, ratio: 'free' },
            compress: { items: [], selectedId: null, controlMode: 'quality', previewUrl: null, lastBlob: null, lastPlan: null, runId: 0 },
            redact: {
                items: [], selectedId: null, regions: [], selectedRegionId: null,
                tool: 'rect', undo: [], drag: null
            }
        };

        function loadSettings() {
            try {
                const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '');
                return {
                    watermark: { ...DEFAULTS.watermark, ...(parsed.watermark || {}) },
                    compress: { ...DEFAULTS.compress, ...(parsed.compress || {}) },
                    redact: { ...DEFAULTS.redact, ...(parsed.redact || {}) }
                };
            } catch (error) {
                return {
                    watermark: { ...DEFAULTS.watermark },
                    compress: { ...DEFAULTS.compress },
                    redact: { ...DEFAULTS.redact }
                };
            }
        }

        const settings = loadSettings();
        function saveSettings() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                watermark: readWatermarkSettings(),
                compress: { outputMime: document.getElementById('cpFormat').value },
                redact: {
                    mosaicSize: Number(document.getElementById('rdMosaic').value),
                    blurStrength: Number(document.getElementById('rdBlur').value),
                    solidColor: document.getElementById('rdColor').value,
                    emoji: document.querySelector('#rdEmojis button.active')?.dataset.emoji || '🫣',
                    brushPercent: Number(document.getElementById('rdBrush').value)
                }
            }));
        }

        function showToast(message) {
            const box = document.createElement('div');
            box.className = 'toast';
            const icon = document.createElement('i');
            icon.className = 'fas fa-info-circle';
            const span = document.createElement('span');
            span.textContent = message;
            box.append(icon, span);
            document.getElementById('toastContainer').appendChild(box);
            setTimeout(() => box.remove(), 3200);
        }

        function setErrors(id, lines) {
            document.getElementById(id).textContent = lines.join('\n');
        }

        async function loadBitmap(file) {
            if (typeof createImageBitmap === 'function') {
                try {
                    return await createImageBitmap(file, { imageOrientation: 'from-image' });
                } catch (error) { /* fall through */ }
            }
            const url = URL.createObjectURL(file);
            const image = new Image();
            image.src = url;
            await image.decode();
            URL.revokeObjectURL(url);
            return image;
        }

        function revokeItem(item) {
            if (item.url) URL.revokeObjectURL(item.url);
            if (item.bitmap && typeof item.bitmap.close === 'function') item.bitmap.close();
        }

        function isBatch(tab) {
            if (tab === 'crop' || tab === 'redact') return false;
            const box = document.getElementById(tab === 'watermark' ? 'wmBatch' : 'cpBatch');
            return !!(box && box.checked);
        }

        function updateUploadHint(tab) {
            const batch = isBatch(tab);
            const hint = document.getElementById(tab === 'watermark' ? 'wmHint' : 'cpHint');
            if (!hint) return;
            const line = hint.querySelector('div');
            if (line) line.textContent = batch ? '点击或拖拽上传，可一次选择多张' : '点击或拖拽上传一张图片';
        }

        function syncBatchInput(tab) {
            const input = document.getElementById(tab === 'watermark' ? 'wmFile' : 'cpFile');
            const batch = isBatch(tab);
            if (batch) input.setAttribute('multiple', '');
            else input.removeAttribute('multiple');
            if (!batch && state[tab].items.length > 1) {
                state[tab].items.slice(1).forEach(revokeItem);
                state[tab].items = state[tab].items.slice(0, 1);
                state[tab].selectedId = state[tab].items[0].id;
            }
            updateUploadHint(tab);
            if (tab === 'watermark') renderWatermark();
            if (tab === 'compress') renderCompress();
        }

        function clearImages(tab) {
            state[tab].items.forEach(revokeItem);
            state[tab].items = [];
            state[tab].selectedId = null;
            if (tab === 'crop') {
                if (state.crop.cropper) {
                    state.crop.cropper.destroy();
                    state.crop.cropper = null;
                }
                revokeCropImageUrl();
            }
            if (tab === 'compress') {
                if (state.compress.previewUrl) URL.revokeObjectURL(state.compress.previewUrl);
                state.compress.previewUrl = null;
                state.compress.lastBlob = null;
                state.compress.lastPlan = null;
            }
            if (tab === 'redact') {
                state.redact.regions = [];
                state.redact.selectedRegionId = null;
                state.redact.undo = [];
                state.redact.drag = null;
            }
            const input = document.getElementById(
                tab === 'watermark' ? 'wmFile' : tab === 'crop' ? 'cropFile' : tab === 'redact' ? 'rdFile' : 'cpFile'
            );
            if (input) input.value = '';
            if (tab === 'watermark') renderWatermark();
            if (tab === 'crop') renderCrop();
            if (tab === 'compress') renderCompress();
            if (tab === 'redact') renderRedact();
        }

        async function ingestFiles(tab, fileList, single) {
            const files = [...fileList];
            const bucket = state[tab];
            const errors = [];
            if (single && files.length > 1) {
                showToast('当前为单张模式，已使用第一张');
            }
            let incoming;
            if (single) {
                incoming = files.slice(0, 1);
            } else {
                const remaining = core.MAX_BATCH_COUNT - bucket.items.length;
                if (files.length > remaining) {
                    showToast('一次最多 20 张，已忽略多余文件');
                }
                incoming = files.slice(0, Math.max(0, remaining));
            }
            const nextItems = single ? [] : bucket.items.slice();
            if (single) bucket.items.forEach(revokeItem);
            for (const file of incoming) {
                const checked = core.validateFile(file);
                if (!checked.ok) {
                    errors.push(file.name + '：' + (checked.reason === 'size' ? '单张不能超过 20 MB' : '仅支持 JPEG / PNG / WebP'));
                    continue;
                }
                try {
                    const bitmap = await loadBitmap(file);
                    const item = {
                        id: `${file.name}-${file.size}-${Math.random()}`,
                        file,
                        name: file.name,
                        mime: core.resolveMime(file.name, file.type),
                        size: file.size,
                        url: URL.createObjectURL(file),
                        bitmap,
                        width: bitmap.width,
                        height: bitmap.height
                    };
                    nextItems.push(item);
                } catch (error) {
                    errors.push(file.name + '：无法读取');
                }
            }
            bucket.items = nextItems;
            bucket.selectedId = bucket.items[0] ? bucket.items[0].id : null;
            setErrors(tab === 'watermark' ? 'wmErrors' : tab === 'crop' ? 'cropErrors' : tab === 'redact' ? 'rdErrors' : 'cpErrors', errors);
            if (tab === 'watermark') renderWatermark();
            if (tab === 'crop') renderCrop();
            if (tab === 'compress') renderCompress();
            if (tab === 'redact') {
                state.redact.regions = [];
                state.redact.selectedRegionId = null;
                state.redact.undo = [];
                state.redact.drag = null;
                renderRedact();
            }
        }

        function selected(tab) {
            return state[tab].items.find((item) => item.id === state[tab].selectedId) || null;
        }

        const REDACT_MAX = 50;
        const REDACT_UNDO_MAX = 40;
        const REDACT_MIN_DRAG = 4;
        const REDACT_EMOJI_FONT = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';

        function readRedactSettings() {
            return {
                mosaicSize: Number(document.getElementById('rdMosaic').value),
                blurStrength: Number(document.getElementById('rdBlur').value),
                solidColor: document.getElementById('rdColor').value,
                emoji: document.querySelector('#rdEmojis button.active')?.dataset.emoji || '🫣',
                brushPercent: Number(document.getElementById('rdBrush').value),
                effect: document.querySelector('#rdEffects button.active')?.dataset.effect || 'mosaic'
            };
        }

        function showRedactParams(effect, tool) {
            document.getElementById('rdMosaicGroup').hidden = effect !== 'mosaic';
            document.getElementById('rdBlurGroup').hidden = effect !== 'blur';
            document.getElementById('rdColorGroup').hidden = effect !== 'solid';
            document.getElementById('rdEmojiGroup').hidden = effect !== 'emoji';
            document.getElementById('rdBrushGroup').hidden = tool !== 'brush';
        }

        function syncRedactSidebarFromRegion(region) {
            const wm = readRedactSettings();
            const effect = region ? region.effect : wm.effect;
            document.querySelectorAll('#rdEffects button').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.effect === effect);
            });
            if (region) {
                document.getElementById('rdMosaic').value = String(region.mosaicSize);
                document.getElementById('rdBlur').value = String(region.blurStrength);
                document.getElementById('rdColor').value = region.solidColor;
                document.querySelectorAll('#rdEmojis button').forEach((btn) => {
                    btn.classList.toggle('active', btn.dataset.emoji === region.emoji);
                });
            }
            showRedactParams(effect, state.redact.tool);
        }

        function canvasImagePoint(canvas, event) {
            const rect = canvas.getBoundingClientRect();
            const cssW = rect.width || 1;
            const cssH = rect.height || 1;
            return {
                x: (event.clientX - rect.left) * (canvas.width / cssW),
                y: (event.clientY - rect.top) * (canvas.height / cssH)
            };
        }

        function cloneRegions(regions) {
            return JSON.parse(JSON.stringify(regions));
        }

        function pushRedactUndo() {
            state.redact.undo.push({
                regions: cloneRegions(state.redact.regions),
                selectedRegionId: state.redact.selectedRegionId
            });
            if (state.redact.undo.length > REDACT_UNDO_MAX) state.redact.undo.shift();
        }

        function hitRedactRegion(x, y) {
            const list = state.redact.regions;
            for (let i = list.length - 1; i >= 0; i -= 1) {
                const region = list[i];
                const hit = region.kind === 'brush'
                    ? core.hitTestStroke(region.points, region.brushRadius, x, y)
                    : core.hitTestRect(region, x, y);
                if (hit) return region;
            }
            return null;
        }

        function handleAt(region, x, y, scale) {
            if (!region || region.kind !== 'rect') return null;
            const size = 10 * scale;
            const corners = [
                { name: 'nw', x: region.x, y: region.y },
                { name: 'ne', x: region.x + region.w, y: region.y },
                { name: 'sw', x: region.x, y: region.y + region.h },
                { name: 'se', x: region.x + region.w, y: region.y + region.h }
            ];
            return corners.find((c) => Math.hypot(x - c.x, y - c.y) <= size)?.name || null;
        }

        function brushBounds(points, radius, width, height) {
            let minX = Infinity;
            let minY = Infinity;
            let maxX = -Infinity;
            let maxY = -Infinity;
            points.forEach((p) => {
                minX = Math.min(minX, p.x);
                minY = Math.min(minY, p.y);
                maxX = Math.max(maxX, p.x);
                maxY = Math.max(maxY, p.y);
            });
            return core.clampRect({
                x: minX - radius,
                y: minY - radius,
                w: (maxX - minX) + radius * 2,
                h: (maxY - minY) + radius * 2
            }, width, height);
        }

        function makeRedactRegion(kind, item, extra) {
            const settings = readRedactSettings();
            return {
                id: `${kind}-${Date.now()}-${Math.random()}`,
                kind,
                points: null,
                brushRadius: null,
                effect: settings.effect,
                mosaicSize: settings.mosaicSize,
                blurStrength: settings.blurStrength,
                solidColor: settings.solidColor,
                emoji: settings.emoji,
                ...extra
            };
        }

        function regionMask(region) {
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, region.w);
            canvas.height = Math.max(1, region.h);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.strokeStyle = '#000';
            if (region.kind === 'rect') {
                ctx.fillRect(0, 0, region.w, region.h);
            } else {
                const radius = region.brushRadius || 1;
                ctx.lineWidth = radius * 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                const pts = region.points || [];
                if (pts.length === 1) {
                    ctx.beginPath();
                    ctx.arc(pts[0].x - region.x, pts[0].y - region.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                } else if (pts.length) {
                    ctx.beginPath();
                    pts.forEach((p, i) => {
                        const x = p.x - region.x;
                        const y = p.y - region.y;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    });
                    ctx.stroke();
                }
            }
            return canvas;
        }

        function paintEffect(ectx, region) {
            const box = { x: 0, y: 0, w: region.w, h: region.h };
            if (region.effect === 'mosaic') {
                core.computeMosaicCells(box, region.mosaicSize).forEach((cell) => {
                    const data = ectx.getImageData(cell.x, cell.y, cell.w, cell.h);
                    let r = 0;
                    let g = 0;
                    let b = 0;
                    const n = data.data.length / 4;
                    for (let i = 0; i < data.data.length; i += 4) {
                        r += data.data[i];
                        g += data.data[i + 1];
                        b += data.data[i + 2];
                    }
                    ectx.fillStyle = `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`;
                    ectx.fillRect(cell.x, cell.y, cell.w, cell.h);
                });
                return;
            }
            if (region.effect === 'blur') {
                const sw = Math.max(1, Math.round(region.w / region.blurStrength));
                const sh = Math.max(1, Math.round(region.h / region.blurStrength));
                const small = document.createElement('canvas');
                small.width = sw;
                small.height = sh;
                const sctx = small.getContext('2d');
                sctx.imageSmoothingEnabled = true;
                sctx.drawImage(ectx.canvas, 0, 0, sw, sh);
                ectx.clearRect(0, 0, region.w, region.h);
                ectx.imageSmoothingEnabled = true;
                ectx.drawImage(small, 0, 0, region.w, region.h);
                return;
            }
            if (region.effect === 'solid') {
                ectx.fillStyle = region.solidColor;
                ectx.fillRect(0, 0, region.w, region.h);
                return;
            }
            ectx.textAlign = 'center';
            ectx.textBaseline = 'middle';
            core.computeEmojiTiles(box).forEach((tile) => {
                ectx.font = `${tile.size * 0.82}px ${REDACT_EMOJI_FONT}`;
                ectx.fillText(region.emoji, tile.x + tile.size / 2, tile.y + tile.size / 2);
            });
        }

        function applyRedactRegion(destCtx, region) {
            const effectCanvas = document.createElement('canvas');
            effectCanvas.width = Math.max(1, region.w);
            effectCanvas.height = Math.max(1, region.h);
            const ectx = effectCanvas.getContext('2d');
            ectx.drawImage(destCtx.canvas, region.x, region.y, region.w, region.h, 0, 0, region.w, region.h);
            paintEffect(ectx, region);
            ectx.globalCompositeOperation = 'destination-in';
            ectx.drawImage(regionMask(region), 0, 0);
            destCtx.drawImage(effectCanvas, region.x, region.y);
        }

        function drawRedactSelection(ctx, region, scale) {
            ctx.save();
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim() || '#3b82f6';
            ctx.lineWidth = Math.max(1, 2 * scale);
            ctx.setLineDash([6 * scale, 4 * scale]);
            if (region.kind === 'rect') {
                ctx.strokeRect(region.x, region.y, region.w, region.h);
                ctx.setLineDash([]);
                const hs = 5 * scale;
                [[region.x, region.y], [region.x + region.w, region.y], [region.x, region.y + region.h], [region.x + region.w, region.y + region.h]].forEach(([hx, hy]) => {
                    ctx.fillStyle = ctx.strokeStyle;
                    ctx.fillRect(hx - hs, hy - hs, hs * 2, hs * 2);
                });
            } else {
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = (region.brushRadius || 1) * 2 + 4 * scale;
                const pts = region.points || [];
                ctx.beginPath();
                pts.forEach((p, i) => {
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.stroke();
            }
            ctx.restore();
        }

        function compositeRedact(ctx, item, { highlight, draft } = {}) {
            ctx.clearRect(0, 0, item.width, item.height);
            ctx.drawImage(item.bitmap, 0, 0, item.width, item.height);
            state.redact.regions.forEach((region) => applyRedactRegion(ctx, region));
            if (draft) applyRedactRegion(ctx, draft);
            if (highlight) {
                const css = document.getElementById('rdCanvas').getBoundingClientRect();
                const scale = item.width / (css.width || item.width);
                drawRedactSelection(ctx, highlight, scale);
            }
        }

        function renderRedact() {
            const item = selected('redact');
            const canvas = document.getElementById('rdCanvas');
            const hint = document.getElementById('rdHint');
            const selectedRegion = state.redact.regions.find((r) => r.id === state.redact.selectedRegionId) || null;
            document.getElementById('rdExport').disabled = !item || state.redact.regions.length === 0;
            document.getElementById('rdUndo').disabled = state.redact.undo.length === 0;
            document.getElementById('rdDelete').disabled = !selectedRegion;
            showRedactParams(readRedactSettings().effect, state.redact.tool);
            if (!item) {
                canvas.hidden = true;
                hint.hidden = false;
                document.getElementById('rdDrop').classList.remove('has-image');
                return;
            }
            hint.hidden = true;
            canvas.hidden = false;
            document.getElementById('rdDrop').classList.add('has-image');
            canvas.width = item.width;
            canvas.height = item.height;
            const draft = state.redact.drag && state.redact.drag.preview ? state.redact.drag.preview : null;
            compositeRedact(canvas.getContext('2d'), item, { highlight: selectedRegion, draft });
        }

        function commitNewRegion(region) {
            if (state.redact.regions.length >= REDACT_MAX) {
                showToast('最多 50 处打码');
                return;
            }
            pushRedactUndo();
            state.redact.regions.push(region);
            state.redact.selectedRegionId = region.id;
            syncRedactSidebarFromRegion(region);
            renderRedact();
        }

        function applyRectFromPoints(x0, y0, x1, y1, item) {
            return core.clampRect({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 }, item.width, item.height);
        }

        function clampPoint(item, pt) {
            return {
                x: Math.min(item.width, Math.max(0, pt.x)),
                y: Math.min(item.height, Math.max(0, pt.y))
            };
        }

        function initRedactUi() {
            const stored = { ...DEFAULTS.redact, ...(loadSettings().redact || {}) };
            document.getElementById('rdMosaic').value = String(stored.mosaicSize || 16);
            document.getElementById('rdBlur').value = String(stored.blurStrength || 8);
            document.getElementById('rdColor').value = stored.solidColor || '#000000';
            document.getElementById('rdBrush').value = String(stored.brushPercent || 4);
            const grid = document.getElementById('rdEmojis');
            grid.replaceChildren();
            REDACT_EMOJIS.forEach((emoji) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.dataset.emoji = emoji;
                btn.textContent = emoji;
                if (emoji === (stored.emoji || '🫣')) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    grid.querySelectorAll('button').forEach((el) => el.classList.remove('active'));
                    btn.classList.add('active');
                    const region = state.redact.regions.find((r) => r.id === state.redact.selectedRegionId);
                    if (region) {
                        pushRedactUndo();
                        region.emoji = emoji;
                    }
                    saveSettings();
                    renderRedact();
                });
                grid.appendChild(btn);
            });
            document.querySelectorAll('#rdTools button').forEach((btn) => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#rdTools button').forEach((el) => el.classList.remove('active'));
                    btn.classList.add('active');
                    state.redact.tool = btn.dataset.tool;
                    showRedactParams(readRedactSettings().effect, state.redact.tool);
                });
            });
            document.querySelectorAll('#rdEffects button').forEach((btn) => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#rdEffects button').forEach((el) => el.classList.remove('active'));
                    btn.classList.add('active');
                    const region = state.redact.regions.find((r) => r.id === state.redact.selectedRegionId);
                    if (region) {
                        pushRedactUndo();
                        region.effect = btn.dataset.effect;
                    }
                    showRedactParams(btn.dataset.effect, state.redact.tool);
                    renderRedact();
                });
            });
            function onParamInput(write) {
                const region = state.redact.regions.find((r) => r.id === state.redact.selectedRegionId);
                if (region) write(region);
                else saveSettings();
                renderRedact();
            }
            let paramSnapshot = null;
            ['rdMosaic', 'rdBlur', 'rdBrush'].forEach((id) => {
                const el = document.getElementById(id);
                el.addEventListener('pointerdown', () => {
                    paramSnapshot = {
                        regions: cloneRegions(state.redact.regions),
                        selectedRegionId: state.redact.selectedRegionId
                    };
                });
                el.addEventListener('input', () => {
                    onParamInput((region) => {
                        region.mosaicSize = Number(document.getElementById('rdMosaic').value);
                        region.blurStrength = Number(document.getElementById('rdBlur').value);
                        if (id === 'rdBrush') return;
                    });
                });
                el.addEventListener('pointerup', () => {
                    if (!paramSnapshot) return;
                    if (JSON.stringify(paramSnapshot.regions) !== JSON.stringify(state.redact.regions)) {
                        state.redact.undo.push(paramSnapshot);
                        if (state.redact.undo.length > REDACT_UNDO_MAX) state.redact.undo.shift();
                    }
                    paramSnapshot = null;
                    saveSettings();
                    document.getElementById('rdUndo').disabled = state.redact.undo.length === 0;
                });
            });
            document.getElementById('rdColor').addEventListener('change', () => {
                const region = state.redact.regions.find((r) => r.id === state.redact.selectedRegionId);
                if (region) {
                    pushRedactUndo();
                    region.solidColor = document.getElementById('rdColor').value;
                }
                saveSettings();
                renderRedact();
            });
            document.getElementById('rdUndo').addEventListener('click', () => {
                const prev = state.redact.undo.pop();
                if (!prev) return;
                state.redact.regions = prev.regions;
                state.redact.selectedRegionId = prev.regions.some((r) => r.id === prev.selectedRegionId)
                    ? prev.selectedRegionId
                    : null;
                syncRedactSidebarFromRegion(
                    state.redact.regions.find((r) => r.id === state.redact.selectedRegionId) || null
                );
                renderRedact();
            });
            document.getElementById('rdDelete').addEventListener('click', () => {
                if (!state.redact.selectedRegionId) return;
                pushRedactUndo();
                state.redact.regions = state.redact.regions.filter((r) => r.id !== state.redact.selectedRegionId);
                state.redact.selectedRegionId = null;
                renderRedact();
            });
            document.getElementById('rdExport').addEventListener('click', exportRedact);
            document.getElementById('rdClear').addEventListener('click', () => clearImages('redact'));

            const canvas = document.getElementById('rdCanvas');
            canvas.addEventListener('pointerdown', (event) => {
                const item = selected('redact');
                if (!item) return;
                event.preventDefault();
                canvas.setPointerCapture(event.pointerId);
                const pt = canvasImagePoint(canvas, event);
                const css = canvas.getBoundingClientRect();
                const scale = item.width / (css.width || item.width);
                const selectedRegion = state.redact.regions.find((r) => r.id === state.redact.selectedRegionId) || null;
                if (state.redact.tool === 'rect') {
                    const handle = handleAt(selectedRegion, pt.x, pt.y, scale);
                    if (handle) {
                        state.redact.drag = {
                            mode: 'resize',
                            handle,
                            start: pt,
                            origin: { ...selectedRegion },
                            originRegions: cloneRegions(state.redact.regions),
                            moved: false
                        };
                        return;
                    }
                    const hit = hitRedactRegion(pt.x, pt.y);
                    if (hit && hit.kind === 'rect') {
                        state.redact.selectedRegionId = hit.id;
                        state.redact.drag = {
                            mode: 'move',
                            start: pt,
                            origin: { ...hit },
                            originRegions: cloneRegions(state.redact.regions),
                            id: hit.id,
                            moved: false
                        };
                        syncRedactSidebarFromRegion(hit);
                        renderRedact();
                        return;
                    }
                    if (hit && hit.kind === 'brush') {
                        state.redact.drag = { mode: 'select', start: pt, region: hit, moved: false };
                        return;
                    }
                    state.redact.drag = { mode: 'rect', start: pt, moved: false };
                    return;
                }
                const hitBrush = hitRedactRegion(pt.x, pt.y);
                state.redact.drag = {
                    mode: 'brush',
                    start: pt,
                    points: [{ x: pt.x, y: pt.y }],
                    hit: hitBrush,
                    moved: false
                };
            });
            canvas.addEventListener('pointermove', (event) => {
                const drag = state.redact.drag;
                const item = selected('redact');
                if (!drag || !item) return;
                const pt = canvasImagePoint(canvas, event);
                if (Math.hypot(pt.x - drag.start.x, pt.y - drag.start.y) >= REDACT_MIN_DRAG) drag.moved = true;
                if (drag.mode === 'rect' && drag.moved) {
                    const box = applyRectFromPoints(drag.start.x, drag.start.y, pt.x, pt.y, item);
                    drag.preview = box ? makeRedactRegion('rect', item, box) : null;
                    renderRedact();
                    return;
                }
                if (drag.mode === 'brush' && drag.moved) {
                    drag.points.push(clampPoint(item, pt));
                    const radius = core.brushRadiusFromPercent(Math.min(item.width, item.height), readRedactSettings().brushPercent);
                    const box = brushBounds(drag.points, radius, item.width, item.height);
                    drag.preview = box ? makeRedactRegion('brush', item, {
                        ...box,
                        points: core.simplifyPoints(drag.points, 1),
                        brushRadius: radius
                    }) : null;
                    renderRedact();
                    return;
                }
                if (drag.mode === 'move' && drag.moved) {
                    const region = state.redact.regions.find((r) => r.id === drag.id);
                    if (!region) return;
                    const dx = pt.x - drag.start.x;
                    const dy = pt.y - drag.start.y;
                    const next = core.clampRect({
                        x: drag.origin.x + dx,
                        y: drag.origin.y + dy,
                        w: drag.origin.w,
                        h: drag.origin.h
                    }, item.width, item.height);
                    if (next) Object.assign(region, next);
                    renderRedact();
                    return;
                }
                if (drag.mode === 'resize' && drag.moved) {
                    const o = drag.origin;
                    let x = o.x;
                    let y = o.y;
                    let r = o.x + o.w;
                    let b = o.y + o.h;
                    if (drag.handle.includes('n')) y = pt.y;
                    if (drag.handle.includes('s')) b = pt.y;
                    if (drag.handle.includes('w')) x = pt.x;
                    if (drag.handle.includes('e')) r = pt.x;
                    const live = state.redact.regions.find((rg) => rg.id === state.redact.selectedRegionId);
                    const next = core.clampRect({ x, y, w: r - x, h: b - y }, item.width, item.height);
                    if (live && next) Object.assign(live, next);
                    renderRedact();
                }
            });
            canvas.addEventListener('pointerup', (event) => {
                const drag = state.redact.drag;
                const item = selected('redact');
                state.redact.drag = null;
                if (!drag || !item) {
                    renderRedact();
                    return;
                }
                const pt = canvasImagePoint(canvas, event);
                const dist = Math.hypot(pt.x - drag.start.x, pt.y - drag.start.y);
                if (drag.mode === 'rect') {
                    if (dist < REDACT_MIN_DRAG) {
                        const hit = hitRedactRegion(drag.start.x, drag.start.y);
                        state.redact.selectedRegionId = hit ? hit.id : null;
                        syncRedactSidebarFromRegion(hit);
                    } else if (drag.preview) {
                        commitNewRegion(drag.preview);
                        return;
                    }
                    renderRedact();
                    return;
                }
                if (drag.mode === 'brush') {
                    if (dist < REDACT_MIN_DRAG && drag.hit) {
                        state.redact.selectedRegionId = drag.hit.id;
                        syncRedactSidebarFromRegion(drag.hit);
                        renderRedact();
                        return;
                    }
                    if (drag.preview) {
                        commitNewRegion(drag.preview);
                        return;
                    }
                    renderRedact();
                    return;
                }
                if ((drag.mode === 'move' || drag.mode === 'resize') && drag.moved) {
                    state.redact.undo.push({
                        regions: drag.originRegions,
                        selectedRegionId: state.redact.selectedRegionId
                    });
                    if (state.redact.undo.length > REDACT_UNDO_MAX) state.redact.undo.shift();
                }
                if (drag.mode === 'select' && dist < REDACT_MIN_DRAG) {
                    state.redact.selectedRegionId = drag.region.id;
                    syncRedactSidebarFromRegion(drag.region);
                }
                renderRedact();
            });
            document.addEventListener('keydown', (event) => {
                const panel = document.querySelector('[data-panel="redact"]');
                if (!panel || !panel.classList.contains('active')) return;
                const tag = (event.target && event.target.tagName) || '';
                if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
                if (event.key === 'Escape') {
                    state.redact.selectedRegionId = null;
                    renderRedact();
                }
                if ((event.key === 'Backspace' || event.key === 'Delete') && state.redact.selectedRegionId) {
                    event.preventDefault();
                    document.getElementById('rdDelete').click();
                }
            });
            showRedactParams(stored.effect || 'mosaic', 'rect');
        }

        async function exportRedact() {
            const item = selected('redact');
            if (!item || !state.redact.regions.length) return;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = item.width;
                canvas.height = item.height;
                compositeRedact(canvas.getContext('2d'), item, { highlight: null, draft: null });
                const blob = await canvasToBlob(canvas, item.mime, item.mime === 'image/png' ? undefined : 0.92);
                downloadBlob(blob, core.buildExportName(item.name, 'redacted', item.mime));
                setErrors('rdErrors', []);
            } catch (error) {
                setErrors('rdErrors', ['无法导出']);
            }
        }

        function bindDrop(dropId, inputId, tab) {
            const drop = document.getElementById(dropId);
            const input = document.getElementById(inputId);
            drop.addEventListener('click', (event) => {
                if ((tab === 'crop' || tab === 'redact') && state[tab].items.length) return;
                if (event.target.closest('.cropper-container, canvas, img, #cropWrap')) return;
                input.click();
            });
            const pick = document.getElementById(dropId.replace('Drop', 'Pick'));
            if (pick) pick.addEventListener('click', () => input.click());
            drop.addEventListener('dragover', (event) => { event.preventDefault(); });
            drop.addEventListener('drop', (event) => {
                event.preventDefault();
                if ((tab === 'crop' || tab === 'redact') && state[tab].items.length) return;
                ingestFiles(tab, event.dataTransfer.files, !isBatch(tab));
            });
            input.addEventListener('change', () => {
                ingestFiles(tab, input.files, !isBatch(tab));
                input.value = '';
            });
        }

        function renderThumbs(containerId, tab, onSelect) {
            const box = document.getElementById(containerId);
            box.replaceChildren();
            state[tab].items.forEach((item) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                if (item.id === state[tab].selectedId) btn.classList.add('active');
                const img = document.createElement('img');
                img.src = item.url;
                img.alt = item.name;
                const span = document.createElement('span');
                span.textContent = item.name;
                btn.append(img, span);
                btn.addEventListener('click', () => onSelect(item.id));
                box.appendChild(btn);
            });
        }

        function readWatermarkSettings() {
            return {
                text: document.getElementById('wmText').value,
                fontPercent: Number(document.getElementById('wmFont').value),
                color: document.getElementById('wmColor').value,
                opacity: Number(document.getElementById('wmOpacity').value),
                rotation: Number(document.getElementById('wmRotation').value),
                position: document.querySelector('#wmPosition button.active')?.dataset.pos || 'br',
                tiled: document.getElementById('wmTiled').checked,
                tileGapPercent: Number(document.getElementById('wmGap').value),
                style: document.getElementById('wmStyle').value,
                font: document.getElementById('wmFontFamily').value,
                bold: document.getElementById('wmBold').checked
            };
        }

        function applyWatermarkFont(ctx, wm, fontPx) {
            const family = FONT_STACKS[wm.font] || FONT_STACKS.sans;
            ctx.font = `${wm.bold ? '700' : '400'} ${fontPx}px ${family}`;
        }

        function paintWatermarkText(ctx, text, wm, fontPx) {
            applyWatermarkFont(ctx, wm, fontPx);
            ctx.fillStyle = wm.color;
            ctx.strokeStyle = wm.color;
            ctx.lineJoin = 'round';
            ctx.lineWidth = Math.max(2, fontPx * 0.1);
            const style = wm.style || 'fill';
            if (style === 'shadow') {
                ctx.shadowColor = 'rgba(0,0,0,0.7)';
                ctx.shadowBlur = fontPx * 0.28;
                ctx.shadowOffsetX = fontPx * 0.08;
                ctx.shadowOffsetY = fontPx * 0.08;
                ctx.fillText(text, 0, 0);
                ctx.shadowColor = 'transparent';
                return;
            }
            if (style === 'stroke') {
                ctx.strokeText(text, 0, 0);
                ctx.fillText(text, 0, 0);
                return;
            }
            if (style === 'stamp') {
                const metrics = ctx.measureText(text);
                const padX = fontPx * 0.4;
                const padY = fontPx * 0.32;
                const boxW = metrics.width + padX * 2;
                const boxH = fontPx + padY * 2;
                let x = -padX;
                let y = -padY;
                if (ctx.textAlign === 'right') x = -boxW + padX;
                else if (ctx.textAlign === 'center') x = -boxW / 2;
                if (ctx.textBaseline === 'bottom') y = -boxH + padY;
                else if (ctx.textBaseline === 'middle') y = -boxH / 2;
                ctx.strokeRect(x, y, boxW, boxH);
                ctx.fillText(text, 0, 0);
                return;
            }
            ctx.fillText(text, 0, 0);
        }

        function contrastingText(hex) {
            const value = parseInt((hex || '#000000').replace('#', ''), 16);
            const r = (value >> 16) & 255;
            const g = (value >> 8) & 255;
            const b = value & 255;
            return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? '#111111' : '#ffffff';
        }

        function drawWatermark(ctx, item, wm) {
            const { width, height } = item;
            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(item.bitmap, 0, 0, width, height);
            const text = wm.text.trim();
            if (!text) return;
            const minSide = Math.min(width, height);
            const fontPx = core.computeFontPx(minSide, wm.fontPercent);
            const margin = core.computeMargin(minSide);
            if (wm.style === 'banner') {
                const barH = fontPx * 1.8;
                const topBar = wm.position === 't' || wm.position === 'tl' || wm.position === 'tr';
                const y = topBar ? 0 : height - barH;
                ctx.save();
                ctx.globalAlpha = (wm.opacity / 100) * 0.62;
                ctx.fillStyle = wm.color;
                ctx.fillRect(0, y, width, barH);
                ctx.globalAlpha = 1;
                ctx.fillStyle = contrastingText(wm.color);
                applyWatermarkFont(ctx, wm, fontPx);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, width / 2, y + barH / 2);
                ctx.restore();
                return;
            }
            ctx.save();
            ctx.globalAlpha = wm.opacity / 100;
            if (wm.tiled) {
                const spacing = minSide * (wm.tileGapPercent / 100);
                core.computeTileOrigins({ width, height, spacing }).forEach((origin) => {
                    ctx.save();
                    ctx.translate(origin.x, origin.y);
                    ctx.rotate(wm.rotation * Math.PI / 180);
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    paintWatermarkText(ctx, text, wm, fontPx);
                    ctx.restore();
                });
            } else {
                const anchor = core.computeAnchor(width, height, wm.position, margin);
                ctx.translate(anchor.x, anchor.y);
                ctx.rotate(wm.rotation * Math.PI / 180);
                ctx.textAlign = anchor.textAlign;
                ctx.textBaseline = anchor.textBaseline;
                paintWatermarkText(ctx, text, wm, fontPx);
            }
            ctx.restore();
        }

        function renderWatermark() {
            const item = selected('watermark');
            const canvas = document.getElementById('wmCanvas');
            const hint = document.getElementById('wmHint');
            const wm = readWatermarkSettings();
            document.getElementById('wmExport').disabled = !item || !wm.text.trim();
            const thumbs = document.getElementById('wmThumbs');
            thumbs.hidden = !(isBatch('watermark') && state.watermark.items.length > 0);
            renderThumbs('wmThumbs', 'watermark', (id) => { state.watermark.selectedId = id; renderWatermark(); });
            if (!item) {
                canvas.hidden = true;
                hint.hidden = false;
                document.getElementById('wmDrop').classList.remove('has-image');
                return;
            }
            hint.hidden = true;
            canvas.hidden = false;
            document.getElementById('wmDrop').classList.add('has-image');
            canvas.width = item.width;
            canvas.height = item.height;
            drawWatermark(canvas.getContext('2d'), item, wm);
        }

        function canvasToBlob(canvas, mime, quality) {
            return new Promise((resolve, reject) => {
                canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('toBlob failed')), mime, quality);
            });
        }

        function downloadBlob(blob, filename) {
            const a = document.createElement('a');
            const url = URL.createObjectURL(blob);
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function exportBlobs(files, zipName) {
            if (files.length === 1) {
                downloadBlob(files[0].blob, files[0].name);
                return;
            }
            try {
                const zip = new JSZip();
                files.forEach((file) => zip.file(file.name, file.blob));
                downloadBlob(await zip.generateAsync({ type: 'blob' }), zipName);
            } catch (error) {
                showToast('ZIP 生成失败，改为逐张下载');
                files.forEach((file) => downloadBlob(file.blob, file.name));
            }
        }

        async function exportWatermark() {
            const wm = readWatermarkSettings();
            const lines = [];
            const out = [];
            for (const item of state.watermark.items) {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = item.width;
                    canvas.height = item.height;
                    drawWatermark(canvas.getContext('2d'), item, wm);
                    const quality = item.mime === 'image/png' ? undefined : 0.92;
                    const blob = await canvasToBlob(canvas, item.mime, quality);
                    out.push({ blob, name: core.buildExportName(item.name, 'watermarked', item.mime) });
                } catch (error) {
                    lines.push(item.name + '：无法导出');
                }
            }
            setErrors('wmErrors', lines);
            if (out.length) await exportBlobs(out, 'watermarked.zip');
        }

        function revokeCropImageUrl() {
            if (state.crop.cropImageUrl) {
                URL.revokeObjectURL(state.crop.cropImageUrl);
                state.crop.cropImageUrl = null;
            }
        }

        async function bitmapToPngUrl(bitmap) {
            const canvas = document.createElement('canvas');
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
            canvas.getContext('2d').drawImage(bitmap, 0, 0, bitmap.width, bitmap.height);
            const blob = await canvasToBlob(canvas, 'image/png', undefined);
            return URL.createObjectURL(blob);
        }

        async function renderCrop() {
            const item = selected('crop');
            const wrap = document.getElementById('cropWrap');
            const hint = document.getElementById('cropHint');
            const image = document.getElementById('cropImage');
            document.getElementById('cropExport').disabled = true;
            if (state.crop.cropper) {
                state.crop.cropper.destroy();
                state.crop.cropper = null;
            }
            revokeCropImageUrl();
            if (!item) {
                wrap.hidden = true;
                hint.hidden = false;
                document.getElementById('cropDrop').classList.remove('has-image');
                return;
            }
            hint.hidden = true;
            wrap.hidden = false;
            document.getElementById('cropDrop').classList.add('has-image');
            try {
                const orientedUrl = await bitmapToPngUrl(item.bitmap);
                state.crop.cropImageUrl = orientedUrl;
                image.onload = () => {
                    if (state.crop.cropper) {
                        state.crop.cropper.destroy();
                        state.crop.cropper = null;
                    }
                    try {
                        if (typeof Cropper === 'undefined') throw new ReferenceError('Cropper missing');
                        state.crop.cropper = new Cropper(image, {
                            viewMode: 2,
                            autoCropArea: 0.8,
                            background: false,
                            responsive: true,
                            ready() {
                                fitCropperCanvas();
                            }
                        });
                        applyCropRatio();
                        document.getElementById('cropExport').disabled = false;
                        setErrors('cropErrors', []);
                    } catch (error) {
                        setErrors('cropErrors', ['裁切组件加载失败']);
                        document.getElementById('cropExport').disabled = true;
                    }
                };
                image.src = orientedUrl;
            } catch (error) {
                setErrors('cropErrors', [item.name + '：无法读取']);
                document.getElementById('cropExport').disabled = true;
            }
        }

        function fitCropperCanvas() {
            const cropper = state.crop.cropper;
            if (!cropper) return;
            const container = cropper.getContainerData();
            const canvas = cropper.getCanvasData();
            if (!container.width || !container.height || !canvas.width || !canvas.height) return;
            const ratio = Math.min(container.width / canvas.width, container.height / canvas.height);
            cropper.setCanvasData({
                left: (container.width - canvas.width * ratio) / 2,
                top: (container.height - canvas.height * ratio) / 2,
                width: canvas.width * ratio,
                height: canvas.height * ratio
            });
        }

        function transformCrop(fn) {
            if (!state.crop.cropper) return;
            fn(state.crop.cropper);
            requestAnimationFrame(fitCropperCanvas);
        }

        function applyCropRatio() {
            if (!state.crop.cropper) return;
            const value = state.crop.ratio;
            const map = { free: NaN, '1': 1, '4/3': 4 / 3, '16/9': 16 / 9, '3/4': 3 / 4, '9/16': 9 / 16 };
            state.crop.cropper.setAspectRatio(map[value]);
        }

        async function exportCrop() {
            const item = selected('crop');
            if (!item || !state.crop.cropper) return;
            try {
                const canvas = state.crop.cropper.getCroppedCanvas({
                    fillColor: item.mime === 'image/jpeg' ? '#ffffff' : undefined
                });
                if (!canvas) throw new Error('empty');
                const blob = await canvasToBlob(canvas, item.mime, item.mime === 'image/png' ? undefined : 0.92);
                downloadBlob(blob, core.buildExportName(item.name, 'cropped', item.mime));
                setErrors('cropErrors', []);
            } catch (error) {
                setErrors('cropErrors', ['裁切失败，请重新选择区域']);
            }
        }

        function debounce(fn, wait) {
            let timer = 0;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), wait);
            };
        }

        async function encodeBitmap(bitmap, width, height, mime, quality) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
            return canvasToBlob(canvas, mime, quality);
        }

        async function planCompress(item) {
            const mime = document.getElementById('cpFormat').value;
            const quality = core.qualityToCanvas(document.getElementById('cpQuality').value);
            const targetBytes = core.parseTargetSize(document.getElementById('cpSize').value, document.getElementById('cpUnit').value);
            const encode = async ({ width, height, quality: q }) => {
                const blob = await encodeBitmap(item.bitmap, width, height, mime, q);
                return blob.size;
            };
            if (state.compress.controlMode === 'quality' || targetBytes == null) {
                return core.compressToTarget({
                    sourceWidth: item.width, sourceHeight: item.height, sourceBytes: item.size,
                    targetBytes: targetBytes || 0, controlMode: 'quality', quality, encode
                });
            }
            return core.compressToTarget({
                sourceWidth: item.width, sourceHeight: item.height, sourceBytes: item.size,
                targetBytes, controlMode: 'size', quality, encode
            });
        }

        async function renderCompress() {
            const runId = ++state.compress.runId;
            const item = selected('compress');
            try {
                const thumbs = document.getElementById('cpThumbs');
                thumbs.hidden = !(isBatch('compress') && state.compress.items.length > 0);
                renderThumbs('cpThumbs', 'compress', (id) => { state.compress.selectedId = id; renderCompress(); });
                if (runId !== state.compress.runId) return;
                const preview = document.getElementById('cpPreview');
                const hint = document.getElementById('cpHint');
                document.getElementById('cpExport').disabled = !item;
                if (!item) {
                    preview.hidden = true;
                    hint.hidden = false;
                    document.getElementById('cpDrop').classList.remove('has-image');
                    document.getElementById('cpStats').textContent = '';
                    setErrors('cpErrors', []);
                    return;
                }
                hint.hidden = true;
                preview.hidden = false;
                document.getElementById('cpDrop').classList.add('has-image');
                const plan = await planCompress(item);
                if (runId !== state.compress.runId) return;
                state.compress.lastPlan = plan;
                const mime = document.getElementById('cpFormat').value;
                let blob;
                if (plan.passthrough) {
                    blob = item.file;
                } else {
                    blob = await encodeBitmap(item.bitmap, plan.width, plan.height, mime, plan.quality);
                }
                if (runId !== state.compress.runId) return;
                state.compress.lastBlob = blob;
                if (state.compress.previewUrl) URL.revokeObjectURL(state.compress.previewUrl);
                state.compress.previewUrl = URL.createObjectURL(blob);
                if (runId !== state.compress.runId) return;
                preview.src = state.compress.previewUrl;
                if (state.compress.controlMode === 'size') {
                    document.getElementById('cpQuality').value = String(core.canvasToQuality(plan.quality));
                } else {
                    const formatted = core.formatByteSize(blob.size);
                    document.getElementById('cpSize').value = String(formatted.value);
                    document.getElementById('cpUnit').value = formatted.unit;
                }
                if (runId !== state.compress.runId) return;
                const saved = item.size > 0 ? Math.max(0, Math.round((1 - blob.size / item.size) * 100)) : 0;
                const note = plan.passthrough ? ' · 已小于或等于目标，未再压缩' : '';
                document.getElementById('cpStats').textContent = `原体积 ${core.formatByteSize(item.size).text} · 结果 ${core.formatByteSize(blob.size).text} · 节省 ${saved}% · ${plan.width}×${plan.height}${note}`;
                setErrors('cpErrors', []);
            } catch (error) {
                if (runId !== state.compress.runId) return;
                const name = item ? item.name + '：' : '';
                const reason = error && error.message ? error.message : '处理失败';
                document.getElementById('cpErrors').textContent = name + reason;
            }
        }

        const renderCompressDebounced = debounce(renderCompress, 150);

        async function exportCompress() {
            const mime = document.getElementById('cpFormat').value;
            const lines = [];
            const out = [];
            for (const item of state.compress.items) {
                try {
                    const plan = await planCompress(item);
                    const blob = plan.passthrough
                        ? item.file
                        : await encodeBitmap(item.bitmap, plan.width, plan.height, mime, plan.quality);
                    if (!plan.hitTarget) {
                        lines.push(item.name + '：未达到目标体积，实际 ' + core.formatByteSize(blob.size).text);
                    }
                    const exportMime = plan.passthrough ? item.mime : mime;
                    out.push({ blob, name: core.buildExportName(item.name, 'compressed', exportMime) });
                } catch (error) {
                    lines.push(item.name + '：无法读取');
                }
            }
            setErrors('cpErrors', lines);
            if (out.length) await exportBlobs(out, 'compressed.zip');
        }

        function initWatermarkUi() {
            const grid = document.getElementById('wmPosition');
            core.POSITIONS.forEach((pos) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.dataset.pos = pos;
                btn.textContent = POS_LABELS[pos];
                if (pos === settings.watermark.position) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    grid.querySelectorAll('button').forEach((el) => el.classList.remove('active'));
                    btn.classList.add('active');
                    renderWatermark();
                    saveSettings();
                });
                grid.appendChild(btn);
            });
            const wm = settings.watermark;
            document.getElementById('wmText').value = wm.text;
            document.getElementById('wmFont').value = String(wm.fontPercent);
            document.getElementById('wmColor').value = wm.color;
            document.getElementById('wmOpacity').value = String(wm.opacity);
            document.getElementById('wmRotation').value = String(wm.rotation);
            document.getElementById('wmTiled').checked = wm.tiled;
            document.getElementById('wmGap').value = String(wm.tileGapPercent);
            document.getElementById('wmStyle').value = wm.style || 'fill';
            document.getElementById('wmFontFamily').value = wm.font || 'sans';
            document.getElementById('wmBold').checked = !!wm.bold;
            ['wmText', 'wmFont', 'wmColor', 'wmOpacity', 'wmRotation', 'wmGap'].forEach((id) => {
                document.getElementById(id).addEventListener('input', () => { renderWatermark(); saveSettings(); });
            });
            ['wmStyle', 'wmFontFamily', 'wmBold'].forEach((id) => {
                document.getElementById(id).addEventListener('change', () => { renderWatermark(); saveSettings(); });
            });
            document.getElementById('wmTiled').addEventListener('change', () => {
