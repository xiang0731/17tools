<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script>
        (function applyThemeEarly() {
            try {
                var pref = localStorage.getItem('17tools-theme');
                if (pref == null) {
                    pref = localStorage.getItem('theme');
                    if (pref != null) {
                        localStorage.setItem('17tools-theme', pref);
                    }
                }
                var theme = (pref === 'light' || pref === 'dark')
                    ? pref
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* 存储不可用时由 theme.js 降级 */ }
        })();
    </script>

    <title>优惠计算器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/theme.css">
    <link href="../vendor/fontawesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100%;
            background-color: var(--background-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: var(--spacing-lg);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin: 0 0 var(--spacing-md) 0;
            font-size: 24px;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* 功能按钮区域 - 参照 Transformer.html */
        .function-buttons {
            display: flex;
            justify-content: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            flex-shrink: 0;
        }

        .function-button {
            padding: var(--spacing-sm) var(--spacing-lg);
            background-color: var(--background-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .function-button:hover {
            background-color: var(--background-hover);
            transform: translateY(-2px);
        }

        .function-button.active {
            background-color: var(--primary-color);
            color: var(--text-inverse);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }

        .main-layout {
            display: flex;
            flex: 1;
            gap: var(--spacing-lg);
            min-height: 0;
            /* 重要：允许子元素在 flex 容器中缩小 */
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .panel-header {
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--background-tertiary);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--text-secondary);
        }

        .panel-header-title {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            min-width: 0;
        }

        .header-clear-btn {
            min-height: 44px;
            min-width: 44px;
            flex-shrink: 0;
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--background-primary);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
            white-space: nowrap;
        }

        .header-clear-btn:hover {
            background: var(--background-hover);
            color: var(--text-error);
            border-color: var(--error-color);
        }

        .header-clear-btn:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        .header-clear-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            color: var(--text-tertiary);
        }

        .header-clear-btn:disabled:hover {
            background: var(--background-primary);
            color: var(--text-tertiary);
            border-color: var(--border-color);
        }

        .panel-content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        textarea {
            flex: 1;
            min-height: 120px;
            width: 100%;
            padding: var(--spacing-lg);
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 16px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .output-area {
            flex: 1;
            padding: var(--spacing-lg);
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 16px;
            line-height: 1.6;
        }

        .output-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-md);
            margin-bottom: 2px;
            border-left: 4px solid transparent;
        }

        .output-line.winner {
            background: color-mix(in srgb, var(--accent-color) 12%, transparent);
            border-left-color: var(--accent-color);
        }

        .output-line.winner .unit-price {
            color: var(--accent-color);
            font-weight: 700;
        }

        .output-line.discount-summary,
        .output-line.comparison-summary {
            margin-bottom: var(--spacing-md);
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: var(--spacing-sm);
            min-height: 40px;
        }

        .output-line.comparison-summary {
            color: var(--text-secondary);
        }

        .output-line.invalid {
            border-left-color: var(--warning-color);
        }

        .output-line.invalid .unit-price {
            color: var(--text-warning);
            font-weight: 600;
        }

        .rank-badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            background: var(--background-tertiary);
            color: var(--text-tertiary);
            margin-left: var(--spacing-sm);
        }

        .winner .rank-badge {
            background: var(--accent-color);
            color: var(--text-inverse);
        }

        .unit-price {
            color: var(--primary-color);
            font-weight: 600;
        }

        .original-data {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .output-warning {
            color: var(--text-warning);
            font-size: 11px;
            margin-left: var(--spacing-sm);
            font-weight: normal;
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            line-height: 1.2;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-tertiary);
            text-align: center;
            gap: var(--spacing-md);
        }

        .empty-state i {
            font-size: 48px;
        }

        .hint {
            position: static;
            flex-shrink: 0;
            margin: var(--spacing-xs) var(--spacing-md);
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-tertiary);
        }

        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
                overflow-y: auto;
            }

            .panel {
                min-height: 300px;
                flex: none;
            }

            #outputArea { max-height: 480px; }

            html,
            body {
                overflow: auto;
                height: auto;
            }

            .app-container {
                height: auto;
            }
        }
        .result-pager { flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--spacing-sm); padding: var(--spacing-md); border-top: 1px solid var(--border-color); }
        .result-pager[hidden] { display: none; }
        #pageStatus { color: var(--text-secondary); font-size: 13px; }
        #calculateBtn { align-self: flex-end; margin: var(--spacing-xs) var(--spacing-md); border: 1px solid var(--border-color); }
    </style>
</head>

<body>
    <div class="app-container">
        <h1><i class="fas fa-balance-scale"></i> 优惠计算器</h1>

        <div class="function-buttons">
            <button type="button" class="function-button active" onclick="switchMode('A', this)">
                <i class="fas fa-balance-scale"></i> A-自由比价
            </button>
            <button type="button" class="function-button" onclick="switchMode('B', this)">
                <i class="fas fa-calculator"></i> B-优惠计算
            </button>
        </div>

        <div class="main-layout">
            <!-- 输入面板 -->
            <div class="panel">
                <div id="inputHeader" class="panel-header">
                    <span class="panel-header-title">
                        <i class="fas fa-edit"></i>
                        <span id="inputHeaderLabel">输入列表</span>
                    </span>
                    <button type="button" id="clearInputBtn" class="header-clear-btn" title="清空输入列表" onclick="clearInput()">清空</button>
                </div>
                <div class="panel-content">
                    <textarea id="inputArea" placeholder="用于比较单价，每行输入总价+空格+数量，自动计算最优方案
例如:
100 10
200 25
45.5 3" oninput="scheduleComparison()"></textarea>
                    <div id="inputHint" class="hint">每行一个产品</div>
                    <p class="hint">最多 200000 字符、10001 物理行、10000 结果行。200 行且 12000 字符以内自动计算，更大输入请点击计算；结果每页 50 行，复制包含全部结果。</p>
                    <button type="button" id="calculateBtn" class="header-clear-btn" onclick="processComparison()" disabled>计算</button>
                    <p id="calculationStatus" class="hint" role="status" aria-live="polite"></p>
                </div>
            </div>

            <!-- 输出面板 -->
            <div class="panel">
                <div id="outputHeader" class="panel-header">
                    <span class="panel-header-title">
                        <i id="outputHeaderIcon" class="fas fa-chart-line"></i>
                        <span id="outputHeaderLabel">比价分析结果</span>
                    </span>
                    <button type="button" id="copyResultBtn" class="header-clear-btn" title="复制结果为纯文本" onclick="copyResult()" disabled>复制</button>
                </div>
                <div class="panel-content" id="outputArea">
                    <div class="empty-state">
                        <i class="fas fa-keyboard"></i>
                        <p>在左侧输入数据后<br>在此查看实时分析</p>
                    </div>
                </div>
                <nav id="resultPager" class="result-pager" aria-label="结果分页" hidden>
                    <button type="button" id="pageFirst" class="header-clear-btn" onclick="changePage(0)">首页</button>
                    <button type="button" id="pagePrev" class="header-clear-btn" onclick="changePage(currentPage - 1)">上一页</button>
                    <span id="pageStatus" role="status" aria-live="polite"></span>
                    <button type="button" id="pageNext" class="header-clear-btn" onclick="changePage(currentPage + 1)">下一页</button>
                    <button type="button" id="pageLast" class="header-clear-btn" onclick="changePage(Infinity)">末页</button>
                </nav>
            </div>
        </div>
    </div>

    <script src="../js/deal-hunter-core.js"></script>
    <script>
        let currentMode = 'A';
        let lastResult = null;
        let currentPage = 0;
        let calculationSequence = 0;
        let calculationTimer = null;
        const AUTO_DELAY_MS = 180;
        const DEFAULT_EMPTY_MESSAGE = '在左侧输入数据后\n在此查看实时分析';

        function getCore() {
            return window.DealHunterCore;
        }

        function switchMode(mode, btn) {
            currentMode = mode;

            document.querySelectorAll('.function-button').forEach(function (button) {
                button.classList.remove('active');
            });
            btn.classList.add('active');

            const inputHeaderLabel = document.getElementById('inputHeaderLabel');
            const outputHeaderIcon = document.getElementById('outputHeaderIcon');
            const outputHeaderLabel = document.getElementById('outputHeaderLabel');
            const inputArea = document.getElementById('inputArea');
            const inputHint = document.getElementById('inputHint');

            if (mode === 'A') {
                inputHeaderLabel.textContent = '输入列表';
                outputHeaderIcon.className = 'fas fa-chart-line';
                outputHeaderLabel.textContent = '比价分析结果';
                inputArea.placeholder = "用于比较单价，每行输入总价+空格+数量，自动计算最优方案\n例如:\n100 10\n200 25\n45.5 3";
                inputHint.textContent = '每行一个产品';
            } else {
                inputHeaderLabel.textContent = '折扣计算 (首行: 总原价 实付价；后续每行: 单件原价)';
                outputHeaderIcon.className = 'fas fa-calculator';
                outputHeaderLabel.textContent = '折扣分摊结果';
                inputArea.placeholder = "例如 (首行先输入原价格总和，然后输入实付价格，然后空行输入每件商品原价格，就可以计算出每件商品的实付价格):\n500 400\n100\n200\n50";
                inputHint.textContent = '首行两列，商品行一列；金额最多两位小数，最大余数法按原行顺序补分。部分清单只分摊已列商品。不支持加价、退款或清单超额。';
            }

            scheduleComparison();
            inputArea.focus();
        }

        function clearInput() {
            const inputArea = document.getElementById('inputArea');
            inputArea.value = '';
            scheduleComparison();
            inputArea.focus();
        }

        function setCopyEnabled(enabled) {
            const copyBtn = document.getElementById('copyResultBtn');
            copyBtn.disabled = !enabled;
            if (!enabled && copyBtn.textContent !== '复制') {
                copyBtn.textContent = '复制';
            }
        }

        function invalidateResult() {
            calculationSequence += 1;
            window.clearTimeout(calculationTimer);
            lastResult = null;
            currentPage = 0;
            setCopyEnabled(false);
            document.getElementById('resultPager').hidden = true;
        }

        function prepareCalculation() {
            invalidateResult();
            const input = document.getElementById('inputArea').value;
            const check = getCore().inspectInput(input, currentMode);
            const button = document.getElementById('calculateBtn');
            button.disabled = !check.ok || check.empty;
            const status = document.getElementById('calculationStatus');
            if (!check.ok) {
                status.textContent = check.error;
                renderEmpty(check.error);
                return null;
            }
            if (check.empty) {
                status.textContent = '';
                renderDefaultEmpty();
                return null;
            }
            return { input: input, mode: currentMode, sequence: calculationSequence, check: check };
        }

        function scheduleComparison() {
            const task = prepareCalculation();
            if (!task) return;
            if (task.check.requiresManual) {
                document.getElementById('calculationStatus').textContent = '输入已更改：较大输入请点击计算。';
                renderEmpty('输入已更改，请点击计算；原结果已失效。');
                return;
            }
            document.getElementById('calculationStatus').textContent = '输入已更改，等待自动计算…';
            renderEmpty('输入已更改，等待重新计算；原结果已失效。');
            calculationTimer = window.setTimeout(function () { calculateSnapshot(task); }, AUTO_DELAY_MS);
        }

        function processComparison() {
            const task = prepareCalculation();
            if (!task) return;
            document.getElementById('calculationStatus').textContent = '正在计算…';
            renderEmpty('正在计算，原结果已失效。');
            calculationTimer = window.setTimeout(function () { calculateSnapshot(task); }, 0);
        }

        function calculateSnapshot(task) {
            if (task.sequence !== calculationSequence || task.mode !== currentMode || task.input !== document.getElementById('inputArea').value) return;
            const core = getCore();
            const result = task.mode === 'A' ? core.compareUnitPrices(task.input) : core.allocateDiscount(task.input);
            lastResult = result;
            document.getElementById('calculationStatus').textContent = result.error || result.summary || '';
            if (result.empty) {
                renderDefaultEmpty();
                setCopyEnabled(false);
                return;
            }
            if (result.error && (currentMode === 'A' ? result.products.length === 0 : result.items.length === 0)) {
                renderEmpty(result.error);
                setCopyEnabled(false);
                return;
            }
            renderCurrentPage();
            setCopyEnabled(result.copyable);
        }

        function resultRows() {
            return lastResult ? (lastResult.mode === 'A' ? lastResult.products : lastResult.items) : [];
        }

        function changePage(page) {
            if (!lastResult) return;
            const pageCount = Math.max(1, Math.ceil(resultRows().length / getCore().BUDGET.pageSize));
            currentPage = Math.max(0, Math.min(page, pageCount - 1));
            renderCurrentPage();
        }

        function renderCurrentPage() {
            const result = lastResult;
            if (!result) return;
            if (result.mode === 'A') renderModeA(result);
            else renderModeB(result);
            const count = resultRows().length;
            const pageSize = getCore().BUDGET.pageSize;
            const pages = Math.max(1, Math.ceil(count / pageSize));
            document.getElementById('resultPager').hidden = count <= pageSize;
            document.getElementById('pageStatus').textContent = '第 ' + (currentPage + 1) + '/' + pages + ' 页 · ' + (count ? currentPage * pageSize + 1 : 0) + '–' + Math.min((currentPage + 1) * pageSize, count) + ' / ' + count + ' 行';
            document.getElementById('pageFirst').disabled = document.getElementById('pagePrev').disabled = currentPage === 0;
            document.getElementById('pageLast').disabled = document.getElementById('pageNext').disabled = currentPage >= pages - 1;
        }

        function createOutputLine(isWinner, isInvalid) {
            const line = document.createElement('div');
            line.className = 'output-line';
            if (isWinner) {
                line.classList.add('winner');
            }
            if (isInvalid) {
                line.classList.add('invalid');
            }
            return line;
        }

        function renderModeA(result) {
            const outputArea = document.getElementById('outputArea');
            const wrap = document.createElement('div');
            wrap.className = 'output-area';

            const summaryLine = createOutputLine(false, false);
            summaryLine.classList.add('comparison-summary');
            const summaryText = document.createElement('div');
            summaryText.className = 'original-data';
            summaryText.textContent = result.summary;
            summaryLine.appendChild(summaryText);
            wrap.appendChild(summaryLine);

            result.products.slice(currentPage * getCore().BUDGET.pageSize, (currentPage + 1) * getCore().BUDGET.pageSize).forEach(function (product) {
                const line = createOutputLine(product.isWinner, !product.valid);
                const original = document.createElement('div');
                original.className = 'original-data';

                const lineLabel = document.createElement('span');
                lineLabel.textContent = '第 ' + product.lineNumber + ' 行';

                const rawText = document.createElement('span');
                rawText.textContent = product.raw;

                const badge = document.createElement('span');
                badge.className = 'rank-badge';
                badge.textContent = product.valid ? product.rankLabel : '无法比价';

                original.append(lineLabel, document.createTextNode(' '), rawText, badge);

                const detail = document.createElement('div');
                detail.className = 'unit-price';
                detail.textContent = product.valid
                    ? ('单价: ' + product.unitPrice.toFixed(2))
                    : (product.error || '无法比价');

                line.append(original, detail);
                wrap.appendChild(line);
            });

            outputArea.replaceChildren(wrap);
        }

        function renderModeB(result) {
            const outputArea = document.getElementById('outputArea');
            const wrap = document.createElement('div');
            wrap.className = 'output-area';

            const summary = createOutputLine(true, false);
            summary.classList.add('discount-summary');

            const original = document.createElement('div');
            original.className = 'original-data';
            original.appendChild(document.createTextNode(result.error || result.summary));

            if (result.warnings.length > 0) {
                const warningBox = document.createElement('span');
                warningBox.className = 'output-warning';
                result.warnings.forEach(function (warning) {
                    const row = document.createElement('span');
                    const icon = document.createElement('i');
                    icon.className = warning.indexOf('实付') !== -1
                        ? 'fas fa-exclamation-circle'
                        : 'fas fa-exclamation-triangle';
                    row.append(icon, document.createTextNode(' ' + warning));
                    warningBox.appendChild(row);
                });
                original.appendChild(warningBox);
            }

            const unitPrice = document.createElement('div');
            unitPrice.className = 'unit-price';
            unitPrice.textContent = result.error ? '无法分摊' : result.discountPercent + ' (' + result.discountZhe + ' 折)';
            summary.append(original, unitPrice);
            wrap.appendChild(summary);

            result.items.slice(currentPage * getCore().BUDGET.pageSize, (currentPage + 1) * getCore().BUDGET.pageSize).forEach(function (item) {
                const line = createOutputLine(false, !item.valid);
                const left = document.createElement('div');
                left.className = 'original-data';
                left.textContent = '第 ' + item.lineNumber + ' 行 · ' + item.raw;

                const right = document.createElement('div');
                right.className = 'unit-price';
                right.textContent = item.valid && item.paid != null
                    ? ('实付: ' + getCore().formatMoney(item.paid))
                    : (item.error || result.error || '无法分摊');

                line.append(left, right);
                wrap.appendChild(line);
            });

            outputArea.replaceChildren(wrap);
        }

        function renderDefaultEmpty() {
            const outputArea = document.getElementById('outputArea');
            const wrap = document.createElement('div');
            wrap.className = 'empty-state';
            const icon = document.createElement('i');
            icon.className = 'fas fa-keyboard';
            const p = document.createElement('p');
            const lines = DEFAULT_EMPTY_MESSAGE.split('\n');
            p.appendChild(document.createTextNode(lines[0]));
            p.appendChild(document.createElement('br'));
            p.appendChild(document.createTextNode(lines[1]));
            wrap.append(icon, p);
            outputArea.replaceChildren(wrap);
        }

        function renderEmpty(msg) {
            const outputArea = document.getElementById('outputArea');
            outputArea.replaceChildren();
            const wrap = document.createElement('div');
            wrap.className = 'empty-state';
            const p = document.createElement('p');
            p.textContent = msg;
            wrap.appendChild(p);
            outputArea.appendChild(wrap);
        }

        function copyTextToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text).catch(function () {
                    return copyTextFallback(text);
                });
            }
            return copyTextFallback(text);
        }

        function copyTextFallback(text) {
            return new Promise(function (resolve, reject) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.setAttribute('readonly', '');
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    const ok = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    if (ok) {
                        resolve();
                    } else {
                        reject(new Error('copy failed'));
                    }
                } catch (error) {
                    document.body.removeChild(textarea);
                    reject(error);
                }
            });
        }

        function copyResult() {
            const core = getCore();
            const text = core.formatCopyText(lastResult);
            const btn = document.getElementById('copyResultBtn');
            if (!text) {
                return;
            }
            const sequence = calculationSequence;
            copyTextToClipboard(text).then(function () {
                if (sequence !== calculationSequence) return;
                btn.textContent = '已复制';
                window.setTimeout(function () {
                    btn.textContent = '复制';
                }, 1500);
            }).catch(function () {
                if (sequence !== calculationSequence) return;
                btn.textContent = '复制失败';
                window.setTimeout(function () {
                    btn.textContent = '复制';
