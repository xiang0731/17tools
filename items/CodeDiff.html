<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script>
        (function applyThemeEarly() {
            try {
                var pref = localStorage.getItem('17tools-theme');
                if (pref == null) {
                    pref = localStorage.getItem('theme');
                    if (pref != null) {
                        localStorage.setItem('17tools-theme', pref);
                    }
                }
                var theme = (pref === 'light' || pref === 'dark')
                    ? pref
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* 存储不可用时由 theme.js 降级 */ }
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码对比工具</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link href="../vendor/fontawesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            padding: var(--spacing-lg);
            background-color: var(--background-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            margin: 0;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin: 0 0 var(--spacing-xl) 0;
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
        }

        @media (max-width: 1024px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
        }

        .code-area {
            display: flex;
            flex-direction: column;
            background: var(--background-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-fast);
        }

        .code-area:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-color);
        }

        .code-header {
            background: var(--background-tertiary);
            color: var(--text-primary);
            padding: var(--spacing-md) var(--spacing-lg);
            font-weight: 600;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .code-header span {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .code-header i {
            color: var(--primary-color);
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: var(--spacing-md);
            border: none;
            font-family: var(--font-mono);
            font-size: 14px;
            resize: vertical;
            background: var(--background-primary);
            color: var(--text-primary);
            line-height: 1.5;
            outline: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
        }

        .btn {
            padding: var(--spacing-sm) var(--spacing-xl);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--background-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--background-hover);
        }

        .btn-secondary.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .diff-container {
            background: var(--background-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            min-height: 200px;
        }

        .empty-diff {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
            color: var(--text-secondary);
            text-align: center;
        }

        .empty-diff i {
            font-size: 48px;
            margin-bottom: var(--spacing-md);
            opacity: 0.5;
        }

        /* Diff2Html Theme Overrides */
        .d2h-wrapper {
            background-color: transparent;
        }
        
        [data-theme="dark"] .d2h-file-list-wrapper,
        [data-theme="dark"] .d2h-file-header,
        [data-theme="dark"] .d2h-file-wrapper,
        [data-theme="dark"] .d2h-code-line,
        [data-theme="dark"] .d2h-code-side-line {
            background-color: var(--background-primary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        [data-theme="dark"] .d2h-code-line-ctn {
            color: var(--text-primary);
        }

        [data-theme="dark"] .d2h-del {
            background-color: rgba(239, 68, 68, 0.2);
        }

        [data-theme="dark"] .d2h-ins {
            background-color: rgba(16, 185, 129, 0.2);
        }

        [data-theme="dark"] .d2h-info {
            background-color: var(--background-tertiary);
            color: var(--text-secondary);
            border-color: var(--border-color);
        }

        .status-message {
            position: fixed;
            top: var(--spacing-lg);
            right: var(--spacing-lg);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-weight: 500;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            box-shadow: var(--shadow-lg);
        }

        .status-message.show {
            transform: translateX(0);
        }

        .status-success { background: var(--success-color); color: white; }
        .status-error { background: var(--background-primary); color: var(--text-error); border: 1px solid var(--border-color); }
        .status-info { background: var(--primary-color); color: white; }

        .result-status {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin: 0 0 var(--spacing-sm) 0;
        }

        .result-status.is-stale {
            color: var(--text-warning);
        }

        .result-status.is-failed {
            color: var(--text-error);
        }

        .header-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        .header-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .header-btn:hover {
            color: var(--primary-color);
            background: var(--background-secondary);
        }

        .task-budget { color: var(--text-secondary); font-size: 13px; line-height: 1.6; }
        @media (max-width: 768px) {
            .header-btn, .btn { min-height: 44px; min-width: 44px; }
            .controls { gap: var(--spacing-sm); }
            .btn { padding-inline: var(--spacing-md); }
            .code-header { flex-wrap: wrap; gap: var(--spacing-sm); padding: var(--spacing-md); }
        }
    </style>
</head>

<body>
    <h1>
        <i class="fas fa-code-compare" aria-hidden="true"></i>
        代码对比工具
    </h1>

    <div class="container">
        <div class="editor-container">
            <div class="code-area">
                <div class="code-header">
                    <span><i class="fas fa-file-code" aria-hidden="true"></i> 原代码 (Old)</span>
                    <div class="header-actions">
                        <button class="header-btn" onclick="clearText('old')" title="清空原代码" aria-label="清空原代码"><i class="fas fa-trash-can" aria-hidden="true"></i></button>
                        <button class="header-btn" onclick="pasteText('old')" title="粘贴原代码" aria-label="粘贴原代码"><i class="fas fa-paste" aria-hidden="true"></i></button>
                    </div>
                </div>
                <textarea aria-label="原代码" id="old-code" placeholder="在此粘贴原始代码..."></textarea>
            </div>
            <div class="code-area">
                <div class="code-header">
                    <span><i class="fas fa-file-medical" aria-hidden="true"></i> 新代码 (New)</span>
                    <div class="header-actions">
                        <button class="header-btn" onclick="clearText('new')" title="清空新代码" aria-label="清空新代码"><i class="fas fa-trash-can" aria-hidden="true"></i></button>
                        <button class="header-btn" onclick="pasteText('new')" title="粘贴新代码" aria-label="粘贴新代码"><i class="fas fa-paste" aria-hidden="true"></i></button>
                    </div>
                </div>
                <textarea aria-label="新代码" id="new-code" placeholder="在此粘贴新版本代码..."></textarea>
            </div>
        </div>

        <div class="controls">
            <button id="compare-btn" class="btn btn-primary" onclick="toggleCompare()">
                <i class="fas fa-sync" aria-hidden="true"></i> 开始对比
            </button>
            <div class="btn-group" style="display: flex; gap: 1px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-color);">
                <button aria-pressed="true" id="side-by-side-btn" class="btn btn-secondary active" onclick="setDiffStyle('side-by-side')" style="border: none; border-radius: 0;">
                    左右对比
                </button>
                <button aria-pressed="false" id="line-by-line-btn" class="btn btn-secondary" onclick="setDiffStyle('line-by-line')" style="border: none; border-radius: 0;">
                    逐行对比
                </button>
            </div>
            <button class="btn btn-secondary" id="copy-patch-btn" onclick="copyPatch()">
                <i class="fas fa-copy" aria-hidden="true"></i> 复制补丁
            </button>
            <button class="btn btn-secondary" onclick="clearAll()">
                <i class="fas fa-eraser" aria-hidden="true"></i> 全部清空
            </button>
        </div>

        <p class="task-budget">自动处理合计 100KB 以内；手动对比最多合计 2MB 字符、20,000 行，后台计算限时 15 秒。</p>
        <div id="diff-result-status" class="result-status" hidden></div>
        <div id="compute-hint" role="status" aria-live="polite" class="result-status" hidden></div>
        <div class="diff-container" id="diff-output">
            <div class="empty-diff">
                <i class="fas fa-code-compare" aria-hidden="true"></i>
                <h3>等待对比</h3>
                <p>在上方输入两段代码，点击“开始对比”按钮查看差异</p>
            </div>
        </div>
    </div>

    <div id="status-message" role="status" aria-live="polite" class="status-message"></div>

    <script src="../js/editor-runtime-core.js"></script>
    <script src="../js/editor-task-core.js"></script>
    <script src="../js/clipboard.js"></script>
    <script src="../js/lazy-script-core.js"></script>
    <script src="../js/code-diff-core.js"></script>
    <script src="../js/unsaved-guard.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/code-diff-page.js"></script>
</body>

</html>
