<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script>
        (function applyThemeEarly() {
            try {
                var pref = localStorage.getItem('17tools-theme');
                if (pref == null) {
                    pref = localStorage.getItem('theme');
                    if (pref != null) {
                        localStorage.setItem('17tools-theme', pref);
                    }
                }
                var theme = (pref === 'light' || pref === 'dark')
                    ? pref
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* 存储不可用时由 theme.js 降级 */ }
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码格式化工具</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link href="../vendor/fontawesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100%;
            background-color: var(--background-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            overflow-x: auto;
            overflow-y: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: var(--spacing-lg);
            box-sizing: border-box;
            min-width: 0;
            min-height: 0;
        }

        /* 标题样式 */
        h1 {
            text-align: center;
            color: var(--text-primary);
            margin: 0 0 var(--spacing-md) 0;
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            flex-shrink: 0;
        }

        .main-layout {
            display: flex;
            flex: 1;
            gap: var(--spacing-lg);
            min-height: 0;
        }

        .code-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-fast);
        }

        .code-area:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-color);
        }

        .code-header {
            background: var(--background-tertiary);
            color: var(--text-primary);
            padding: var(--spacing-md) var(--spacing-lg);
            font-weight: 600;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .code-header i {
            color: var(--primary-color);
        }

        .language-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--background-secondary);
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            gap: var(--spacing-md);
            flex-wrap: wrap;
            row-gap: var(--spacing-sm);
        }

        .language-controls {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            flex: 1 1 auto;
            min-width: 0;
            flex-wrap: wrap;
            row-gap: var(--spacing-sm);
        }

        .language-label {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 14px;
            white-space: nowrap;
        }

        /* 代码编辑器容器 */
        .editor-wrapper {
            display: flex;
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }

        /* 行号容器 */
        .line-numbers {
            width: 60px;
            flex-shrink: 0;
            background: var(--background-tertiary);
            border-right: 1px solid var(--border-color);
            padding: var(--spacing-md) 0;
            text-align: right;
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 22.4px;
            color: var(--text-tertiary);
            overflow-y: auto;
            overflow-x: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .line-numbers::-webkit-scrollbar {
            display: none;
        }

        .line-numbers span {
            padding: 0 var(--spacing-sm);
            flex-shrink: 0;
            display: block;
            box-sizing: border-box;
        }

        textarea {
            flex: 1;
            margin: 0;
            padding: var(--spacing-md);
            border: none;
            font-family: var(--font-mono);
            font-size: 14px;
            resize: none;
            overflow: auto;
            background: var(--background-primary);
            color: var(--text-primary);
            line-height: 22.4px;
            outline: none;
            transition: background-color var(--transition-fast);
        }

        textarea::placeholder {
            color: var(--text-tertiary);
            font-style: italic;
        }

        /* 代码输出区域 */
        .code-output {
            flex: 1;
            min-width: 0;
            overflow: auto;
            background: var(--background-primary);
        }

        .output-code {
            margin: 0;
            padding: var(--spacing-md);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 22.4px;
            background: var(--background-primary);
            color: var(--text-primary);
            white-space: pre;
            overflow: visible;
        }

        .output-code code {
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 22.4px;
        }

        /* 按钮样式 */
        .action-buttons {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }

        .action-button {
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            min-width: 80px;
            justify-content: center;
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .action-button:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--text-inverse);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-success {
            background: var(--success-color);
            color: var(--text-inverse);
        }

        .btn-success:hover {
            background: var(--accent-hover);
        }

        .btn-info {
            background: var(--primary-color);
            color: var(--text-inverse);
        }

        .btn-info:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: var(--error-color);
            color: var(--text-inverse);
        }

        .btn-danger:hover {
            background: var(--error-color);
        }

        .btn-secondary {
            background: var(--background-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--background-hover);
            border-color: var(--primary-color);
        }

        /* 选择器样式 */
        select {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--background-primary);
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font-family);
            cursor: pointer;
            transition: all var(--transition-fast);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right var(--spacing-sm) center;
            background-size: 16px;
            padding-right: var(--spacing-xl);
            min-width: 0;
            max-width: 100%;
            flex: 1 1 12rem;
        }

        select:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        select:hover {
            border-color: var(--primary-color);
        }

        /* 语言检测指示器 */
        .language-indicator {
            background: var(--primary-light);
            color: var(--primary-color);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: var(--spacing-xs);
            border: 1px solid var(--primary-color);
        }

        .language-indicator.show {
            display: flex;
        }

        .language-indicator i {
            color: var(--primary-color);
        }

        .result-status {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .result-status.is-stale {
            color: var(--text-warning);
        }

        .result-status.is-failed {
            color: var(--text-error);
        }

        /* 状态提示 */
        .status-message {
            position: fixed;
            top: var(--spacing-lg);
            right: var(--spacing-lg);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-weight: 500;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            box-shadow: var(--shadow-lg);
        }

        .status-message.show {
            transform: translateX(0);
        }

        .status-success {
            background: var(--success-color);
            color: var(--text-inverse);
        }

        .status-error {
            background: var(--background-primary);
            color: var(--text-error);
            border: 1px solid var(--border-color);
        }

        .status-info {
            background: var(--primary-color);
            color: var(--text-inverse);
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        .processing {
            animation: pulse 1s infinite;
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-sizing: border-box;
            color: var(--text-tertiary);
            text-align: center;
            padding: var(--spacing-xl);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: var(--spacing-md);
            color: var(--text-tertiary);
        }

        .empty-state h3 {
            margin: 0 0 var(--spacing-sm) 0;
            color: var(--text-secondary);
        }

        .empty-state p {
            margin: 0;
            font-size: 14px;
        }

        /* 高亮样式覆盖 */
        .hljs {
            background: var(--background-primary) !important;
            color: var(--text-primary) !important;
            padding: 0 !important;
        }

        pre,
        code {
            background: var(--background-primary) !important;
            color: var(--text-primary) !important;
        }

        /* 响应式调整 - 中等屏幕 */
        @media (max-width: 900px) {
            .language-selector {
                flex-direction: column;
                align-items: stretch;
                gap: var(--spacing-sm);
            }

            .language-controls {
                min-width: 0;
                width: 100%;
                justify-content: flex-start;
            }

            .action-buttons {
                width: 100%;
                justify-content: flex-start;
            }
        }

        /* 响应式调整 - 小屏幕 */
        @media (max-width: 768px) {
            html,
            body {
                overflow: auto;
                height: auto;
            }

            .app-container {
                height: auto;
                padding: var(--spacing-sm);
            }

            h1 {
                font-size: 20px;
                margin-bottom: var(--spacing-sm);
            }

            .language-selector {
                padding: var(--spacing-sm);
            }

            .main-layout {
                flex-direction: column;
                overflow-y: auto;
            }

            .code-area {
                min-height: 300px;
                flex: none;
            }

            .language-controls {
                flex-direction: column;
                align-items: stretch;
                gap: var(--spacing-sm);
            }

            .action-buttons {
                justify-content: center;
            }

            .action-button {
                flex: 1;
                min-width: auto;
            }

            .line-numbers {
                width: 50px;
            }
        }

        /* 加载状态 */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .task-budget { color: var(--text-secondary); font-size: 13px; line-height: 1.6; padding-inline: var(--spacing-md); }
        @media (max-width: 768px) {
            .action-button { min-height: 44px; min-width: 44px; white-space: normal; }
            .panel-header, .action-buttons { flex-wrap: wrap; }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <h1>
            <i class="fas fa-code" aria-hidden="true"></i>
            代码格式化工具
        </h1>

        <div class="main-layout">
            <!-- 输入区域 -->
            <div class="code-area">
                <div class="code-header">
                    <i class="fas fa-edit" aria-hidden="true"></i>
                    代码输入
                </div>
                <div class="language-selector">
                    <div class="language-controls">
                        <label class="language-label" for="language">
                            <i class="fas fa-cog" aria-hidden="true"></i>
                            语言:
                        </label>
                        <select id="language">
                            <option value="auto" selected>自动检测</option>
                            <option value="generic">通用语言（文本 / 请求 Body）</option>
                            <option value="babel">JavaScript</option>
                            <option value="typescript">TypeScript</option>
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="json">JSON</option>
                            <option value="yaml">YAML</option>
                            <option value="markdown">Markdown</option>
                            <option value="graphql">GraphQL</option>
                            <option value="cpp-highlight">C/C++</option>
                            <option value="csharp-highlight">C#</option>
                            <option value="java-highlight">Java</option>
                            <option value="python-highlight">Python</option>
                            <option value="go-highlight">Go</option>
                            <option value="rust-highlight">Rust</option>
                            <option value="swift-highlight">Swift</option>
                            <option value="php-highlight">PHP</option>
                            <option value="ruby-highlight">Ruby</option>
                            <option value="shell-highlight">Shell/Bash</option>
                            <option value="sql-highlight">SQL</option>
                        </select>
                        <div id="detected-language" class="language-indicator">
                            <i class="fas fa-check-circle" aria-hidden="true"></i>
                            <span id="language-name">JavaScript</span>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button id="clear-btn" class="action-button btn-danger" title="清空内容">
                            <i class="fas fa-trash" aria-hidden="true"></i>
                            清空
                        </button>
                        <button id="copy-input-btn" class="action-button btn-secondary" title="复制内容">
                            <i class="fas fa-copy" aria-hidden="true"></i>
                            复制
                        </button>
                        <button id="download-input-btn" class="action-button btn-secondary" title="下载文件">
                            <i class="fas fa-download" aria-hidden="true"></i>
                            下载
                        </button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <div id="input-line-numbers" class="line-numbers" aria-hidden="true"><span>1</span></div>
                    <textarea aria-label="待格式化代码" id="input-code" placeholder="🚀 在此粘贴或输入您的代码...

💡 支持通用语言文本、请求 Body 和多种编程语言
📝 自动检测语言类型
✨ 智能格式化美化
🎯 语法高亮显示"></textarea>
                </div>
            </div>

            <!-- 输出区域 -->
            <div class="code-area">
                <div class="code-header">
                    <i class="fas fa-magic" aria-hidden="true"></i>
                    格式化结果
                </div>
                <div class="language-selector">
                    <div class="language-controls">
                        <button id="format-btn" class="action-button btn-primary">
                            <i class="fas fa-magic" aria-hidden="true"></i>
                            格式化代码
                        </button>
                        <div id="result-status" role="status" aria-live="polite" class="result-status" hidden></div>
                        <p class="task-budget">自动处理 100KB 以内；手动处理最多 2MB 字符，后台计算限时 15 秒。</p>
                    <div id="compute-hint" role="status" aria-live="polite" class="result-status" hidden></div>
                    </div>
                    <div class="action-buttons">
                        <button id="copy-btn" class="action-button btn-secondary" title="复制结果">
                            <i class="fas fa-copy" aria-hidden="true"></i>
                            复制
                        </button>
                        <button id="download-btn" class="action-button btn-secondary" title="下载结果">
                            <i class="fas fa-download" aria-hidden="true"></i>
                            下载
                        </button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <div id="output-line-numbers" class="line-numbers" aria-hidden="true"><span>1</span></div>
                    <div class="code-output">
                        <div class="empty-state" id="empty-state">
                            <i class="fas fa-code" aria-hidden="true"></i>
                            <h3>等待格式化</h3>
                            <p>输入代码后点击"格式化代码"按钮</p>
                        </div>
                        <pre id="output-code" class="output-code" style="display: none;"><code></code></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 状态消息容器 -->
    <div id="status-message" role="status" aria-live="polite" class="status-message"></div>

    <script src="../js/editor-runtime-core.js"></script>
    <script src="../js/editor-task-core.js"></script>
    <script src="../js/clipboard.js"></script>
    <script src="../js/lazy-script-core.js"></script>
    <script src="../js/pretty-format-core.js"></script>
    <script src="../js/unsaved-guard.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/pretty-format-page.js"></script>
</body>

</html>
