<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script>
        (function applyThemeEarly() {
            try {
                var pref = localStorage.getItem('17tools-theme');
                if (pref == null) {
                    pref = localStorage.getItem('theme');
                    if (pref != null) {
                        localStorage.setItem('17tools-theme', pref);
                    }
                }
                var theme = (pref === 'light' || pref === 'dark')
                    ? pref
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* 存储不可用时由 theme.js 降级 */ }
        })();
    </script>

    <title>极速计算</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/theme.css">
    <link href="../vendor/fontawesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 重置页面默认样式，确保页面占满整个视口 */
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* 改为最小高度，允许内容扩展 */
            width: 100%;
            /* 删除固定宽度，改用百分比 */
            /* overflow: hidden;
            防止出现滚动条 */
        }

        /* 主容器样式 */
        .calculator {
            width: 100%;
            min-height: 100vh;
            /* 改为最小高度 */
            padding: var(--spacing-lg);
            box-sizing: border-box;
            /* 边框盒模型，使padding包含在宽高中 */
            display: flex;
            /* 使用弹性布局 */
            flex-direction: column;
            /* 垂直排列 */
            font-family: var(--font-family);
            overflow-y: auto;
            /* 允许垂直滚动，修改自overflow: hidden */
            background-color: var(--background-primary);
            color: var(--text-primary);
        }

        /* 标题样式 */
        h1 {
            text-align: center;
            color: var(--text-primary);
            margin: 0 0 var(--spacing-lg) 0;
            padding: 0;
            font-size: 28px;
            font-weight: 700;
            flex-shrink: 0;
            /* 防止标题被压缩 */
        }

        /* 输入框样式 */
        .input-container {
            margin-bottom: var(--spacing-lg);
        }

        .input-label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            font-family: var(--font-mono);
            background-color: var(--background-primary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        textarea::placeholder {
            color: var(--text-tertiary);
        }

        /* 文本框包装器 - 用于定位行数标签 */
        .textarea-wrapper {
            position: relative;
            width: 100%;
        }

        /* 行数标签样式 */
        .line-count {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background-color: var(--background-tertiary);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font-mono);
            pointer-events: none;
            opacity: 0.85;
            border: 1px solid var(--border-color);
            z-index: 1;
        }

        /* 结果显示区域样式 */
        .result-container {
            flex-shrink: 0;
            padding: var(--spacing-lg);
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
        }

        .result-label {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
        }

        .result-content-wrapper {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: var(--spacing-xs) var(--spacing-sm);
            flex: 1 1 auto;
        }

        .result-headline {
            display: inline-flex;
            align-items: baseline;
            gap: 0.35em;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .icon-button {
            min-height: 44px;
            min-width: 44px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            font-size: 18px;
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-button:hover {
            color: var(--primary-color);
            background-color: var(--background-hover);
        }

        .icon-button:disabled,
        .icon-button:disabled:hover {
            cursor: not-allowed;
            opacity: 0.45;
            color: var(--text-tertiary);
            background-color: transparent;
        }

        #linePagination { flex-wrap:wrap;margin:var(--spacing-sm) 0; }
        #linePagination button { min-width:80px;min-height:44px;padding:var(--spacing-sm); }
        #linePageStatus { flex:1 1 100%;text-align:left; }
        #linePagination[hidden] { display: none; }

        .copy-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: var(--spacing-sm);
            flex: 1 1 12em;
        }

        .copy-hint,
        .result-meta,
        .calc-examples {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 14px;
            line-height: 1.5;
        }

        .copy-hint {
            text-align: right;
        }

        .calc-examples {
            margin: 0 0 var(--spacing-sm) 0;
            font-family: var(--font-mono);
        }

        .result-value {
            color: var(--primary-color);
            font-family: var(--font-mono);
            font-size: 24px;
            font-weight: 700;
        }

        .warning-text {
            color: var(--warning-color);
            font-size: 14px;
            margin-left: var(--spacing-sm);
            font-weight: 500;
        }

        /* 按钮样式 */
        .button-group {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .save-button {
            flex: 1;
            min-width: 120px;
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--primary-color);
            color: var(--text-inverse);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .save-button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .clear-button {
            flex: 1;
            min-width: 120px;
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--background-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .clear-input-btn {
            background-color: var(--text-secondary);
            color: var(--text-inverse);
            border: none;
        }

        .clear-input-btn:hover {
            background-color: var(--text-primary);
        }

        .clear-history-btn {
            background-color: var(--error-color);
            color: var(--text-inverse);
            border: none;
        }

        .clear-history-btn:hover {
            background-color: var(--error-color);
            filter: brightness(0.92);
        }

        .line-results {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-md);
            font-family: var(--font-mono);
            font-size: 14px;
            max-height: 180px;
            overflow-y: auto;
        }

        .line-results:empty {
            display: none;
            margin-bottom: 0;
        }

        .line-result {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: var(--spacing-xs);
            word-break: break-all;
        }

        .line-expr {
            color: var(--text-primary);
        }

        .line-arrow {
            color: var(--text-tertiary);
        }

        .line-value {
            color: var(--primary-color);
            font-weight: 600;
        }

        .line-error {
            color: var(--error-color);
            font-weight: 500;
        }

        .clear-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        /* 历史记录容器样式 */
        .history-container {
            flex: 1;
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            min-height: 300px;
            /* 增加最小高度 */
            display: flex;
            flex-direction: column;
        }

        .history-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            background: var(--background-tertiary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .history-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .history-count {
            background: var(--primary-light);
            color: var(--primary-color);
            padding: 2px var(--spacing-sm);
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 500;
        }

        .history-lifetime {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: 2px var(--spacing-sm);
            line-height: 1.4;
        }

        .history-content {
            padding: var(--spacing-md);
            overflow-y: auto;
            flex: 1;
            /* 让内容区域填充剩余空间 */
        }

        .history-empty {
            text-align: center;
            color: var(--text-tertiary);
            padding: var(--spacing-xl);
            font-style: italic;
        }

        /* 历史记录项样式 */
        .history-item {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--border-light);
            transition: all var(--transition-fast);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-sm);
            background: var(--background-primary);
        }

        .history-item:hover {
            background: var(--background-hover);
            transform: translateX(4px);
        }

        .history-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .history-time {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: var(--spacing-xs);
        }

        .history-expression {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
            word-break: break-all;
        }

        .history-result {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            font-family: var(--font-mono);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .calculator {
                padding: var(--spacing-md);
            }

            h1 {
                font-size: 24px;
            }

            textarea {
                height: 200px;
            }

            .button-group {
                flex-direction: column;
            }

            .result-label {
                font-size: 16px;
            }

            .result-value {
                font-size: 20px;
            }

            .copy-actions {
                flex: 1 1 100%;
                justify-content: flex-start;
            }

            .copy-hint {
                text-align: left;
            }
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .history-item {
            animation: fadeIn 0.3s ease;
        }

        /* 加载状态 */
        .calculating {
            color: var(--warning-color);
        }

        .calculating::after {
            content: "...";
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                color: transparent;
                text-shadow: .25em 0 0 transparent, .5em 0 0 transparent;
            }

            40% {
                color: var(--warning-color);
                text-shadow: .25em 0 0 transparent, .5em 0 0 transparent;
            }

            60% {
                text-shadow: .25em 0 0 var(--warning-color), .5em 0 0 transparent;
            }

            80%,
            100% {
                text-shadow: .25em 0 0 var(--warning-color), .5em 0 0 var(--warning-color);
            }
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h1><i class="fas fa-calculator"></i> 极速计算</h1>

        <div class="input-container">
            <label class="input-label" for="numbers">
                <i class="fas fa-edit"></i> 输入算术表达式
            </label>
            <p class="calc-examples" id="powerExamples">负号弱于幂：-2**2 = -4；括号里仍先算：(-2)**2 = 4；2**-2 = 0.25；2**3**2 = 512。</p>
            <div class="textarea-wrapper">
                <textarea id="numbers" placeholder="输入算术表达式，一行一道题，例如:
1 + 2
3 x 4
(10-2)/4
支持 +、-、* (或x)、/、()、幂运算(**)" oninput="handleInput()"></textarea>
                <span class="line-count" id="inputLineCount">0 行</span>
            </div>
        </div>

        <div class="result-container">
            <div class="line-results" id="lineResults"></div>
            <div id="linePagination" class="copy-actions" hidden>
                <button type="button" class="clear-button" id="linePrev">上一页</button>
                <span id="linePageStatus" class="copy-hint"></span>
                <button type="button" class="clear-button" id="lineNext">下一页</button>
            </div>
            <div class="result-label">
                <div class="result-content-wrapper">
                    <span class="result-headline">
                        <i class="fas fa-equals" aria-hidden="true"></i>
                        <span id="resultLabel">总和</span>:
                        <span class="result-value" id="result">0</span>
                    </span>
                    <span id="resultMeta" class="result-meta"></span>
                    <span id="warning" class="warning-text" hidden></span>
                </div>
                <div class="copy-actions">
                    <span id="copyHint" class="copy-hint"></span>
                    <button class="icon-button" id="copyResultBtn" type="button" onclick="copyResult()" title="复制结果" aria-label="复制结果">
                        <i class="fas fa-copy" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="clear-button clear-input-btn" onclick="clearInput()">
                <i class="fas fa-eraser"></i>
                清空输入
            </button>
            <button class="save-button" type="button" onclick="saveToHistory()" aria-label="保存结果">
                <i class="fas fa-save" aria-hidden="true"></i>
                保存结果
            </button>
            <button class="clear-button clear-history-btn" onclick="clearHistory()">
                <i class="fas fa-trash"></i>
                清空历史
            </button>
        </div>

        <p class="calc-examples">双精度浮点计算，显示最多 15 位有效数字；≈ 表示展示舍入。超安全整数不保证逐位精确；超出可表示范围或合计溢出会报错。处理预算为100万字符、5万行；明细每页200行，合计包含全部有效行。</p>
        <div class="history-container">
            <div class="history-header">
                <h3 class="history-title">
                    <i class="fas fa-history"></i>
                    历史记录
                    <span class="history-count" id="historyCount">0</span>
                    <span class="history-lifetime">仅本次页面</span>
                </h3>
            </div>
            <div class="history-content">
                <div id="history">
                    <div class="history-empty">
                        <i class="fas fa-clock"></i><br>
                        暂无历史记录
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/text-budget-core.js"></script>
    <script src="../js/calculator-core.js"></script>
    <script>
        let historyCount = 0;
        let calculateTimer;
        let lineResultPage = 0;
        const LINE_PAGE_SIZE = 200;
        let latestCalculation = CalculatorCore.calculate('');

        document.getElementById('linePrev').addEventListener('click', () => { lineResultPage -= 1; renderLineResults(latestCalculation.lines); });
        document.getElementById('lineNext').addEventListener('click', () => { lineResultPage += 1; renderLineResults(latestCalculation.lines); });

        function handleInput() {
            calculateSum();
            updateLineCount();
        }

        function updateLineCount() {
            const textarea = document.getElementById('numbers');
            const counter = document.getElementById('inputLineCount');
            const text = textarea.value;
            const budget = TextBudgetCore.check(text, 0);
            counter.textContent = text.length === 0 ? '0 行' : budget.ok ? budget.lines + ' 行' : '超过处理预算';
        }

        function renderLineResults(lines) {
            const container = document.getElementById('lineResults');
            container.replaceChildren();
            container.scrollTop = 0;
            const pageCount = Math.max(1, Math.ceil(lines.length / LINE_PAGE_SIZE));
            lineResultPage = Math.min(Math.max(0, lineResultPage), pageCount - 1);
            const pagination = document.getElementById('linePagination');
            pagination.hidden = lines.length <= LINE_PAGE_SIZE;
            document.getElementById('linePageStatus').textContent = '第 ' + (lineResultPage + 1) + '/' + pageCount + ' 页，共 ' + lines.length + ' 行（合计包含全部有效行）';
            document.getElementById('linePrev').disabled = lineResultPage === 0;
            document.getElementById('lineNext').disabled = lineResultPage >= pageCount - 1;
            lines.slice(lineResultPage * LINE_PAGE_SIZE, (lineResultPage + 1) * LINE_PAGE_SIZE).forEach(function (item) {
                const row = document.createElement('div');
                row.className = item.error ? 'line-result is-error' : 'line-result';

                const expr = document.createElement('span');
                expr.className = 'line-expr';
                expr.textContent = item.expression;

                const arrow = document.createElement('span');
                arrow.className = 'line-arrow';
                arrow.textContent = ' → ';

                const value = document.createElement('span');
                value.className = item.error ? 'line-error' : 'line-value';
                value.textContent = item.text;

                row.append(expr, arrow, value);
                container.appendChild(row);
            });
        }

        function applyCalculation(calculation) {
            latestCalculation = calculation;
            lineResultPage = 0;
            const resultElement = document.getElementById('result');
            const warningElement = document.getElementById('warning');
            const labelElement = document.getElementById('resultLabel');
            const metaElement = document.getElementById('resultMeta');
            const copyBtn = document.getElementById('copyResultBtn');
            const copyHint = document.getElementById('copyHint');

            renderLineResults(calculation.lines);
            resultElement.textContent = calculation.totalError ? (calculation.budgetError ? '输入超限' : '合计溢出') : (calculation.empty ? '0' : (calculation.approximate ? '≈ ' : '') + calculation.totalText);
            copyBtn.disabled = !calculation.copyable;

            if (calculation.empty) {
                labelElement.textContent = '总和';
                metaElement.textContent = '';
                warningElement.textContent = '';
                warningElement.hidden = true;
                copyHint.textContent = '';
                copyBtn.title = '复制结果';
                return;
            }

            if (calculation.totalError) {
                labelElement.textContent = '无法完成合计';
                metaElement.textContent = '各行结果仍可核对';
                warningElement.textContent = calculation.totalError;
                warningElement.hidden = false;
                copyHint.textContent = calculation.budgetError ? '输入超限，原文保留；不能复制或保存为成功结果' : '合计溢出，不能复制或保存为成功结果';
                copyBtn.title = copyHint.textContent;
                return;
            }

            if (calculation.errorCount > 0) {
                labelElement.textContent = '有效行小计';
                metaElement.textContent = '有效 ' + calculation.validCount + ' 行，错误 ' + calculation.errorCount + ' 行';
                warningElement.textContent = '（提醒：输入框中存在 ' + calculation.errors.join('，') + '）';
                warningElement.hidden = false;
                copyHint.textContent = '有错误行，不能当作完整总数复制';
                copyBtn.title = '有错误行，不能当作完整总数复制';
                return;
            }

            labelElement.textContent = calculation.precisionWarning ? '计算完成（浮点近似）' : '全部成功';
            metaElement.textContent = '最多 15 位有效数字';
            warningElement.textContent = calculation.precisionWarning ? calculation.precisionNote : '';
            warningElement.hidden = !calculation.precisionWarning;
            copyHint.textContent = calculation.approximate ? '复制值保留同样的近似标记' : '';
            copyBtn.title = '复制结果';
        }

        function resetCalculationView() {
            applyCalculation(CalculatorCore.calculate(''));
        }

        function clearInput() {
            const numbersInput = document.getElementById('numbers');
            if (numbersInput.value === '') return;

            if (calculateTimer) {
                clearTimeout(calculateTimer);
                calculateTimer = null;
            }
            numbersInput.value = '';
            resetCalculationView();
            document.getElementById('result').classList.remove('calculating');
            updateLineCount();
            numbersInput.focus();
        }

        function calculateSum() {
            const input = document.getElementById('numbers').value;
            const resultElement = document.getElementById('result');

            resultElement.classList.add('calculating');

            if (calculateTimer) {
                clearTimeout(calculateTimer);
            }

            calculateTimer = setTimeout(function () {
                try {
                    applyCalculation(CalculatorCore.calculate(input));
                } catch (e) {
                    resultElement.textContent = '计算错误';
                    document.getElementById('resultLabel').textContent = '有效行小计';
                    document.getElementById('resultMeta').textContent = '';
                    document.getElementById('warning').textContent = '';
                    document.getElementById('warning').hidden = true;
                    document.getElementById('lineResults').replaceChildren();
                    document.getElementById('copyResultBtn').disabled = true;
                    document.getElementById('copyHint').textContent = '有错误行，不能当作完整总数复制';
                    latestCalculation = null;
                }

                resultElement.classList.remove('calculating');
            }, 300);
        }

        function copyResult() {
            const currentInput = document.getElementById('numbers').value;
            applyCalculation(CalculatorCore.calculate(currentInput));
            if (!latestCalculation || !latestCalculation.copyable) {
                return;
            }
            const result = document.getElementById('result').textContent + (latestCalculation.precisionWarning ? '\n' + latestCalculation.precisionNote : '');
            if (result && result !== '计算错误') {
                navigator.clipboard.writeText(result).then(function () {
                    const btn = document.querySelector('.icon-button i');
                    const originalClass = btn.className;
                    btn.className = 'fas fa-check';
                    btn.style.color = 'var(--success-color)';

                    setTimeout(function () {
                        btn.className = originalClass;
                        btn.style.color = '';
                    }, 1500);
                }).catch(function () {
                    alert('复制失败，请手动复制');
                });
            }
        }

        function saveToHistory() {
            const input = document.getElementById('numbers').value;
            if (!CalculatorCore.canSaveToHistory(input)) {
                return;
            }

            if (calculateTimer) {
                clearTimeout(calculateTimer);
                calculateTimer = null;
            }
            const calculation = CalculatorCore.calculate(input);
            applyCalculation(calculation);
            document.getElementById('result').classList.remove('calculating');
            if (!calculation.complete) {
                document.getElementById('copyHint').textContent = '请先修正错误或溢出，再保存成功结果';
                return;
            }
            const result = (calculation.approximate ? '≈ ' : '') + calculation.totalText + (calculation.precisionWarning ? '（浮点近似）' : '');

            const timestamp = new Date().toLocaleString();
            const formattedExpr = calculation.lines.map(function (item) {
                return item.expression;
            }).join('；');

            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';

            const createHistoryRow = function (className, iconClass, text) {
                const row = document.createElement('div');
                row.className = className;

                const icon = document.createElement('i');
                icon.className = iconClass;
                row.append(icon, document.createTextNode(' ' + text));
                return row;
            };

            historyItem.append(
                createHistoryRow('history-time', 'fas fa-clock', timestamp),
                createHistoryRow('history-expression', 'fas fa-code', formattedExpr),
                createHistoryRow('history-result', 'fas fa-equals', result)
            );

            const historyContainer = document.getElementById('history');
            const emptyMsg = historyContainer.querySelector('.history-empty');
            if (emptyMsg) {
                emptyMsg.remove();
            }

            historyContainer.insertBefore(historyItem, historyContainer.firstChild);

            historyCount++;
            updateHistoryCount();

            const saveBtn = document.querySelector('.save-button');

            function setSaveButtonState(saved) {
                const icon = document.createElement('i');
                icon.className = saved ? 'fas fa-check' : 'fas fa-save';
                icon.setAttribute('aria-hidden', 'true');
                saveBtn.replaceChildren(icon, document.createTextNode(saved ? ' 已保存' : ' 保存结果'));
                saveBtn.style.pointerEvents = saved ? 'none' : '';
            }

            setSaveButtonState(true);

            setTimeout(function () {
                setSaveButtonState(false);
            }, 1000);
        }

        function clearHistory() {
            if (historyCount === 0) return;

            if (confirm('确定要清空所有历史记录吗？')) {
                const historyContainer = document.getElementById('history');
                const empty = document.createElement('div');
                empty.className = 'history-empty';

                const icon = document.createElement('i');
                icon.className = 'fas fa-clock';
                empty.append(icon, document.createElement('br'), document.createTextNode('暂无历史记录'));
                historyContainer.replaceChildren(empty);

                historyCount = 0;
                updateHistoryCount();
            }
        }

        function updateHistoryCount() {
            document.getElementById('historyCount').textContent = historyCount;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const numbersInput = document.getElementById('numbers');
            numbersInput.focus();
            updateLineCount();
        });
    </script>
    <script src="../js/unsaved-guard.js"></script>
    <script src="../js/theme.js"></script>
</body>

</html>
