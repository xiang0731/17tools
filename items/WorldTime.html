<head>
    <meta charset="UTF-8">
    <script>
        (function applyThemeEarly() {
            try {
                var pref = localStorage.getItem('17tools-theme');
                if (pref == null) {
                    pref = localStorage.getItem('theme');
                    if (pref != null) {
                        localStorage.setItem('17tools-theme', pref);
                    }
                }
                var theme = (pref === 'light' || pref === 'dark')
                    ? pref
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* 存储不可用时由 theme.js 降级 */ }
        })();
    </script>

        :root {
            --clock-max-size: 220px;
            --clock-min-size: 130px;
        }

        body {
            height: 100vh;
            padding: clamp(15px, 3vh, 30px) var(--spacing-md);
            background-color: var(--background-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            justify-content: flex-start;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin: 0 0 clamp(10px, 2vh, 25px) 0;
            font-size: clamp(22px, 3.5vh, 30px);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            flex-shrink: 0;
        }

        h1::before {
            content: "\f0ac";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: var(--primary-color);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(15px, 4vw, 40px);
            margin-bottom: clamp(15px, 3vh, 30px);
            flex-shrink: 1;
            min-height: 0;
            width: 100%;
        }

        .clock-card {
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: clamp(15px, 3vh, 30px);
            box-shadow: var(--shadow-md);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 0;
            min-width: 0;
            position: relative;
        }

        .clock-label {
            display: inline-block;
            width: 28px;
            height: 28px;
            line-height: 28px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
            margin: 0 auto 10px;
            flex-shrink: 0;
        }

        .clock-title {
            font-size: clamp(16px, 2.5vh, 20px);
            font-weight: 700;
            margin-bottom: clamp(8px, 2vh, 18px);
            line-height: 1.2;
            flex-shrink: 0;
        }

        .clock-title .en-title {
            display: block;
            font-size: 0.7em;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .clock-title .timezone-code {
            display: block;
            margin-top: var(--spacing-sm);
            color: var(--primary-color);
            font-size: 0.7em;
            font-weight: 500;
            line-height: 1.4;
        }

        .clock-container {
            position: relative;
            width: clamp(var(--clock-min-size), 30vh, var(--clock-max-size));
            height: clamp(var(--clock-min-size), 30vh, var(--clock-max-size));
            margin: 0 auto clamp(12px, 2.5vh, 25px);
            flex-shrink: 1;
            min-height: 0;
        }

        .clock {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--background-primary);
            border: 2px solid var(--border-color);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        .marker {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .marker::after {
            content: "";
            position: absolute;
            top: 2%;
            left: 50%;
            width: 1px;
            height: 4%;
            background-color: var(--text-secondary);
            transform: translateX(-50%);
        }

        .marker.hour::after {
            width: 2px;
            height: 8%;
            background-color: var(--text-primary);
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: 50% 100%;
            z-index: 10;
            will-change: transform; /* 性能优化：启用 GPU 加速 */
        }

        .hour-hand {
            width: 6px;
            height: 25%;
            background-color: var(--text-primary);
            border-radius: 6px;
            margin-left: -3px;
        }

        .minute-hand {
            width: 4px;
            height: 38%;
            background-color: var(--text-secondary);
            border-radius: 4px;
            margin-left: -2px;
        }

        .second-hand {
            width: 2px;
            height: 44%;
            background-color: #ef4444;
            border-radius: 2px;
            margin-left: -1px;
            z-index: 11;
        }

        .center-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border: 2px solid white;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 12;
        }

        .digital-time {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: clamp(24px, 4vh, 32px);
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 4px;
            flex-shrink: 0;
            letter-spacing: -1px;
        }

        .digital-date {
            font-size: clamp(12px, 1.8vh, 14px);
            color: var(--text-secondary);
            margin-bottom: clamp(10px, 2vh, 20px);
            line-height: 1.4;
            flex-shrink: 0;
        }

        .en-date {
            display: block;
            font-size: 0.85em;
            opacity: 0.7;
            margin-top: 2px;
        }

        .timezone-selector select {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            padding: 8px 32px 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--background-primary);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 14px;
            cursor: pointer;
        }

        .time-difference {
            width: 100%;
            padding: clamp(12px, 2.5vh, 20px);
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border-radius: var(--radius-lg);
            text-align: center;
            color: white;
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .time-difference h3 {
            font-size: clamp(14px, 2vh, 16px);
            margin: 0 0 6px 0;
            opacity: 0.9;
            font-weight: 500;
        }

        .time-difference-value {
            font-size: clamp(20px, 3.5vh, 26px);
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .footer-info {
            margin-top: auto;
            padding-top: 15px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            color: var(--text-tertiary);
            font-size: 11px;
            flex-shrink: 0;
        }

                flex-shrink: 0;
            }
            .clock-container { flex-shrink: 0; }
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
        }
    </style>
</head>

                'Africa/Lagos': { cn: '尼日利亚 (拉各斯)', initial: 'N', en: 'Nigeria (Lagos)', continent: '非洲', codes: { 1: 'WAT' } },
                'Africa/Nairobi': { cn: '肯尼亚 (内罗毕)', initial: 'K', en: 'Kenya (Nairobi)', continent: '非洲', codes: { 3: 'EAT' } },
                'Africa/Casablanca': { cn: '摩洛哥 (卡萨布兰卡)', initial: 'M', en: 'Morocco (Casablanca)', continent: '非洲', codes: { 0: 'GMT', 1: '+01' } },
                'Atlantic/Reykjavik': { cn: '冰岛 (雷克雅未克)', initial: 'B', en: 'Iceland (Reykjavik)', continent: '欧洲', codes: { 0: 'GMT' } }
            };

            const timezoneOptions = new Map();
            let labelsMinute = null;

            function initClockFace(faceId) {
                const face = document.getElementById(faceId);
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < 60; i++) {
                    const marker = document.createElement('div');
                    marker.className = 'marker' + (i % 5 === 0 ? ' hour' : '');
                    marker.style.transform = `rotate(${i * 6}deg)`;
                    fragment.appendChild(marker);
                }
                face.appendChild(fragment);
            }

            function updateTzState(side, tz) {
                state[side].tz = tz;
                state[side].fmt = {
                    time: formatters.time(tz),
                    dateCN: formatters.dateCN(tz),
                    dateEN: formatters.dateEN(tz),
                    raw: formatters.raw(tz)
                };
                // 更新标题
                const data = timezoneData[tz];
                const enTitle = document.createElement('span');
                enTitle.className = 'en-title';
                enTitle.textContent = data.en;
                const code = document.createElement('span');
                code.className = 'timezone-code';
                dom[side].code = code;
                dom[side].title.replaceChildren(document.createTextNode(`${data.cn} · ${data.continent}`), enTitle, code);
            }

            function getTimeZoneOffsetHours(timeZone, date = new Date()) {
                try {
                    const parts = new Intl.DateTimeFormat('en-US', {
                        timeZone,
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hourCycle: 'h23'
                    }).formatToParts(date);

                    const values = {};
                    parts.forEach(part => {
                        if (part.type !== 'literal') {
                            values[part.type] = part.value;
                        }
                    });

                    const zonedAsUtc = Date.UTC(
                        Number(values.year),
                        Number(values.month) - 1,
                        Number(values.day),
                        Number(values.hour),
                        Number(values.minute),
                        Number(values.second)
                    );

                    const offset = (zonedAsUtc - date.getTime()) / 3600000;
                    return Number.isFinite(offset) ? offset : null;
                } catch (e) {
                    return null;
                }
            }

            function formatOffsetMinutes(minutes) {
                const hours = Math.floor(minutes / 60);
                const remainder = minutes % 60;
                return [hours ? `${hours} 小时` : '', remainder ? `${remainder} 分钟` : ''].filter(Boolean).join(' ');
            }

            function updateDiff(now = new Date()) {
                const leftOffset = getTimeZoneOffsetHours(state.left.tz, now);
                const rightOffset = getTimeZoneOffsetHours(state.right.tz, now);
                let message = '准确时差暂不可用，请核对浏览器时区支持';
                if (leftOffset !== null && rightOffset !== null) {
                    const diff = Math.round((leftOffset - rightOffset) * 60);
                    const leftName = `A ${timezoneData[state.left.tz].cn}`;
                    const rightName = `B ${timezoneData[state.right.tz].cn}`;
                    message = diff === 0 ? `${leftName} 与 ${rightName} 时间相同` : `${leftName} 比 ${rightName} ${diff > 0 ? '早' : '晚'} ${formatOffsetMinutes(Math.abs(diff))}`;
                }
                if (dom.diff.textContent !== message) dom.diff.textContent = message;
                return { left: leftOffset, right: rightOffset };
            }

            function getTimezoneLabel(tz, offset) {
                if (offset === null) return '时区信息暂不可用';
                const minutes = Math.round(offset * 60);
                const absolute = Math.abs(minutes);
                const hours = String(Math.floor(absolute / 60)).padStart(2, '0');
                const remainder = String(absolute % 60).padStart(2, '0');
                const utc = `UTC${minutes < 0 ? '-' : '+'}${hours}:${remainder}`;
                const code = timezoneData[tz].codes[minutes / 60];
                return code ? `${code} · ${utc}` : utc;
            }

            function updateTimezoneOptions(tz, offset) {
                const data = timezoneData[tz];
                const text = `${data.cn} · ${data.continent} · ${getTimezoneLabel(tz, offset)}`;
                timezoneOptions.get(tz).forEach(option => {
                    if (option.textContent !== text) option.textContent = text;
                });
            }

            function tick() {
                const now = new Date();
                const offsets = updateDiff(now);
                // 列表每分钟刷新；当前两个时钟每秒刷新，跨夏令时即时同步。
                const minute = Math.floor(now.getTime() / 60000);
                if (labelsMinute !== minute) {
                    Object.keys(timezoneData).forEach(tz => {
                        updateTimezoneOptions(tz, getTimeZoneOffsetHours(tz, now));
                    });
                    labelsMinute = minute;
                }
                ['left', 'right'].forEach(side => {
                    const s = state[side];
                    const d = dom[side];
                    const label = getTimezoneLabel(s.tz, offsets[side]);
                    if (d.code.textContent !== label) d.code.textContent = label;
                    updateTimezoneOptions(s.tz, offsets[side]);
                    // 性能优化：使用 textContent 代替 innerHTML
                    d.time.textContent = s.fmt.time.format(now);
                    
                    // 日期由于有 span 结构，仍使用 innerHTML，但日期变化频率低，可接受
                    const cnDate = s.fmt.dateCN.format(now);
                    const enDate = s.fmt.dateEN.format(now);
                    d.date.innerHTML = `${cnDate}<span class="en-date">${enDate}</span>`;

                    // 获取数值用于指针
                    const parts = s.fmt.raw.formatToParts(now);
                    const h = parseInt(parts.find(p => p.type === 'hour').value);
                    const m = parseInt(parts.find(p => p.type === 'minute').value);
                    const sec = parseInt(parts.find(p => p.type === 'second').value);

                    d.h.style.transform = `rotate(${(h % 12) * 30 + m * 0.5}deg)`;
                    d.m.style.transform = `rotate(${m * 6}deg)`;
                    d.s.style.transform = `rotate(${sec * 6}deg)`;
                });
            }

            function populateSelectors() {
                const collator = new Intl.Collator('zh-CN-u-co-pinyin');
                const keys = Object.keys(timezoneData).sort((a, b) => collator.compare(timezoneData[a].cn, timezoneData[b].cn));
                
                ['left', 'right'].forEach(side => {
                    const select = dom[side].select;
                    const groups = new Map();
                    keys.forEach(k => {
                        const data = timezoneData[k];
                        if (!groups.has(data.initial)) {
                            const group = document.createElement('optgroup');
                            group.label = `${data.initial} ──────`;
                            groups.set(data.initial, group);
                            select.appendChild(group);
                        }
                        const opt = new Option(data.cn, k);
                        if (!timezoneOptions.has(k)) timezoneOptions.set(k, []);
                        timezoneOptions.get(k).push(opt);
                        groups.get(data.initial).appendChild(opt);
                    });
                    select.value = state[side].tz;
                    select.onchange = (e) => {
                        updateTzState(side, e.target.value);
                        tick();
                    };
                });
            }

            // 初始化
            initClockFace('left-clock-face');
            initClockFace('right-clock-face');
            populateSelectors();
            updateTzState('left', state.left.tz);
            updateTzState('right', state.right.tz);
            
            tick();
            setInterval(tick, 1000);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
            window.addEventListener('pageshow', tick);
        });
    </script>
</body>
</html>
