<!DOCTYPE html>
<html lang="zh" data-unsaved-guard="off">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎页面</title>
    <script>
        (function applyThemeEarly() {
            try {
                var pref = localStorage.getItem('17tools-theme');
                if (pref == null) {
                    pref = localStorage.getItem('theme');
                    if (pref != null) {
                        localStorage.setItem('17tools-theme', pref);
                    }
                }
                var theme = (pref === 'light' || pref === 'dark')
                    ? pref
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* 存储不可用时由 theme.js 降级 */ }
        })();
    </script>
    <link rel="stylesheet" href="../css/theme.css">
    <link href="../vendor/fontawesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: var(--font-family);
            background: var(--background-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color var(--transition-base), color var(--transition-base);
            overflow: hidden;
            position: relative;
        }

        /* 背景动态效果 */
        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .floating-shapes {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite linear;
        }

        .shape-1 {
            width: 80px;
            height: 80px;
            background: var(--primary-color);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 120px;
            height: 120px;
            background: var(--accent-color);
            top: 60%;
            right: 15%;
            animation-delay: -7s;
        }

        .shape-3 {
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            bottom: 20%;
            left: 20%;
            animation-delay: -14s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }

            33% {
                transform: translateY(-30px) rotate(120deg);
            }

            66% {
                transform: translateY(15px) rotate(240deg);
            }

            100% {
                transform: translateY(0) rotate(360deg);
            }
        }

        /* 主内容容器 */
        .welcome-container {
            text-align: center;
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-2xl);
            padding: 60px 40px;
            box-shadow: var(--shadow-sm);
            max-width: 600px;
            width: 90%;
        }



        /* Logo和标题 */
        .logo-section {
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 72px;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .title {
            font-size: 48px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .version {
            display: inline-block;
            background: var(--primary-color);
            color: var(--text-inverse);
            padding: var(--spacing-xs) var(--spacing-md);
            border-radius: var(--radius-lg);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .description {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 特性展示 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .feature-card {
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg) 20px;
            transition: all var(--transition-base);
            cursor: pointer;
            font: inherit;
            color: inherit;
            width: 100%;
            text-align: center;
            appearance: none;
            -webkit-appearance: none;
        }

        .feature-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: var(--shadow-medium);
            border-color: var(--primary-color);
        }

        .feature-card:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        .feature-icon {
            font-size: 24px;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .feature-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .feature-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* 底部信息 */
        .footer-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: 14px;
            color: var(--text-secondary);
        }

        .info-item i {
            color: var(--accent-color);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .welcome-container {
                padding: 40px var(--spacing-lg);
                margin: 20px;
            }

            .title {
                font-size: 36px;
            }

            .logo-icon {
                font-size: 60px;
            }

            .description {
                font-size: 16px;
            }

            .features {
                grid-template-columns: 1fr;
                gap: var(--spacing-md);
            }

            .footer-info {
                flex-direction: column;
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 28px;
            }

            .logo-icon {
                font-size: 48px;
            }

            .welcome-container {
                padding: 32px 20px;
            }
        }

        /* 主题切换动画 */
        .welcome-container,
        .feature-card,
        .logo-icon,
        .title,
        .version,
        .description,
        .feature-title,
        .feature-desc,
        .info-item {
            transition: all 0.3s ease;
        }
        .task-shortcuts { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--spacing-sm); margin-bottom: var(--spacing-lg); }
        .task-shortcuts p { width: 100%; color: var(--text-secondary); }
        .task-shortcut { font: inherit; color: var(--text-primary); background: var(--background-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); min-height: 44px; padding: var(--spacing-sm) var(--spacing-md); cursor: pointer; }
    </style>
</head>

<body>
    <div class="welcome-container">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fas fa-tools"></i>
            </div>
            <h1 class="title">17Tools</h1>
            <div class="version" data-version>v2.20.3</div>
            <p class="description">
                现代化的在线工具集合，为您的日常工作提供高效便捷的解决方案
            </p>
        </div>

        <div class="features">
            <button type="button" class="feature-card" data-file="Calculator.html" aria-label="打开极速计算">
                <div class="feature-icon">
                    <i class="fas fa-calculator" aria-hidden="true"></i>
                </div>
                <div class="feature-title">极速计算</div>
                <div class="feature-desc">打开即用，心算变笔算</div>
            </button>

            <button type="button" class="feature-card" data-file="Board.html" aria-label="打开智能白板">
                <div class="feature-icon">
                    <i class="fas fa-paint-brush" aria-hidden="true"></i>
                </div>
                <div class="feature-title">智能白板</div>
                <div class="feature-desc">画画写字，想法先落在板上</div>
            </button>

            <button type="button" class="feature-card" data-file="QRCode.html" aria-label="打开二维码工具">
                <div class="feature-icon">
                    <i class="fas fa-qrcode" aria-hidden="true"></i>
                </div>
                <div class="feature-title">二维码工具</div>
                <div class="feature-desc">链接、名片、WiFi，手机扫一扫</div>
            </button>
        </div>

        <div class="task-shortcuts" aria-label="按任务打开工具">
            <p>今天想做什么？</p>
            <button type="button" class="task-shortcut" data-file="ImageProcessor.html">压缩图片 / 隐私遮挡</button>
            <button type="button" class="task-shortcut" data-file="LinkCleaner.html">去掉链接追踪参数</button>
            <button type="button" class="task-shortcut" data-file="DateCalculator.html">计算工作日</button>
        </div>
        <div class="footer-info">
            <div class="info-item">
                <i class="fas fa-wrench"></i>
                <span>21个实用工具</span>
            </div>
            <div class="info-item">
                <i class="fas fa-shield-alt"></i>
                <span>本地处理，数据安全</span>
            </div>
            <div class="info-item">
                <i class="fas fa-heart"></i>
                <span>完全免费使用</span>
            </div>
        </div>
    </div>

    <script src="../js/tool-route-core.js"></script>
    <script>
        document.querySelectorAll('.feature-card[data-file], .task-shortcut[data-file]').forEach(function (card) {
            card.addEventListener('click', function () {
                const file = card.getAttribute('data-file');
                if (window.ToolRoute && ToolRoute.requestParentNavigate(window, file)) {
                    return;
                }
                const search = window.ToolRoute
                    ? ToolRoute.buildSearch(file)
                    : ('?tool=' + encodeURIComponent(file || ''));
                window.location.href = '../index.html' + search;
            });
        });
    </script>
    <script src="../js/theme.js"></script>
    <script src="../js/version.js"></script>
</body>

</html>
