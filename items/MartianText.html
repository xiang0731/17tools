<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <script>
        (function applyThemeEarly() {
            try {
                var pref = localStorage.getItem('17tools-theme');
                if (pref == null) {
                    pref = localStorage.getItem('theme');
                    if (pref != null) {
                        localStorage.setItem('17tools-theme', pref);
                    }
                }
                var theme = (pref === 'light' || pref === 'dark')
                    ? pref
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* 存储不可用时由 theme.js 降级 */ }
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火星文转换器</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link href="../vendor/fontawesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* Fallback colors if theme.css is missing or incomplete */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --transition-fast: 0.2s ease;
            --font-mono: 'Menlo', 'Monaco', 'Courier New', monospace;

            --error-color: #ff4d4f;
            --warning-color: #faad14;
            --success-color: #52c41a;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        body {
            min-height: 100vh;
            padding: var(--spacing-lg);
            background-color: var(--background-primary);
            color: var(--text-primary);
            margin: 0;
            font-family: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            gap: var(--spacing-lg);
            padding-bottom: var(--spacing-xl);
        }

        /* 标题样式 */
        h1 {
            text-align: center;
            color: var(--text-primary);
            margin: 0 0 var(--spacing-xl) 0;
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        /* 输入容器样式 */
        .input-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-lg);
        }

        .input-container {
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            transition: box-shadow var(--transition-fast);
        }

        .input-container:focus-within {
            box-shadow: var(--shadow-md);
            border-color: var(--border-focus);
        }

        .input-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            font-weight: 600;
            font-size: 18px;
            color: var(--text-primary);
        }

        /* 文本框样式 */
        textarea {
            width: 100%;
            min-height: 200px;
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            line-height: 1.6;
            font-family: var(--font-mono);
            background-color: var(--background-primary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        textarea::placeholder {
            color: var(--text-tertiary);
        }

        /* 按钮样式 */
        .button-container {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
            margin-top: var(--spacing-md);
        }

        /* 通用按钮基础样式 */
        .btn {
            border: none;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            user-select: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--text-inverse);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--background-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--background-hover);
        }

        /* 结果显示区域 */
        .result-section {
            grid-column: 1 / -1;
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-md);
        }

        .result-title {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 18px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: var(--spacing-md);
            }

            .input-section {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 24px;
                margin-bottom: var(--spacing-lg);
            }

            .button-container {
                flex-direction: column;
            }

            .button-container .btn {
                width: 100%;
                justify-content: center;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--spacing-sm);
            }
        }

        /* Toast Notification Styles */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: var(--background-secondary);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            max-width: 90vw;
            animation: toastSlideDown 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            pointer-events: auto;
            border-left: 4px solid var(--primary-color);
        }

        .toast.success {
            border-left-color: var(--success-color);
        }

        .toast.error {
            border-left-color: var(--error-color);
        }

        .toast.warning {
            border-left-color: var(--warning-color);
        }

        .toast-icon {
            font-size: 18px;
        }

        .toast.success .toast-icon {
            color: var(--success-color);
        }

        .toast.error .toast-icon {
            color: var(--error-color);
        }

        .toast.warning .toast-icon {
            color: var(--warning-color);
        }

        .toast-message {
            font-size: 14px;
            font-weight: 500;
        }

        @keyframes toastSlideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes toastFadeOut {
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>

<body>
    <div class="container">
        <h1>
            <i class="fas fa-language"></i>
            火星文转换器
        </h1>

        <!-- 原始文本区域 -->
        <div class="input-section">
            <div class="input-container">
                <div class="input-header">
                    <i class="fas fa-file-text"></i>
                    原文
                </div>
                <textarea aria-label="原文" id="inputText" placeholder="请输入要转换的正常文字..."></textarea>
                <label for="decorationMode">装饰方式</label>
                <select id="decorationMode">
                    <option value="none">仅转换（每次相同）</option>
                    <option value="light">少量随机装饰（约5%）</option>
                    <option value="dense">较多随机装饰（约15%）</option>
                </select>
                <p>随机装饰每次可能不同；支持完整emoji，原文不自动保存。最多100万字符、5万行。</p>
                <div class="button-container">
                    <button class="btn btn-primary" onclick="performConvert()">
                        <i class="fas fa-magic"></i>
                        转换
                    </button>
                    <button class="btn btn-secondary" onclick="pasteFromClipboard('inputText')">
                        <i class="fas fa-paste"></i>
                        粘贴
                    </button>
                    <button class="btn btn-secondary" onclick="clearText('inputText')">
                        <i class="fas fa-trash"></i>
                        清空原文
                    </button>
                </div>
            </div>
        </div>

        <!-- 结果显示区域 -->
        <div class="result-section">
            <div class="result-header">
                <div class="result-title">
                    <i class="fas fa-check-circle"></i>
                    火星文结果
                </div>
            </div>
            <textarea aria-label="火星文结果" id="outputText" readonly placeholder="转换后的火星文将显示在这里..."></textarea>
            <div class="button-container">
                <button class="btn btn-secondary" onclick="copyToClipboard('outputText')">
                    <i class="fas fa-copy"></i>
                    复制结果
                </button>
            </div>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="../js/text-budget-core.js"></script>
    <script src="../js/martian-text-core.js"></script>
    <script src="../js/clipboard.js"></script>
    <script>
        function performConvert() {
            const inputElement = document.getElementById('inputText');
            const outputElement = document.getElementById('outputText');
            const text = inputElement.value;
            
            if (text.trim() === '') {
                showToast('请输入要转换的原文', 'warning');
                return;
            }
            
            const mode = document.getElementById('decorationMode').value;
            const result = MartianTextCore.convert(text, { decorate: mode !== 'none', rate: mode === 'dense' ? 0.15 : 0.05 });
            if (!result.ok) { showToast(result.reason, 'warning'); return; }
            outputElement.value = result.text;
            showToast('转换成功！', 'success');
        }

        function clearText(elementId) {
            document.getElementById(elementId).value = '';
            if (elementId === 'inputText') {
                document.getElementById('outputText').value = '';
                document.getElementById(elementId).focus();
            }
        }

        async function pasteFromClipboard(elementId) {
            try {
                const text = await navigator.clipboard.readText();
                const element = document.getElementById(elementId);
                element.value = text;
                showToast('已从剪贴板粘贴', 'success');
            } catch (err) {
                showToast('无法读取剪贴板，请手动粘贴', 'error');
            }
        }

        async function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.value;
            
            if (!text) {
                showToast('没有可复制的内容', 'warning');
                return;
            }
            
            const result = await ToolsClipboard.copyText(text, { element: element });
            showToast(result.message, result.ok ? 'success' : 'error');
        }

        // Toast 提示系统
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = document.createElement('i');
            icon.className = `fas ${icons[type] || icons.info} toast-icon`;
            const text = document.createElement('span');
            text.className = 'toast-message';
            text.textContent = message;
            toast.append(icon, text);

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'toastFadeOut 0.3s forwards';
                setTimeout(() => {
                    if (toast.parentElement) {
                        toast.parentElement.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

    </script>
    <script src="../js/unsaved-guard.js"></script>
    <script src="../js/theme.js"></script>
</body>
</html>
