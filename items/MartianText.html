<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火星文转换器</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* Fallback colors if theme.css is missing or incomplete */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --transition-fast: 0.2s ease;
            --font-mono: 'Menlo', 'Monaco', 'Courier New', monospace;

            --error-color: #ff4d4f;
            --warning-color: #faad14;
            --success-color: #52c41a;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        body {
            min-height: 100vh;
            padding: var(--spacing-lg);
            background-color: var(--background-primary);
            color: var(--text-primary);
            margin: 0;
            font-family: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            gap: var(--spacing-lg);
            padding-bottom: var(--spacing-xl);
        }

        /* 标题样式 */
        h1 {
            text-align: center;
            color: var(--text-primary);
            margin: 0 0 var(--spacing-xl) 0;
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        /* 输入容器样式 */
        .input-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-lg);
        }

        .input-container {
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            transition: box-shadow var(--transition-fast);
        }

        .input-container:focus-within {
            box-shadow: var(--shadow-md);
            border-color: var(--border-focus);
        }

        .input-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            font-weight: 600;
            font-size: 18px;
            color: var(--text-primary);
        }

        /* 文本框样式 */
        textarea {
            width: 100%;
            min-height: 200px;
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            line-height: 1.6;
            font-family: var(--font-mono);
            background-color: var(--background-primary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        textarea::placeholder {
            color: var(--text-tertiary);
        }

        /* 按钮样式 */
        .button-container {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
            margin-top: var(--spacing-md);
        }

        /* 通用按钮基础样式 */
        .btn {
            border: none;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            user-select: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--text-inverse);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--background-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--background-hover);
        }

        /* 结果显示区域 */
        .result-section {
            grid-column: 1 / -1;
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-md);
        }

        .result-title {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 18px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: var(--spacing-md);
            }

            .input-section {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 24px;
                margin-bottom: var(--spacing-lg);
            }

            .button-container {
                flex-direction: column;
            }

            .button-container .btn {
                width: 100%;
                justify-content: center;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--spacing-sm);
            }
        }

        /* Toast Notification Styles */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: var(--background-secondary);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            max-width: 90vw;
            animation: toastSlideDown 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            pointer-events: auto;
            border-left: 4px solid var(--primary-color);
        }

        .toast.success {
            border-left-color: var(--success-color);
        }

        .toast.error {
            border-left-color: var(--error-color);
        }

        .toast.warning {
            border-left-color: var(--warning-color);
        }

        .toast-icon {
            font-size: 18px;
        }

        .toast.success .toast-icon {
            color: var(--success-color);
        }

        .toast.error .toast-icon {
            color: var(--error-color);
        }

        .toast.warning .toast-icon {
            color: var(--warning-color);
        }

        .toast-message {
            font-size: 14px;
            font-weight: 500;
        }

        @keyframes toastSlideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes toastFadeOut {
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>

<body>
    <div class="container">
        <h1>
            <i class="fas fa-language"></i>
            火星文转换器
        </h1>

        <!-- 原始文本区域 -->
        <div class="input-section">
            <div class="input-container">
                <div class="input-header">
                    <i class="fas fa-file-text"></i>
                    原文
                </div>
                <textarea id="inputText" placeholder="请输入要转换的正常文字..."></textarea>
                <div class="button-container">
                    <button class="btn btn-primary" onclick="performConvert()">
                        <i class="fas fa-magic"></i>
                        转换
                    </button>
                    <button class="btn btn-secondary" onclick="pasteFromClipboard('inputText')">
                        <i class="fas fa-paste"></i>
                        粘贴
                    </button>
                    <button class="btn btn-secondary" onclick="clearText('inputText')">
                        <i class="fas fa-trash"></i>
                        清空原文
                    </button>
                </div>
            </div>
        </div>

        <!-- 结果显示区域 -->
        <div class="result-section">
            <div class="result-header">
                <div class="result-title">
                    <i class="fas fa-check-circle"></i>
                    火星文结果
                </div>
            </div>
            <textarea id="outputText" readonly placeholder="转换后的火星文将显示在这里..."></textarea>
            <div class="button-container">
                <button class="btn btn-secondary" onclick="copyToClipboard('outputText')">
                    <i class="fas fa-copy"></i>
                    复制结果
                </button>
            </div>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div id="toastContainer" class="toast-container"></div>

    <script>
        // 火星文字典映射
        const martianMap = {
            '我': '硪', '的': '啲', '爱': '僾', '你': '伱', '是': '媞', '不': '吥', '了': 'ㄋ', '在': '恠',
            '好': '恏', '说': '説', '想': '厢', '很': '狠', '真': '眞', '这': '这', '吗': '嘛', '会': '哙',
            '有': '囿', '就': '僦', '都': '嘟', '对': '怼', '起': '唘', '什': '什', '么': '庅', '大': '汏',
            '家': '傢', '太': '冭', '小': '尐', '没': '莈', '还': '遦', '走': '赱', '看': '阭', '见': '笕',
            '到': '菿', '得': '嘚', '啊': '吖', '哦': '喔', '哈': '铪', '和': '啝', '那': '那', '些': '些',
            '人': '亾', '个': '个', '天': '兲', '心': '杺', '里': '哩', '生': '泩', '为': '沩', '来': '唻',
            '去': '厾', '能': '螚', '做': '莋', '事': '倳', '如': '侞', '果': '淉', '被': '被', '要': '崾',
            '把': '妑', '让': '让', '只': '呮', '可': '苛', '以': '苡', '之': '之', '所': '所', '一': '①',
            '二': '②', '三': '③', '四': '④', '五': '⑤', '六': '⑥', '七': '⑦', '八': '⑧', '九': '⑨', 
            '十': '⑩', '男': '莮', '女': '囡', '泪': '汨', '伤': '殇', '悲': '棑', '痛': '嗵', '死': '屍',
            '忘': '莣', '记': '汜', '亲': '儭', '宝': '寳', '贝': '唄', '最': '蕞', '懂': '董', '错': '諎',
            '别': '莂', '欢': '飌', '笑': '咲', '哭': '梪', '觉': '灚', '梦': '儚', '多': '哆', '少': '仯',
            '远': '逺', '近': '迬', '明': '朙', '暗': '闇', '星': '猩', '月': '刖', '云': '囩', '风': '颩',
            '雨': '傴', '雪': '膤', '花': '婲', '草': '愺', '树': '樹', '山': '屾', '水': '氺', '火': '焱',
            '光': '灮', '影': '巛', '黑': '潶', '白': '皌', '红': '荭', '绿': '淥', '蓝': '嚲', '黄': '騜',
            '她': '咃', '他': '祂', '它': '牠', '们': '扪', '给': '給', '等': '僜', '谁': '誰', '哪': '哪',
            '快': '加快', '乐': '泺', '痛': '痌', '苦': '楛', '爱': '璦', '情': '凊', '友': '叐', '谊': '誼'
        };

        const specialSymbols = ['灬', '丶', '丿', 'oοΟ', '°', '·', '≈', '╬', '╭ァ', 'ゞ', '☆', '★', '○', '●'];

        function performConvert() {
            const inputElement = document.getElementById('inputText');
            const outputElement = document.getElementById('outputText');
            const text = inputElement.value;
            
            if (text.trim() === '') {
                showToast('请输入要转换的原文', 'warning');
                return;
            }
            
            let result = '';
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                let mappedChar = martianMap[char] || char;
                result += mappedChar;
                
                if (Math.random() < 0.05 && char.trim() !== '') {
                    const randomSymbol = specialSymbols[Math.floor(Math.random() * specialSymbols.length)];
                    result += randomSymbol;
                }
            }
            
            outputElement.value = result;
            showToast('转换成功！', 'success');
        }

        function clearText(elementId) {
            document.getElementById(elementId).value = '';
            if (elementId === 'inputText') {
                document.getElementById('outputText').value = '';
                document.getElementById(elementId).focus();
            }
        }

        async function pasteFromClipboard(elementId) {
            try {
                const text = await navigator.clipboard.readText();
                const element = document.getElementById(elementId);
                element.value = text;
                showToast('已从剪贴板粘贴', 'success');
            } catch (err) {
                showToast('无法读取剪贴板，请手动粘贴', 'error');
            }
        }

        async function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.value;
            
            if (!text) {
                showToast('没有可复制的内容', 'warning');
                return;
            }
            
            try {
                await navigator.clipboard.writeText(text);
                showToast('复制成功！', 'success');
            } catch (err) {
                element.select();
                document.execCommand('copy');
                showToast('复制成功！', 'success');
            }
        }

        // Toast 提示系统
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info} toast-icon"></i>
                <span class="toast-message">${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'toastFadeOut 0.3s forwards';
                setTimeout(() => {
                    if (toast.parentElement) {
                        toast.parentElement.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }

    </script>
    <script src="../js/theme.js"></script>
</body>
</html>
