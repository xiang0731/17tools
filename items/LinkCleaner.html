<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script>
        (function applyThemeEarly() {
            try {
                var pref = localStorage.getItem('17tools-theme');
                if (pref == null) {
                    pref = localStorage.getItem('theme');
                    if (pref != null) {
                        localStorage.setItem('17tools-theme', pref);
                    }
                }
                var theme = (pref === 'light' || pref === 'dark')
                    ? pref
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* 存储不可用时由 theme.js 降级 */ }
        })();
    </script>

    <title>链接清理工具</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/theme.css">
    <link href="../vendor/fontawesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
        }

        .link-cleaner {
            width: 100%;
            min-height: 100vh;
            padding: var(--spacing-lg);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            font-family: var(--font-family);
            overflow-y: auto;
            background-color: var(--background-primary);
            color: var(--text-primary);
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin: 0 0 var(--spacing-lg) 0;
            padding: 0;
            font-size: 28px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .input-container {
            margin-bottom: var(--spacing-lg);
        }

        .input-label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .url-input {
            width: 100%;
            height: 120px;
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            font-family: var(--font-mono);
            background-color: var(--background-primary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .url-input:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .url-input::placeholder {
            color: var(--text-tertiary);
        }

        .button-group {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .paste-button {
            flex: 1;
            min-width: 120px;
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--primary-gradient);
            color: var(--text-inverse);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .paste-button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .clean-button {
            flex: 1;
            min-width: 120px;
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--primary-color);
            color: var(--text-inverse);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .clean-button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .copy-new-button {
            flex: 1;
            min-width: 120px;
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--success-color);
            color: var(--text-inverse);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .copy-new-button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .copy-new-button:disabled {
            background: var(--background-tertiary);
            color: var(--text-tertiary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .clear-button {
            flex: 1;
            min-width: 120px;
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--background-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .clear-button:hover {
            background: var(--background-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .result-container {
            flex-shrink: 0;
            padding: var(--spacing-lg);
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-md);
        }

        .result-label {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .copy-button {
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--accent-color);
            color: var(--text-inverse);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .copy-button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .result-value {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-secondary);
            word-break: break-all;
            line-height: 1.5;
            padding: var(--spacing-md);
            background: var(--background-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            max-height: 280px;
            overflow-y: auto;
        }

        .result-summary,
        .copy-summary {
            margin: 0 0 var(--spacing-md) 0;
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-secondary);
        }

        .copy-panel {
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border-color);
        }

        .copy-actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .copy-choice {
            flex: 1 1 220px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .copy-panel .copy-new-button,
        .copy-panel .copy-keep-button {
            flex: none;
            width: 100%;
            min-height: 44px;
        }

        .copy-keep-button {
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--background-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .copy-keep-button:hover {
            background: var(--background-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .copy-keep-button:disabled {
            background: var(--background-tertiary);
            color: var(--text-tertiary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .copy-note {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-tertiary);
        }

        .bottom-section {
            display: flex;
            gap: var(--spacing-lg);
            flex: 1;
        }

        .stats-container {
            flex: 1;
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            min-height: 200px;
        }

        .history-container {
            flex: 1;
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            min-height: 200px;
        }

        .stats-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            background: var(--background-tertiary);
        }

        .stats-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .stats-content {
            padding: var(--spacing-lg);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm) 0;
            border-bottom: 1px solid var(--border-light);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-weight: 500;
            color: var(--text-secondary);
        }

        .stat-value {
            font-weight: 600;
            color: var(--primary-color);
        }

        .removed-params {
            margin-top: var(--spacing-md);
        }

        .param-tag {
            display: inline-block;
            background: var(--warning-light);
            color: var(--text-warning);
            padding: 2px var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            margin: 2px;
            font-family: var(--font-mono);
            position: relative;
            cursor: help;
        }

        .param-description {
            font-size: 10px;
            color: var(--text-tertiary);
            font-weight: normal;
            margin-left: 4px;
        }

        .history-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            background: var(--background-tertiary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .history-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .history-lifetime {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: 2px var(--spacing-sm);
            line-height: 1.4;
        }

        .history-content {
            padding: var(--spacing-md);
            overflow-y: auto;
            max-height: 300px;
        }

        .history-item {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--border-light);
            margin-bottom: var(--spacing-sm);
            background: var(--background-primary);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
        }

        .history-item:hover {
            background: var(--background-hover);
        }

        .history-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .history-time {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: var(--spacing-xs);
        }

        .history-urls {
            margin-bottom: var(--spacing-sm);
        }

        .history-url {
            font-family: var(--font-mono);
            font-size: 12px;
            word-break: break-all;
            margin-bottom: var(--spacing-xs);
            padding: var(--spacing-xs);
            border-radius: var(--radius-sm);
        }

        .history-url.original {
            background: color-mix(in srgb, var(--error-color) 12%, transparent);
            color: var(--text-secondary);
        }

        .history-url.cleaned {
            background: color-mix(in srgb, var(--success-color) 12%, transparent);
            color: var(--text-primary);
        }

        .history-actions {
            display: flex;
            gap: var(--spacing-xs);
            justify-content: flex-end;
        }

        .history-btn {
            padding: var(--spacing-xs) var(--spacing-sm);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .history-btn.restore {
            background: var(--warning-light);
            color: var(--text-warning);
        }

        .history-btn.copy {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .history-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .clear-history-btn {
            padding: var(--spacing-xs) var(--spacing-sm);
            background: var(--background-primary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .clear-history-btn:hover {
            background: var(--background-hover);
            color: var(--text-primary);
        }

        .empty-state {
            text-align: center;
            color: var(--text-tertiary);
            padding: var(--spacing-xl);
            font-style: italic;
        }

        .input-hint {
            margin: var(--spacing-sm) 0 0 0;
            font-size: 13px;
            color: var(--text-tertiary);
            line-height: 1.5;
        }

        .page-message {
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-size: 14px;
            line-height: 1.5;
        }

        .page-message[hidden] {
            display: none !important;
        }

        .page-message.is-error {
            background: color-mix(in srgb, var(--error-color) 12%, transparent);
            color: var(--text-error);
        }

        .page-message.is-success {
            background: color-mix(in srgb, var(--success-color) 12%, transparent);
            color: var(--success-color);
        }

        .result-line {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            gap: var(--spacing-sm);
            align-items: flex-start;
            margin-bottom: var(--spacing-sm);
        }

        .result-line-warning { grid-column: 1 / -1; word-break: normal; overflow-wrap: anywhere; }
        .result-original-button { grid-column: 1 / -1; justify-self: start; min-height: 44px; }
        #linkResultPager { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-sm); margin-block: var(--spacing-md); }
        #linkResultPager[hidden], #manualCopyPanel[hidden] { display: none; }
        #linkPageStatus { flex: 1 1 150px; font-size: 13px; color: var(--text-secondary); }
        #manualCopyResult { display: block; width: 100%; min-height: 120px; padding: var(--spacing-sm); margin-block: var(--spacing-sm); border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--background-primary); color: var(--text-primary); font: 14px/1.5 var(--font-mono); resize: vertical; }

        .result-line:last-child {
            margin-bottom: 0;
        }

        .result-line-status {
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 600;
            padding: 2px var(--spacing-sm);
            border-radius: var(--radius-sm);
        }

        .result-line-url {
            min-width: 0;
            word-break: break-all;
        }

        .result-line.is-cleaned .result-line-status {
            background: color-mix(in srgb, var(--success-color) 16%, transparent);
            color: var(--success-color);
        }

        .result-line.is-invalid .result-line-status {
            background: color-mix(in srgb, var(--error-color) 16%, transparent);
            color: var(--text-error);
        }

        .result-line.is-already-clean .result-line-status {
            background: var(--background-tertiary);
            color: var(--text-secondary);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .link-cleaner {
                padding: var(--spacing-md);
            }

            h1 {
                font-size: 24px;
            }

            .url-input {
                height: 100px;
            }

            .button-group {
                flex-direction: column;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--spacing-sm);
            }

            .copy-actions {
                flex-direction: column;
            }

            .copy-choice { flex: 0 1 auto; }

            .copy-button {
                align-self: flex-end;
            }

            .bottom-section {
                flex-direction: column;
            }
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-container {
            animation: fadeIn 0.3s ease;
        }

        /* 成功状态 */
        .success {
            color: var(--success-color);
        }

        .copy-success::after {
            content: " ✓";
            color: var(--success-color);
        }
    </style>
</head>

<body>
    <div class="link-cleaner">
        <h1><i class="fas fa-link"></i> 链接清理工具</h1>

        <div class="input-container">
            <label class="input-label" for="urlInput">
                <i class="fas fa-paste"></i> 输入需要清理的链接
            </label>
            <textarea id="urlInput" aria-label="待清理链接" class="url-input" placeholder="每行一个链接，没有 https:// 也可以，例如:
https://example.com/page?utm_source=google&utm_medium=cpc
www.google.com?utm_source=x"></textarea>
            <p class="input-hint">脏链接进来，干净链接出去。看不懂的行会标成「无法解析」。复制前会显示将复制和将跳过的行数。</p>
        </div>

        <div class="button-group">
            <button class="paste-button" onclick="pasteLinks()">
                <i class="fas fa-paste"></i>
                粘贴链接
            </button>
            <button class="clean-button" onclick="cleanLinks()">
                <i class="fas fa-broom"></i>
                清理链接
            </button>
            <button class="clear-button" onclick="clearAll()">
                <i class="fas fa-eraser"></i>
                清空
            </button>
        </div>

        <p>最多100万字符、2000行链接。结果按50行显示，复制仍完整。原参数编码保留，签名链接可回退原文。</p>
        <div id="pageMessage" class="page-message" hidden></div>

        <div class="result-container" id="resultContainer" style="display: none;">
            <div class="result-header">
                <div class="result-label">
                    <i class="fas fa-check-circle"></i>
                    清理后的链接
                </div>
            </div>
            <p class="result-summary" id="resultSummary" aria-live="polite"></p>
            <div class="result-value" id="resultValue"></div>
            <div id="linkResultPager" hidden>
                <button type="button" id="linkPreviousPage" class="btn btn-secondary">上一批</button>
                <span id="linkPageStatus" role="status"></span>
                <button type="button" id="linkNextPage" class="btn btn-secondary">下一批</button>
            </div>
            <div id="manualCopyPanel" hidden>
                <label for="manualCopyResult">复制未成功，请从这里手动复制完整结果</label>
                <textarea id="manualCopyResult" readonly></textarea>
            </div>
            <div class="copy-panel">
                <p class="copy-summary" id="copySummary"></p>
                <div class="copy-actions">
                    <div class="copy-choice">
                        <button type="button" class="copy-new-button" id="copyValidBtn" aria-describedby="copyValidNote" onclick="copyValidLinks()" disabled>
                            <i class="fas fa-copy"></i>
                            只复制有效链接
                        </button>
                        <p class="copy-note" id="copyValidNote"></p>
                    </div>
                    <div class="copy-choice">
                        <button type="button" class="copy-keep-button" id="copyKeepInvalidBtn" aria-describedby="copyKeepNote" onclick="copyKeepInvalidLinks()" disabled>
                            <i class="fas fa-copy"></i>
                            保留无效行
                        </button>
                        <p class="copy-note" id="copyKeepNote"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-section">
            <div class="stats-container">
                <div class="stats-header">
                    <h3 class="stats-title">
                        <i class="fas fa-chart-bar"></i>
                        清理统计
                    </h3>
                </div>
                <div class="stats-content" id="statsContent">
                    <div class="empty-state">
                        <i class="fas fa-info-circle"></i><br>
                        输入链接后查看清理统计
                    </div>
                </div>
            </div>

            <div class="history-container">
                <div class="history-header">
                    <h3 class="history-title">
                        <i class="fas fa-history"></i>
                        清理历史
                        <span class="history-lifetime">仅本次页面</span>
                    </h3>
                    <button class="clear-history-btn" onclick="clearCleaningHistory()" id="clearHistoryBtn"
                        style="display: none;">
                        <i class="fas fa-trash"></i>
                        清空
                    </button>
                </div>
                <div class="history-content" id="historyContent">
                    <div class="empty-state">
                        <i class="fas fa-clock"></i><br>
                        暂无清理历史
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/text-budget-core.js"></script>
    <script src="../js/clipboard.js"></script>
    <script src="../js/link-cleaner-core.js"></script>
    <script>
        const core = window.LinkCleanerCore;
        const MESSAGES = core.MESSAGES;

        // 参数说明字典
        const paramDescriptions = {
            // Google Analytics & Ads
            'utm_source': '流量来源',
            'utm_medium': '营销媒介',
            'utm_campaign': '推广活动',
            'utm_term': '关键词',
            'utm_content': '广告内容',
            'gclid': 'Google点击ID',
            'gclsrc': 'Google点击源',
            'dclid': '展示广告点击ID',
            'gbraid': 'Google品牌广告ID',
            'wbraid': 'Web品牌广告ID',

            // Facebook
            'fbclid': 'Facebook点击ID',
            'fb_action_ids': 'Facebook行为ID',
            'fb_action_types': 'Facebook行为类型',
            'fb_source': 'Facebook来源',
            'fb_ref': 'Facebook引用',

            // Twitter
            'twclid': 'Twitter点击ID',
            'ref_src': '引用源',
            'ref_url': '引用URL',

            // LinkedIn
            'li_fat_id': 'LinkedIn跟踪ID',
            'trk': 'LinkedIn跟踪',
            'trkCampaign': 'LinkedIn活动',

            // TikTok
            'ttclid': 'TikTok点击ID',

            // Microsoft/Bing
            'msclkid': '微软点击ID',

            // Amazon
            'tag': '联盟标签',
            'ref_': '推荐人',
            'ref': '引用',
            'pf_rd_': '产品推荐',
            'keywords': '关键词',

            // Email tracking
            'mc_cid': '邮件活动ID',
            'mc_eid': '邮件订阅ID',
            'mkt_tok': '营销令牌',

            // General tracking
            '_ga': 'Google分析',
            '_gl': 'Google链接',
            'igshid': 'Instagram分享ID',
            'si': '分享信息',
            'feature': '功能标识',
            'app': '应用标识',
            'ved': '验证数据',
            'sa': '搜索行为',
            'usg': '用户生成',
            'cd': '自定义维度',
            'cad': '广告数据',
            'rct': '推荐类型',
            'q': '查询参数',
            'esrc': '事件源',
            'source': '来源',
            'medium': '媒介',
            'campaign': '活动',
            'content': '内容',
            'term': '术语',

            // Shopify
            'variant': '产品变体',
            '_pos': '位置信息',
            '_sid': '会话ID',
            '_ss': '会话状态',

            // Other
            'spm': '页面标识',
            'scm': '场景标识',
            'from': '来源页面',
            'share_medium': '分享媒介',
            'share_source': '分享来源',
            'vn_medium': '越南媒介',
            'vn_campaign': '越南活动',
            'vn_source': '越南来源',
            'vn_term': '越南术语',
            'vn_content': '越南内容'
        };

        let cleaningStats = {
            totalLinks: 0,
            cleanedLinks: 0,
            alreadyCleanLinks: 0,
            invalidLinks: 0,
            removedParams: []
        };

        let cleaningHistory = [];
        let lastCleanResult = core.cleanInput('');
        let linkResultPage = 0;
        const LINK_PAGE_SIZE = 50;
        let messageTimer = null;

        function cleanSingleLink(url) {
            return core.cleanSingleLink(url);
        }

        function showPageMessage(text, kind) {
            const el = document.getElementById('pageMessage');
            if (messageTimer) {
                clearTimeout(messageTimer);
                messageTimer = null;
            }
            if (!text) {
                el.hidden = true;
                el.textContent = '';
                el.className = 'page-message';
                return;
            }
            el.hidden = false;
            el.className = 'page-message is-' + (kind === 'success' ? 'success' : 'error');
            el.textContent = text;
            if (kind === 'success') {
                messageTimer = setTimeout(function () {
                    showPageMessage('', '');
                }, 2000);
            }
        }

        function setButtonLabel(button, iconClass, label) {
            clearElement(button);
            appendIcon(button, iconClass);
            button.append(' ' + label);
        }

        function renderCopyNotes(result) {
            const summary = result && result.summary ? result.summary : '原始 0 行，有效 0 行，跳过 0 行';
            const validNote = result && result.validCopyNote ? result.validCopyNote : '将复制 0 行，跳过 0 行';
            const keepNote = result && result.keepCopyNote ? result.keepCopyNote : '将复制 0 行，其中 0 行保留无效占位';
            document.getElementById('resultSummary').textContent = summary;
            document.getElementById('copySummary').textContent = summary;
            document.getElementById('copyValidNote').textContent = validNote;
            document.getElementById('copyKeepNote').textContent = keepNote;
        }

        function setCopyButtonsDisabled(validDisabled, keepDisabled) {
            document.getElementById('copyValidBtn').disabled = validDisabled;
            document.getElementById('copyKeepInvalidBtn').disabled = keepDisabled;
        }

        function renderResultLines(lines) {
            const resultValue = document.getElementById('resultValue');
            clearElement(resultValue);
            lines.slice(linkResultPage * LINK_PAGE_SIZE, (linkResultPage + 1) * LINK_PAGE_SIZE).forEach(function (line) {
                const row = document.createElement('div');
                row.className = 'result-line is-' + line.status;
                row.setAttribute('data-status', line.status);

                const badge = document.createElement('span');
                badge.className = 'result-line-status';
                badge.textContent = line.statusLabel;

                const url = document.createElement('span');
                url.className = 'result-line-url';
                url.textContent = line.url;

                row.append(badge, url);
                if (line.warning) {
                    const note = document.createElement('span');
                    note.className = 'result-line-warning';
                    note.textContent = line.warning;
                    const original = document.createElement('button');
                    original.type = 'button';
                    original.className = 'btn btn-secondary result-original-button';
                    original.textContent = '复制原链接';
                    original.addEventListener('click', async function () {
                        try { await writeClipboard(line.original); showPageMessage('已复制原链接', 'success'); }
                        catch (error) { showPageMessage(error.message, 'error'); }
                    });
                    row.append(note, original);
                }
                resultValue.appendChild(row);
            });
            const pages = Math.max(1, Math.ceil(lines.length / LINK_PAGE_SIZE));
            document.getElementById('linkResultPager').hidden = pages <= 1;
            document.getElementById('linkPageStatus').textContent = '第' + (linkResultPage + 1) + '/' + pages + '批；复制仍包含全部有效结果';
            document.getElementById('linkPreviousPage').disabled = linkResultPage === 0;
            document.getElementById('linkNextPage').disabled = linkResultPage >= pages - 1;
        }
        document.getElementById('linkPreviousPage').addEventListener('click', function () {
            linkResultPage = Math.max(0, linkResultPage - 1); renderResultLines(lastCleanResult.lines);
        });
        document.getElementById('linkNextPage').addEventListener('click', function () {
            linkResultPage = Math.min(Math.ceil(lastCleanResult.lines.length / LINK_PAGE_SIZE) - 1, linkResultPage + 1); renderResultLines(lastCleanResult.lines);
        });

        function renderEmptyStats() {
            const statsContent = document.getElementById('statsContent');
            clearElement(statsContent);
            const emptyState = document.createElement('div');
            emptyState.className = 'empty-state';
            appendIcon(emptyState, 'fas fa-info-circle');
            emptyState.appendChild(document.createElement('br'));
            emptyState.append('输入链接后查看清理统计');
            statsContent.appendChild(emptyState);
        }

        async function writeClipboard(text) {
            const result = await ToolsClipboard.copyText(text);
            if (!result.ok) {
                const output = document.getElementById('manualCopyResult');
                output.value = text;
                document.getElementById('manualCopyPanel').hidden = false;
                output.focus();
                output.select();
                throw new Error(result.message);
            }
            document.getElementById('manualCopyPanel').hidden = true;
        }

        const copyFeedbackTimers = new WeakMap();
        function restoreCopyButton(button, icon, label) {
            clearTimeout(copyFeedbackTimers.get(button));
            copyFeedbackTimers.delete(button);
            setButtonLabel(button, icon, label);
        }
        function flashButton(button, iconClass, label, restoreIcon, restoreLabel, ms) {
            clearTimeout(copyFeedbackTimers.get(button));
            setButtonLabel(button, iconClass, label);
            copyFeedbackTimers.set(button, setTimeout(function () {
                restoreCopyButton(button, restoreIcon, restoreLabel);
            }, ms));
        }

        function cleanLinks() {
            const input = document.getElementById('urlInput').value;
            let result;
            try { result = core.cleanInput(input); }
            catch (error) { showPageMessage(error.message, 'error'); return; }
            lastCleanResult = result;
            linkResultPage = 0;

            if (result.empty) {
                showPageMessage(MESSAGES.emptyInput, 'error');
                document.getElementById('resultContainer').style.display = 'none';
                setCopyButtonsDisabled(true, true);
                return;
            }

            showPageMessage('', '');
            cleaningStats = result.stats;

            const timestamp = new Date().toLocaleString();
            const historyItems = result.lines
                .map(function (line) {
                    return core.historyItemFromLine(line, timestamp);
                })
                .filter(Boolean);
            cleaningHistory = core.appendHistory(cleaningHistory, historyItems);
            updateHistory();

            const resultContainer = document.getElementById('resultContainer');
            renderResultLines(result.lines);
            renderCopyNotes(result);
            resultContainer.style.display = 'block';
            setCopyButtonsDisabled(result.copyText.length === 0, result.lines.length === 0);

            updateStats();
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function updateStats() {
            const statsContent = document.getElementById('statsContent');
            const uniqueRemovedParams = [...new Set(cleaningStats.removedParams)];

            clearElement(statsContent);
            statsContent.appendChild(createStatItem('处理链接数', cleaningStats.totalLinks));
            statsContent.appendChild(createStatItem('已清理', cleaningStats.cleanedLinks));
            statsContent.appendChild(createStatItem('本来就干净', cleaningStats.alreadyCleanLinks));
            statsContent.appendChild(createStatItem('无法解析', cleaningStats.invalidLinks));
            statsContent.appendChild(createStatItem('移除参数数', cleaningStats.removedParams.length));

            if (uniqueRemovedParams.length > 0) {
                const removedParams = document.createElement('div');
                removedParams.className = 'removed-params';

                const title = document.createElement('div');
                title.style.marginBottom = 'var(--spacing-sm)';
                title.style.fontWeight = '500';
                title.style.color = 'var(--text-secondary)';
                appendIcon(title, 'fas fa-tags');
                title.append(' 移除的参数:');
                removedParams.appendChild(title);

                uniqueRemovedParams.forEach(function (param) {
                    const tag = document.createElement('span');
                    tag.className = 'param-tag';
                    tag.append(param);

                    const description = document.createElement('span');
                    description.className = 'param-description';
                    description.textContent = '(' + (paramDescriptions[param] || paramDescriptions[param.toLowerCase()] || '追踪参数') + ')';
                    tag.appendChild(description);
                    removedParams.appendChild(tag);
                });

                statsContent.appendChild(removedParams);
            }
        }

        function updateHistory() {
            const historyContent = document.getElementById('historyContent');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            clearElement(historyContent);

            if (cleaningHistory.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                appendIcon(emptyState, 'fas fa-clock');
                emptyState.appendChild(document.createElement('br'));
                emptyState.append('暂无清理历史');
                historyContent.appendChild(emptyState);
                clearHistoryBtn.style.display = 'none';
                return;
            }

            clearHistoryBtn.style.display = 'flex';
            cleaningHistory.forEach(item => {
                historyContent.appendChild(createHistoryItem(item));
            });
        }

        function clearElement(element) {
            while (element.firstChild) {
                element.removeChild(element.firstChild);
            }
        }

        function appendIcon(parent, className) {
            const icon = document.createElement('i');
            icon.className = className;
            parent.appendChild(icon);
            return icon;
        }

        function createStatItem(label, value) {
            const item = document.createElement('div');
            item.className = 'stat-item';

            const labelEl = document.createElement('span');
            labelEl.className = 'stat-label';
            labelEl.textContent = label;

            const valueEl = document.createElement('span');
            valueEl.className = 'stat-value';
            valueEl.textContent = value;

            item.append(labelEl, valueEl);
            return item;
        }

        function createHistoryItem(item) {
            const wrapper = document.createElement('div');
            wrapper.className = 'history-item';

            const time = document.createElement('div');
            time.className = 'history-time';
            appendIcon(time, 'fas fa-clock');
            time.append(` ${item.timestamp}`);

            const urls = document.createElement('div');
            urls.className = 'history-urls';
            urls.append(
                createHistoryUrl('original', '原链接:', item.original),
                createHistoryUrl('cleaned', '清理后:', item.cleaned)
            );

            const actions = document.createElement('div');
            actions.className = 'history-actions';
            actions.append(
                createHistoryButton('restore', 'fas fa-undo', '还原', () => restoreLink(item.original)),
                createHistoryButton('copy', 'fas fa-copy', '复制原链接', (button) => copyHistoryLink(item.original, 'original', button)),
                createHistoryButton('copy', 'fas fa-copy', '复制新链接', (button) => copyHistoryLink(item.cleaned, 'cleaned', button))
            );

            wrapper.append(time, urls, actions);
            return wrapper;
        }

        function createHistoryUrl(type, label, value) {
            const row = document.createElement('div');
            row.className = `history-url ${type}`;

            const strong = document.createElement('strong');
            strong.textContent = label;
            row.append(strong, ` ${value}`);
            return row;
        }

        function createHistoryButton(type, iconClass, label, handler) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `history-btn ${type}`;
            appendIcon(button, iconClass);
            button.append(` ${label}`);
            button.addEventListener('click', () => handler(button));
            return button;
        }

        function restoreLink(originalUrl) {
            document.getElementById('urlInput').value = originalUrl;
            document.getElementById('urlInput').focus();
        }

        function pasteLinks() {
            if (!navigator.clipboard || typeof navigator.clipboard.readText !== 'function') {
                showPageMessage(MESSAGES.clipboardDenied, 'error');
                return;
            }
            navigator.clipboard.readText().then(function (text) {
                const urlInput = document.getElementById('urlInput');
                urlInput.value = text;
                urlInput.focus();
                showPageMessage('', '');
            }).catch(function () {
                showPageMessage(MESSAGES.clipboardDenied, 'error');
            });
        }

        function copyPrepared(text, button, restoreLabel, successMessage) {
            if (!text) {
                showPageMessage(MESSAGES.nothingToCopy, 'error');
                return;
            }

            writeClipboard(text).then(function () {
                flashButton(button, 'fas fa-check', '已复制', 'fas fa-copy', restoreLabel, 2000);
                showPageMessage(successMessage, 'success');
            }).catch(function () {
                restoreCopyButton(button, 'fas fa-copy', restoreLabel);
                showPageMessage(MESSAGES.copyFailed, 'error');
            });
        }

        function copyValidLinks() {
            const result = lastCleanResult;
            copyPrepared(
                result && result.copyText,
                document.getElementById('copyValidBtn'),
                '只复制有效链接',
                MESSAGES.copiedValid
            );
        }

        function copyKeepInvalidLinks() {
            const result = lastCleanResult;
            copyPrepared(
                result && result.copyTextKeepInvalid,
                document.getElementById('copyKeepInvalidBtn'),
                '保留无效行',
                MESSAGES.copiedKeepInvalid
            );
        }

        function copyHistoryLink(url, type, button) {
            writeClipboard(url).then(function () {
                const typeText = type === 'original' ? '原链接' : '新链接';
                const restoreLabel = type === 'original' ? '复制原链接' : '复制新链接';
                flashButton(button, 'fas fa-check', '已复制' + typeText, 'fas fa-copy', restoreLabel, 1500);
                showPageMessage(MESSAGES.copied, 'success');
            }).catch(function () {
                restoreCopyButton(button, 'fas fa-copy', type === 'original' ? '复制原链接' : '复制新链接');
                showPageMessage(MESSAGES.copyFailed, 'error');
            });
        }

        function clearCleaningHistory() {
            if (cleaningHistory.length === 0) return;
            cleaningHistory = [];
            updateHistory();
        }

        function clearAll() {
            document.getElementById('urlInput').value = '';
            document.getElementById('resultContainer').style.display = 'none';
            setCopyButtonsDisabled(true, true);
            lastCleanResult = core.cleanInput('');
            renderCopyNotes(lastCleanResult);
            showPageMessage('', '');
            renderEmptyStats();
            document.getElementById('urlInput').focus();
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('urlInput').focus();
        });
    </script>
    <script src="../js/unsaved-guard.js"></script>
    <script src="../js/theme.js"></script>
</body>
