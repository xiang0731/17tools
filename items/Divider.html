<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <script>
        (function applyThemeEarly() {
            try {
                var pref = localStorage.getItem('17tools-theme');
                if (pref == null) {
                    pref = localStorage.getItem('theme');
                    if (pref != null) {
                        localStorage.setItem('17tools-theme', pref);
                    }
                }
                var theme = (pref === 'light' || pref === 'dark')
                    ? pref
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* 存储不可用时由 theme.js 降级 */ }
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本分割工具</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link href="../vendor/fontawesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* Fallback colors if theme.css is missing or incomplete */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --transition-fast: 0.2s ease;
            --font-mono: 'Menlo', 'Monaco', 'Courier New', monospace;

            --error-color: #ff4d4f;
            --warning-color: #faad14;
            --success-color: #52c41a;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        body {
            min-height: 100vh;
            padding: var(--spacing-lg);
            background-color: var(--background-primary);
            color: var(--text-primary);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            gap: var(--spacing-lg);
            padding-bottom: var(--spacing-xl);
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin: 0 0 var(--spacing-xl) 0;
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        /* Input Section */
        .input-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-lg);
        }

        .input-container {
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            transition: box-shadow var(--transition-fast);
        }

        .input-container:focus-within {
            box-shadow: var(--shadow-md);
            border-color: var(--border-focus);
        }

        .input-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            font-weight: 600;
            font-size: 18px;
            color: var(--text-primary);
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            line-height: 1.6;
            font-family: var(--font-mono);
            background-color: var(--background-primary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* Control Panel */
        .control-panel {
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
        }

        .control-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            font-weight: 600;
            font-size: 18px;
            color: var(--text-primary);
        }

        .settings-inputs {
            display: grid;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .input-label {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        input[type="number"] {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            background-color: var(--background-primary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* Buttons */
        .button-container {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            user-select: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--text-inverse);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--background-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--background-hover);
        }

        /* Input Stats Styles */
        .input-stats {
            margin-left: auto;
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        /* Settings Monitoring Styles */
        .monitor-panel {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
            font-size: 13px;
            color: var(--text-tertiary);
            padding: var(--spacing-sm) 0;
            border-bottom: 1px dashed var(--border-color);
            margin-bottom: var(--spacing-md);
        }

        .monitor-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .monitor-label {
            font-weight: 500;
        }

        /* Summary Style */
        .split-summary {
            background: var(--primary-light);
            border-left: 4px solid var(--primary-color);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            animation: fadeIn 0.3s ease;
        }

        .summary-title {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: var(--spacing-sm);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-md);
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .summary-val {
            font-weight: 600;
            color: var(--text-primary);
        }

        .last-part-warning {
            color: var(--warning-color);
            font-size: 12px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .empty-warning {
            color: var(--warning-color);
            display: none;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        /* Result Section */
        .result-section {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .result-block {
            background: var(--background-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            animation: fadeIn 0.3s ease;
        }

        .result-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        .result-block-title {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 16px;
        }

        .result-block-meta {
            color: var(--text-tertiary);
            font-size: 14px;
            margin-left: 10px;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: var(--background-secondary);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            width: min(280px, calc(100vw - 32px));
            max-width: 90vw;
            animation: toastSlideDown 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            pointer-events: auto;
            border-left: 4px solid var(--primary-color);
        }

        .toast.success {
            border-left-color: var(--success-color);
        }

        .toast.error {
            border-left-color: var(--error-color);
        }

        .toast.warning {
            border-left-color: var(--warning-color);
        }

        .toast-icon {
            font-size: 18px;
        }

        .toast.success .toast-icon {
            color: var(--success-color);
        }

        .toast.error .toast-icon {
            color: var(--error-color);
        }

        .toast.warning .toast-icon {
            color: var(--warning-color);
        }

        .toast-message {
            font-size: 14px;
            font-weight: 500;
        }

        @keyframes toastSlideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes toastFadeOut {
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container,
        .input-section,
        .input-container,
        .control-panel,
        .result-section,
        .result-block,
        .split-summary {
            min-width: 0;
            max-width: 100%;
        }

        textarea,
        input[type="number"] {
            max-width: 100%;
        }

        .input-header,
        .button-container,
        .split-pager {
            flex-wrap: wrap;
        }

        .result-block-title,
        .result-block-meta {
            min-width: 0;
        }

        .split-pager {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .split-note {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        @media (max-width: 420px) {
            body {
                padding: var(--spacing-md);
            }

            h1 {
                font-size: 22px;
            }

            .input-header,
            .result-block-header {
                align-items: flex-start;
            }

            .result-block-header {
                flex-direction: column;
            }

            .result-block-meta {
                display: block;
                margin-left: 0;
            }

            .input-stats {
                margin-left: 0;
            }

            .settings-inputs {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>
            <i class="fas fa-columns"></i>
            文本分割工具
        </h1>

        <!-- Input Area -->
        <div class="input-section">
            <div class="input-container">
                <div class="input-header">
                    <i class="fas fa-file-alt"></i>
                    原始数据
                </div>
                <textarea id="originalText" aria-label="待分割原文" placeholder="请在此粘贴需要分割的多行数据..."></textarea>
                <div class="button-container">
                    <button class="btn btn-secondary" onclick="pasteFromClipboard()">
                        <i class="fas fa-paste"></i>
                        粘贴
                    </button>
                    <button class="btn btn-secondary" onclick="clearText()">
                        <i class="fas fa-trash"></i>
                        清空
                    </button>
                    <div class="input-stats">
                        <span id="lineCount">共 0 行</span>
                        <span id="emptyLineWarning" class="empty-warning">
                            <i class="fas fa-exclamation-triangle"></i> 包含空行
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Area -->
        <div class="control-panel">
            <div class="control-header">
                <i class="fas fa-sliders-h"></i>
                分割设置
            </div>

            <!-- Monitoring Panel -->
            <div class="monitor-panel">
                <div class="monitor-item">
                    <span class="monitor-label"><i class="fas fa-edit"></i> 原始数据最后修改:</span>
                    <span id="lastModified">-</span>
                </div>
                <div class="monitor-item">
                    <span class="monitor-label"><i class="fas fa-clock"></i> 分割执行时间:</span>
                    <span id="splitExecutionTime">-</span>
                </div>
            </div>

            <div class="settings-inputs">
                <div class="input-group">
                    <label class="input-label" for="linesPerPart">
                        <i class="fas fa-list-ol"></i>
                        每份行数
                    </label>
                    <input type="number" id="linesPerPart" value="5" min="1" step="1">
                </div>
            </div>
            <div class="button-container">
                <button class="btn btn-primary" onclick="splitText()">
                    <i class="fas fa-cut"></i>
                    开始分割
                </button>
            </div>
        </div>

        <!-- Results Area -->
        <div class="result-section" id="resultContainer">
            <!-- Results will be injected here -->
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/clipboard.js"></script>
    <script src="../js/text-split-core.js"></script>
    <script src="../js/unsaved-guard.js"></script>
    <script src="../js/theme.js"></script>
    <script>
        var splitResult = null;
        var splitPageIndex = 0;

        // Real-time Stats Logic
        function updateStats() {
            const text = document.getElementById('originalText').value;

            // Update last modified time
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' +
                now.getMinutes().toString().padStart(2, '0') + ':' +
                now.getSeconds().toString().padStart(2, '0');
            document.getElementById('lastModified').textContent = timeStr;

            if (text === '') {
                document.getElementById('lineCount').textContent = '共 0 行';
                document.getElementById('emptyLineWarning').style.display = 'none';
                return;
            }

            if (text.length > TextSplitCore.MAX_INPUT_CHARS) {
                document.getElementById('lineCount').textContent = '超过100万字符，请缩小文本';
                return;
            }
            let totalLines = 1, hasEmptyLines = false, start = 0;
            const separators = /\r\n|\r|\n/g;
            let match;
            while ((match = separators.exec(text))) {
                if (!text.slice(start, match.index).trim()) hasEmptyLines = true;
                start = separators.lastIndex;
                totalLines++;
            }
            if (!text.slice(start).trim()) hasEmptyLines = true;
            document.getElementById('lineCount').textContent = `共 ${totalLines} 行`;
            document.getElementById('emptyLineWarning').style.display = hasEmptyLines ? 'inline-flex' : 'none';
        }

        // Attach event listener
        document.getElementById('originalText').addEventListener('input', updateStats);

        // Split Logic
        function splitText() {
            var originalText = document.getElementById('originalText').value;
            var linesPerPart = Number(document.getElementById('linesPerPart').value);
            var now = new Date();
            var timeStr = now.getHours().toString().padStart(2, '0') + ':' +
                now.getMinutes().toString().padStart(2, '0') + ':' +
                now.getSeconds().toString().padStart(2, '0');
            document.getElementById('splitExecutionTime').textContent = timeStr;

            splitResult = TextSplitCore.splitText(originalText, linesPerPart);
            splitPageIndex = 0;
            renderSplitResult();

            if (!splitResult.ok) {
                showToast(splitResult.reason, 'warning');
                return;
            }
            showToast('共 ' + splitResult.totalLines + ' 行，分割为 ' + splitResult.partsCount + ' 份', 'success');
        }

        function renderSplitResult() {
            var resultContainer = document.getElementById('resultContainer');
            resultContainer.replaceChildren();
            if (!splitResult) return;

            if (!splitResult.ok) {
                var note = document.createElement('div');
                note.id = 'splitNotice';
                note.className = 'split-summary';
                note.textContent = splitResult.reason;
                resultContainer.appendChild(note);
                return;
            }

            resultContainer.appendChild(buildSummary(splitResult));

            var windowInfo = TextSplitCore.pageWindow(splitResult.partsCount, splitPageIndex);
            splitPageIndex = windowInfo.page;
            if (windowInfo.truncated) {
                resultContainer.appendChild(buildPager(windowInfo, splitResult.partsCount));
                var budget = document.createElement('p');
                budget.id = 'splitNotice';
                budget.className = 'split-note';
                budget.textContent = TextSplitCore.displayBudgetMessage();
                resultContainer.appendChild(budget);
            }

            TextSplitCore.visibleParts(splitResult, splitPageIndex).forEach(function (part) {
                resultContainer.appendChild(buildPartBlock(part));
            });
        }

        function buildSummary(result) {
            var summary = document.createElement('div');
            summary.className = 'split-summary';

            var title = document.createElement('div');
            title.className = 'summary-title';
            var titleIcon = document.createElement('i');
            titleIcon.className = 'fas fa-chart-pie';
            titleIcon.setAttribute('aria-hidden', 'true');
            title.append(titleIcon, document.createTextNode(' 分割总结'));

            var grid = document.createElement('div');
            grid.className = 'summary-grid';
            grid.append(
                summaryItem('总行数', String(result.totalLines)),
                summaryItem('每份行数', String(result.linesPerPart)),
                summaryItem('分割总份数', String(result.partsCount))
            );
            summary.append(title, grid);

            if (result.lastPartIncomplete) {
                var warning = document.createElement('div');
                warning.className = 'last-part-warning';
                var warningIcon = document.createElement('i');
                warningIcon.className = 'fas fa-info-circle';
                warningIcon.setAttribute('aria-hidden', 'true');
                warning.append(warningIcon, document.createTextNode(
                    ' 最后一份不满 ' + result.linesPerPart + ' 行 (实际: ' + result.lastPartLines + ' 行)'
                ));
                summary.appendChild(warning);
            }

            var actions = document.createElement('div');
            actions.className = 'button-container';
            var copyAll = makeButton('全部复制', 'fa-copy', copyAllParts);
            copyAll.id = 'splitCopyAll';
            var downloadAll = makeButton('全部下载', 'fa-download', downloadAllParts);
            downloadAll.id = 'splitDownloadAll';
            actions.append(copyAll, downloadAll);
            summary.appendChild(actions);
            return summary;
        }

        function summaryItem(label, value) {
            var item = document.createElement('div');
            item.className = 'summary-item';
            var name = document.createElement('span');
            name.className = 'monitor-label';
            name.textContent = label;
            var val = document.createElement('span');
            val.className = 'summary-val';
            val.textContent = value;
            item.append(name, val);
            return item;
        }

        function buildPager(windowInfo, partsCount) {
            var pager = document.createElement('div');
            pager.className = 'split-pager';
            pager.id = 'splitPager';
            var prev = makeButton('上一批', 'fa-arrow-left', function () {
                showSplitPage(splitPageIndex - 1);
            });
            prev.id = 'splitPrev';
            prev.disabled = windowInfo.page <= 0;
            var label = document.createElement('span');
            label.id = 'splitPageLabel';
            label.textContent = '第 ' + (windowInfo.page + 1) + ' / ' + windowInfo.pageCount +
                ' 批，本批 ' + windowInfo.count + ' 份，共 ' + partsCount + ' 份';
            var next = makeButton('下一批', 'fa-arrow-right', function () {
                showSplitPage(splitPageIndex + 1);
            });
            next.id = 'splitNext';
            next.disabled = windowInfo.page >= windowInfo.pageCount - 1;
            pager.append(prev, label, next);
            return pager;
        }

        function buildPartBlock(part) {
            var block = document.createElement('div');
            block.className = 'result-block';
            block.dataset.partIndex = String(part.index);

            var header = document.createElement('div');
            header.className = 'result-block-header';
            var title = document.createElement('div');
            title.className = 'result-block-title';
            title.appendChild(document.createTextNode('第 ' + part.number + ' 份'));
            var meta = document.createElement('span');
            meta.className = 'result-block-meta';
            meta.textContent = '(行 ' + part.startLine + ' - ' + part.endLine + ', 共 ' + part.lineCount + ' 行)';
            title.appendChild(meta);

            var actions = document.createElement('div');
            actions.className = 'button-container';
            actions.append(
                makeButton('复制', 'fa-copy', function () { copyPart(part.index); }),
                makeButton('下载', 'fa-download', function () { downloadPart(part.index); })
            );
            header.append(title, actions);

            var textarea = document.createElement('textarea');
            textarea.id = 'part-' + part.index;
            textarea.setAttribute('aria-label', '第' + part.number + '份，原文第' + part.startLine + '至' + part.endLine + '行');
            textarea.readOnly = true;
            textarea.value = part.text;
            block.append(header, textarea);
            return block;
        }

        function makeButton(label, iconClass, onClick) {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'btn btn-secondary';
            var icon = document.createElement('i');
            icon.className = 'fas ' + iconClass;
            icon.setAttribute('aria-hidden', 'true');
            var text = document.createElement('span');
            text.textContent = label;
            button.append(icon, text);
            button.addEventListener('click', onClick);
            return button;
        }

        function showSplitPage(pageIndex) {
            if (!splitResult || !splitResult.ok) return;
            splitPageIndex = pageIndex;
            renderSplitResult();
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('originalText').value = text;
                updateStats();
                showToast('已粘贴', 'success');
            } catch (err) {
                showToast('粘贴失败，请手动粘贴', 'error');
            }
        }

        function clearText() {
            if (confirm('确定清空输入吗？')) {
                document.getElementById('originalText').value = '';
                splitResult = null;
                splitPageIndex = 0;
                document.getElementById('resultContainer').replaceChildren();
                updateStats();
            }
        }

        function copyPart(index) {
            if (!splitResult || !splitResult.ok) return;
            copyText(TextSplitCore.exportPartText(splitResult, index), document.getElementById('part-' + index));
        }

        function downloadPart(index) {
            if (!splitResult || !splitResult.ok) return;
            var part = splitResult.parts[index];
            if (!part) return;
            downloadText(part.text, part.filename);
        }

        function copyAllParts() {
            if (!splitResult || !splitResult.ok) return;
            copyText(TextSplitCore.exportAllText(splitResult), document.getElementById('originalText'));
        }

        function downloadAllParts() {
            if (!splitResult || !splitResult.ok) return;
            downloadText(TextSplitCore.exportAllText(splitResult), 'split_all.txt');
        }

        async function copyText(text, element) {
            var result = await ToolsClipboard.copyText(text, { element: element });
            showToast(result.message, result.ok ? 'success' : 'error');
        }

        function downloadText(text, filename) {
            var blob = new Blob([text], { type: 'text/plain' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('开始下载', 'success');
        }

        // Toast System (reused)
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = document.createElement('i');
            icon.className = `fas ${icons[type] || icons.info} toast-icon`;
            const text = document.createElement('span');
            text.className = 'toast-message';
            text.textContent = message;
            toast.append(icon, text);
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastFadeOut 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>

</html>
